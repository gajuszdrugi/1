        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video, audio {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        iframe {
            width: 102%;
            height: 102%;
            border: none;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #trigger-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 9999;
        }

        #sidebar {
            position: absolute;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(0,0,0,0.95);
            transition: left 0.3s;
            z-index: 10000;
            overflow-y: auto;
            padding: 20px 10px;
            border-right: 1px solid #333;
            scrollbar-width: none;
        }

        #sidebar::-webkit-scrollbar {
            display: none;
        }

        #trigger-zone:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        .channel-item {
            padding: 12px;
            margin-bottom: 5px;
            background: #1a1a1a;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .channel-item:hover {
            background: #333;
        }

        .channel-item.active {
            background: #ff333d;
            color: #fff;
        }

        .channel-number {
            font-weight: bold;
            margin-right: 10px;
            min-width: 30px;
        }

        #channel-display {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 5px;
            z-index: 9998;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #channel-display.show {
            opacity: 1;
        }

        #fullscreen-btn {
            position: absolute;
            right: 20px;
            bottom: calc(20px + 57px);
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #fff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
            transition: opacity 0.5s;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #stream-status {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 9998;
            padding: 8px 14px;
            background: rgba(0,0,0,0.75);
            border-radius: 5px;
            font-size: 13px;
            color: #ddd;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #stream-status.show {
            opacity: 1;
        }

        #stream-status.error {
            color: #ff7777;
        }

        #stream-status.ok {
            color: #8cff8c;
        }
    </style>
</head>

 * już przez niego przepuszczane.
 *
 * To eliminuje problemy z CORS,
 * które mogą powodować ciszę.
 */

let audioCtx = null;
let audioSourceNode = null;
let gainNode = null;
let compressorNode = null;


/* ============================================================
   KONFIGURACJA AUTOMATYCZNEGO HLS
   ============================================================ */

const HLS_CONFIG = {

    startupTimeout: 9000,

    retriesPerUrl: 2,

    retryDelay: 1200,

    maxFatalErrorsPerUrl: 2
};


/* ============================================================
   STATUS
   ============================================================ */

function showStreamStatus(
    text,
    type = ''
) {

    streamStatus.textContent =
        text;

    streamStatus.classList.remove(
        'show',
        'error',
        'ok'
    );

    if (type) {

        streamStatus.classList.add(
            type
        );
    }

    streamStatus.classList.add(
        'show'
    );
}


function hideStreamStatus() {

    streamStatus.classList.remove(
        'show',
        'error',
        'ok'
    );
}


/* ============================================================
   CZYSZCZENIE ODTWARZACZA
   ============================================================ */

function destroyCurrentPlayer() {

    clearTimeout(
        hlsFailTimer
    );

    if (currentHls) {

        try {

            currentHls.destroy();

        } catch (e) {

            console.warn(
                "HLS destroy error:",
                e
            );
        }

        currentHls = null;
    }


    if (currentDash) {

        try {

            currentDash.reset();

        } catch (e) {

            console.warn(
                "DASH reset error:",
                e
            );
        }

        currentDash = null;
    }


    if (ytPlayer) {

        try {

            ytPlayer.destroy();

        } catch (e) {}

        ytPlayer = null;
    }


    /*
     * Jeżeli gdzieś wcześniej został utworzony
     * WebAudio source, odłączamy go.
     *
     * Nie dotyczy to obecnych stacji radiowych.
     */

    if (audioSourceNode) {

        try {

            audioSourceNode.disconnect();

        } catch (e) {}

        audioSourceNode = null;
    }
}


/* ============================================================
   WEB AUDIO
   ============================================================ */

function initAudioContext() {

    if (!audioCtx) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {

            return false;
        }

        audioCtx =
            new AudioContext();


        compressorNode =
            audioCtx.createDynamicsCompressor();


        compressorNode.threshold.setValueAtTime(
            -12,
            audioCtx.currentTime
        );


        compressorNode.knee.setValueAtTime(
            3,
            audioCtx.currentTime
        );


        compressorNode.ratio.setValueAtTime(
            12,
            audioCtx.currentTime
        );


        compressorNode.attack.setValueAtTime(
            0.003,
            audioCtx.currentTime
        );


        compressorNode.release.setValueAtTime(
            0.25,
            audioCtx.currentTime
        );


        gainNode =
            audioCtx.createGain();


        gainNode.gain.setValueAtTime(
            0.2,
            audioCtx.currentTime
        );


        compressorNode.connect(
            gainNode
        );


        gainNode.connect(
            audioCtx.destination
        );
    }


    if (
        audioCtx.state ===
        'suspended'
    ) {

        audioCtx.resume().catch(
            () => {}
        );
    }


    return true;
}


/*
 * WAŻNE:
 *
 * Funkcja została celowo wyłączona dla
 * zewnętrznych streamów.
 *
 * createMediaElementSource() wymaga odpowiedniej
 * polityki CORS po stronie serwera.
 *
 * Przy radiu mogło to powodować:
 *
 * - brak dźwięku,
 * - ciszę po rozpoczęciu,
 * - SecurityError,
 * - problemy po zmianie stacji.
 */

function connectMediaElement(element) {

    console.warn(
        "WebAudio pominięte dla zewnętrznego streamu:",
        element
    );

    return false;
}


/* ============================================================
   BUDOWANIE LISTY HLS
   ============================================================ */

function buildHlsCandidates(ch) {

    const urls = [];


    /*
     * Podstawowy URL.
     */

    if (ch.url) {

        urls.push(
            ch.url.trim()
        );
    }


    /*
     * Własne fallbackUrls.
     */

    if (
        Array.isArray(
            ch.fallbackUrls
        )
    ) {

        ch.fallbackUrls.forEach(
            url => {

                if (
                    url &&
                    typeof url === 'string'
                ) {

                    urls.push(
                        url.trim()
                    );
                }
            }
        );
    }


    /*
     * Automatyczne warianty.
     */

    try {

        const parsed =
            new URL(ch.url);

        const path =
            parsed.pathname;


        if (
            path.endsWith('.m3u8') &&
            !path.endsWith(
                '/playlist.m3u8'
            ) &&
            !path.endsWith(
                '/playlist720p.m3u8'
            )
        ) {

            const directory =
                path.substring(
                    0,
                    path.lastIndexOf('/') + 1
                );


            const origin =
                parsed.origin;


            urls.push(
                origin +
                directory +
                'playlist.m3u8'
            );


            urls.push(
                origin +
                directory +
                'playlist720p.m3u8'
            );
        }

    } catch (e) {

        console.warn(
            "Nie można wygenerować wariantów HLS:",
            e
        );
    }


    return [
        ...new Set(
            urls.filter(Boolean)
        )
    ];
}


/* ============================================================
   SPRAWDZENIE CZY URL WYGLĄDA NA HLS
   ============================================================ */

function isHlsUrl(url) {

    if (!url) {

        return false;
    }

    return (
        url
            .toLowerCase()
            .includes('.m3u8')
    );
}


/* ============================================================
   CORS / FETCH TEST
   ============================================================ */

async function testCors(
    url,
    token
) {

    if (
        token !==
        loadingChannelToken
    ) {

        return {
            ok: false,
            cancelled: true
        };
    }


    let controller = null;
    let timeout = null;


    try {

        controller =
            new AbortController();


        timeout =
            setTimeout(
                () => {

                    controller.abort();

                },
                4500
            );


        const response =
            await fetch(
                url,
                {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-store',
                    signal:
                        controller.signal
                }
            );


        clearTimeout(
            timeout
        );


        if (!response.ok) {

            return {
                ok: false,
                status:
                    response.status,
                cors: true
            };
        }


        await response.text();


        return {
            ok: true,
            cors: true
        };


    } catch (e) {

        if (timeout) {

            clearTimeout(
                timeout
            );
        }


        return {
            ok: false,
            cors: false,
            error: e
        };
    }
}


/* ============================================================
   PRÓBA HLS
   ============================================================ */

function tryHlsUrl(
    url,
    media,
    token,
    candidateIndex
) {

    return new Promise(
        (resolve, reject) => {

            if (
                token !==
                loadingChannelToken
            ) {

                reject(
                    new Error(
                        "cancelled"
                    )
                );

                return;
            }


            if (
                !window.Hls ||
                !Hls.isSupported()
            ) {

                reject(
                    new Error(
                        "HLS.js not supported"
                    )
                );

                return;
            }


            showStreamStatus(
                `HLS ${candidateIndex + 1}/${currentHlsUrls.length}: ładowanie...`
            );


            let resolved = false;

            let fatalErrors = 0;


            clearTimeout(
                hlsFailTimer
            );


            const hls =
                new Hls({

                    enableWorker: true,

                    lowLatencyMode: false,

                    backBufferLength: 30,

                    maxBufferLength: 30,

                    maxMaxBufferLength: 60,

                    manifestLoadingMaxRetry: 1,

                    manifestLoadingRetryDelay: 1000,

                    levelLoadingMaxRetry: 1,

                    levelLoadingRetryDelay: 1000,

                    fragLoadingMaxRetry: 2,

                    fragLoadingRetryDelay: 1000,

                    xhrSetup: function(xhr) {

                        try {

                            xhr.withCredentials =
                                false;

                        } catch (e) {}
                    }
                });


            currentHls =
                hls;


            function cleanup() {

                clearTimeout(
                    hlsFailTimer
                );


                hls.off(
                    Hls.Events.MANIFEST_PARSED,
                    onManifest
                );


                hls.off(
                    Hls.Events.ERROR,
                    onError
                );
            }


            function success() {

                if (resolved) {

                    return;
                }


                resolved = true;


                cleanup();


                showStreamStatus(
                    "STREAM DZIAŁA",
                    "ok"
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    3000
                );


                resolve(hls);
            }


            function failure(error) {

                if (resolved) {

                    return;
                }


                resolved = true;


                cleanup();


                try {

                    hls.destroy();

                } catch (e) {}


                if (
                    currentHls === hls
                ) {

                    currentHls = null;
                }


                reject(error);
            }


            function onManifest() {

                if (
                    token !==
                    loadingChannelToken
                ) {

                    failure(
                        new Error(
                            "cancelled"
                        )
                    );

                    return;
                }


                /*
                 * Manifest jest poprawny.
                 *
                 * Teraz uruchamiamy media.
                 */

                media.play()
                    .then(
                        () => {

                            success();

                        }
                    )
                    .catch(
                        () => {

                            /*
                             * Autoplay może być
                             * zablokowany.
                             *
                             * Sam stream jest jednak
                             * poprawnie załadowany.
                             */

                            success();
                        }
                    );
            }


            function onError(
                event,
                data
            ) {

                if (
                    token !==
                    loadingChannelToken
                ) {

                    failure(
                        new Error(
                            "cancelled"
                        )
                    );

                    return;
                }


                console.warn(
                    "HLS:",
                    url,
                    data
                );


                if (
                    !data.fatal
                ) {

                    return;
                }


                fatalErrors++;


                /*
                 * Błąd sieci / manifestu.
                 */

                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    showStreamStatus(
                        `Błąd sieci/CORS — wariant ${candidateIndex + 1}`
                    );


                    if (
                        fatalErrors >=
                        HLS_CONFIG.maxFatalErrorsPerUrl
                    ) {

                        failure(
                            new Error(
                                "NETWORK_ERROR"
                            )
                        );

                    } else {

                        setTimeout(
                            () => {

                                if (
                                    !resolved &&
                                    token ===
                                    loadingChannelToken
                                ) {

                                    try {

                                        hls.startLoad();

                                    } catch (e) {}
                                }

                            },
                            HLS_CONFIG.retryDelay
                        );
                    }


                    return;
                }


                /*
                 * Błąd kodeka / media.
                 */

                if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    showStreamStatus(
                        "Błąd media — próba naprawy"
                    );


                    try {

                        hls.recoverMediaError();

                    } catch (e) {

                        failure(
                            new Error(
                                "MEDIA_ERROR"
                            )
                        );
                    }


                    return;
                }


                /*
                 * Inny fatalny błąd.
                 */

                failure(
                    new Error(
                        data.details ||
                        "HLS_FATAL_ERROR"
                    )
                );
            }


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                onManifest
            );


            hls.on(
                Hls.Events.ERROR,
                onError
            );


            /*
             * Timeout.
             */

            hlsFailTimer =
                setTimeout(
                    () => {

                        if (!resolved) {

                            failure(
                                new Error(
                                    "HLS_TIMEOUT"
                                )
                            );
                        }

                    },
                    HLS_CONFIG.startupTimeout
                );


            try {

                hls.loadSource(
                    url
                );

                hls.attachMedia(
                    media
                );

            } catch (e) {

                failure(e);
            }
        }
    );
}


/* ============================================================
   GŁÓWNA FUNKCJA HLS Z FALLBACKAMI
   ============================================================ */

async function loadHlsWithFallback(
    ch,
    media,
    token
) {

    currentHlsUrls =
        buildHlsCandidates(ch);

    currentHlsIndex = 0;

    hlsAttempt = 0;


    console.log(
        "HLS candidates:",
        currentHlsUrls
    );


    /*
     * Safari / iOS:
     *
     * Natomiast dla radia HLS używamy
     * bezpośrednio elementu audio.
     */

    if (
        media.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ) {

        for (
            let i = 0;
            i <
            currentHlsUrls.length;
            i++
        ) {

            if (
                token !==
                loadingChannelToken
            ) {

                return;
            }


            const url =
                currentHlsUrls[i];


            showStreamStatus(
                `Natywny HLS: wariant ${i + 1}/${currentHlsUrls.length}`
            );


            /*
             * Czyścimy poprzedni HLS.
             */

            try {

                media.pause();

            } catch (e) {}


            media.removeAttribute(
                'src'
            );


            try {

                media.load();

            } catch (e) {}


            media.src =
                url;


            try {

                await media.play();


                showStreamStatus(
                    "STREAM DZIAŁA",
                    "ok"
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    3000
                );


                return;


            } catch (e) {

                console.warn(
                    "Natywny HLS nie działa:",
                    url,
                    e
                );


                media.removeAttribute(
                    'src'
                );


                try {

                    media.load();

                } catch (x) {}
            }
        }
    }


    /*
     * Chrome / Edge / Firefox:
     *
     * HLS.js.
     */

    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        for (
            let i = 0;
            i <
            currentHlsUrls.length;
            i++
        ) {

            if (
                token !==
                loadingChannelToken
            ) {

                return;
            }


            currentHlsIndex =
                i;


            const url =
                currentHlsUrls[i];


            /*
             * Test CORS jest tylko informacyjny.
             *
             * Nawet jeżeli fetch nie przejdzie,
             * nadal próbujemy HLS.js.
             */

            showStreamStatus(
                `Sprawdzanie HLS ${i + 1}/${currentHlsUrls.length}...`
            );


            const corsResult =
                await testCors(
                    url,
                    token
                );


            if (
                token !==
                loadingChannelToken
            ) {

                return;
            }


            if (
                !corsResult.ok
            ) {

                console.warn(
                    "Możliwy CORS:",
                    url,
                    corsResult
                );


                showStreamStatus(
                    `CORS / brak dostępu — próbuję wariant ${i + 1}`
                );

            } else {

                showStreamStatus(
                    `CORS OK — wariant ${i + 1}`
                );
            }


            /*
             * Próba HLS.
             */

            try {

                await tryHlsUrl(
                    url,
                    media,
                    token,
                    i
                );


                /*
                 * Sukces.
                 */

                return;


            } catch (e) {

                console.warn(
                    "Wariant HLS nie działa:",
                    url,
                    e
                );


                /*
                 * Czyścimy HLS.
                 */

                if (currentHls) {

                    try {

                        currentHls.destroy();

                    } catch (x) {}

                    currentHls = null;
                }


                /*
                 * Czyścimy element media.
                 */

                try {

                    media.pause();

                    media.removeAttribute(
                        'src'
                    );

                    media.load();

                } catch (x) {}
            }
        }
    }


    /*
     * Nic nie zadziałało.
     */

    showStreamStatus(
        "Brak działającego wariantu HLS",
        "error"
    );


    console.error(
        "Żaden wariant HLS nie działa:",
        currentHlsUrls
    );
}

        );

/* ============================================================
   LOAD CHANNEL
   ============================================================ */

function loadChannel(
    ch,
    index = currentChannelIndex
) {

    /*
     * Token zabezpiecza przed sytuacją:
     *
     * kanał A zaczyna ładować
     * ->
     * klikamy kanał B
     * ->
     * A kończy ładowanie
     *
     * A nie nadpisze wtedy B.
     */

    loadingChannelToken++;


    const token =
        loadingChannelToken;


    currentChannelIndex =
        index;


    destroyCurrentPlayer();


    videoTarget.innerHTML =
        "";


    document
        .querySelectorAll(
            '.channel-item'
        )
        .forEach(
            el =>
                el.classList.remove(
                    'active'
                )
        );


    const activeItem =
        document.querySelector(
            `.channel-item[data-index="${index}"]`
        );


    if (activeItem) {

        activeItem.classList.add(
            'active'
        );
    }


    channelDisplay.textContent =
        ch.name;


    channelDisplay.classList.add(
        'show'
    );


    clearTimeout(
        displayTimeout
    );


    displayTimeout =
        setTimeout(
            () => {

                channelDisplay.classList.remove(
                    'show'
                );

            },
            7000
        );


    const isBackgroundAudio =
        ch.backgroundAudio === true;


    /* ========================================================
       HLS
       ======================================================== */

    if (
        ch.type === 'hls'
    ) {

        /*
         * WAŻNA ZMIANA:
         *
         * HLS z backgroundAudio:
         *
         * <audio>
         *
         * Pozostałe:
         *
         * <video>
         */

        if (isBackgroundAudio) {

            videoTarget.innerHTML =
                `<audio
                    id="v"
                    autoplay
                    playsinline
                    preload="auto">
                </audio>`;

        } else {

            videoTarget.innerHTML =
                `<video
                    id="v"
                    controls
                    autoplay
                    playsinline>
                </video>`;
        }


        const v =
            document.getElementById(
                'v'
            );


        if (isBackgroundAudio) {

            /*
             * Element jest aktywny,
             * tylko niewidoczny.
             */

            v.style.display =
                'none';
        }


        /*
         * NIE podłączamy HLS do WebAudio.
         *
         * To jest kluczowa zmiana.
         */

        v.onerror =
            () => {

                console.warn(
                    "HLS element error:",
                    v.error
                );
            };


        v.onplaying =
            () => {

                showStreamStatus(
                    "STREAM DZIAŁA",
                    "ok"
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );
            };


        loadHlsWithFallback(
            ch,
            v,
            token
        );


        return;
    }


    /* ========================================================
       DASH
       ======================================================== */

    if (
        ch.type === 'dash'
    ) {

        videoTarget.innerHTML =
            `<video
                id="v"
                controls
                autoplay
                playsinline>
            </video>`;


        const v =
            document.getElementById(
                'v'
            );


        if (isBackgroundAudio) {

            v.style.display =
                'none';
        }


        currentDash =
            dashjs
                .MediaPlayer()
                .create();


        currentDash.initialize(
            v,
            ch.url,
            true
        );


        v.onplaying =
            () => {

                showStreamStatus(
                    "STREAM DZIAŁA",
                    "ok"
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );
            };


        v.onerror =
            () => {

                console.warn(
                    "DASH element error:",
                    v.error
                );
            };


        return;
    }


    /* ========================================================
       YOUTUBE
       ======================================================== */

    if (
        ch.type === 'youtube'
    ) {

        videoTarget.innerHTML =
            `<div id="yt-div"></div>`;


        ytPlayer =
            new YT.Player(
                'yt-div',
                {
                    videoId:
                        ch.url,

                    playerVars: {
                        autoplay: 1,
                        playsinline: 1
                    }
                }
            );


        return;
    }


    /* ========================================================
       IFRAME
       ======================================================== */

    if (
        ch.type === 'iframe' ||
        ch.type === 'iframe-dlhd'
    ) {

        videoTarget.innerHTML =
            `<iframe
                src="${ch.url}"
                allow="autoplay; fullscreen"
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
            </iframe>`;


        return;
    }


    /* ========================================================
       AUDIO
       ======================================================== */

    if (
        ch.type === 'audio'
    ) {

        /*
         * NAJWAŻNIEJSZA ZMIANA:
         *
         * Zewnętrzne radio jest odtwarzane
         * bezpośrednio przez <audio>.
         *
         * NIE MA:
         *
         * crossorigin="anonymous"
         *
         * createMediaElementSource()
         *
         * compressora WebAudio
         *
         * Dzięki temu CORS streamu nie może
         * wyciszyć odtwarzania.
         */

        videoTarget.innerHTML =
            `<audio
                id="radio-audio"
                autoplay
                playsinline
                preload="none">
            </audio>`;


        const a =
            document.getElementById(
                'radio-audio'
            );


        a.src =
            ch.url;


        if (
            isBackgroundAudio
        ) {

            a.style.display =
                'none';

        } else {

            a.controls =
                true;
        }


        /*
         * Informacja o rozpoczęciu.
         */

        a.onplaying =
            () => {

                showStreamStatus(
                    "RADIO DZIAŁA",
                    "ok"
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );
            };


        /*
         * Błąd radia.
         */

        a.onerror =
            () => {

                console.warn(
                    "Radio audio error:",
                    a.error,
                    ch.url
                );


                showStreamStatus(
                    "Błąd odtwarzania radia",
                    "error"
                );
            };


        /*
         * Stany pośrednie.
         */

        a.onwaiting =
            () => {

                showStreamStatus(
                    "Ładowanie radia..."
                );
            };


        a.onstalled =
            () => {

                console.warn(
                    "Radio stream stalled:",
                    ch.url
                );
            };


        /*
         * Próba uruchomienia.
         *
         * Jeśli przeglądarka zablokuje autoplay,
         * stream pozostaje przypisany do elementu.
         */

        a.play()
            .catch(
                err => {

                    console.warn(
                        "Autoplay radia zablokowany:",
                        err
                    );


                    showStreamStatus(
                        "Radio oczekuje na uruchomienie"
                    );
                }
            );


        return;
    }
}


/* ============================================================
   NEXT
   ============================================================ */

function nextChannel() {

    currentChannelIndex =
        (
            currentChannelIndex + 1
        ) %
        channels.length;


    loadChannel(
        channels[
            currentChannelIndex
        ],
        currentChannelIndex
    );
}


/* ============================================================
   PREVIOUS
   ============================================================ */

function previousChannel() {

    currentChannelIndex =
        (
            currentChannelIndex - 1 +
            channels.length
        ) %
        channels.length;


    loadChannel(
        channels[
            currentChannelIndex
        ],
        currentChannelIndex
    );
}


/* ============================================================
   FULLSCREEN
   ============================================================ */

function toggleFullscreen() {

    if (
        !document.fullscreenElement
    ) {

        const container =
            document.getElementById(
                'player-container'
            );


        if (
            container.requestFullscreen
        ) {

            container
                .requestFullscreen()
                .catch(
                    () => {}
                );
        }

    } else {

        document
            .exitFullscreen()
            .catch(
                () => {}
            );
    }
}


/* ============================================================
   FADE PRZYCISKU
   ============================================================ */

function resetFade() {

    const btn =
        document.getElementById(
            'fullscreen-btn'
        );


    btn.classList.remove(
        'fade-out'
    );


    clearTimeout(
        fadeTimeout
    );


    fadeTimeout =
        setTimeout(
            () => {

                btn.classList.add(
                    'fade-out'
                );

            },
            3000
        );
}


document.onmousemove =
    resetFade;


/* ============================================================
   START
   ============================================================ */

loadChannel(
    channels[0],
    0
);


/* ============================================================
   MYSZ
   ============================================================ */

document.addEventListener(
    "contextmenu",
    e =>
        e.preventDefault()
);


document.addEventListener(
    "mousedown",
    function(e) {

        /*
         * Środkowy przycisk:
         * następny kanał.
         */

        if (
            e.button === 1
        ) {

            e.preventDefault();

            nextChannel();
        }


        /*
         * Prawy przycisk:
         * poprzedni kanał.
         */

        else if (
            e.button === 2
        ) {

            e.preventDefault();

            previousChannel();
        }
    }
);


/* ============================================================
   KLAWIATURA
   ============================================================ */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowRight"
        ) {

            nextChannel();
        }


        if (
            e.key === "ArrowLeft"
        ) {

            previousChannel();
        }


        if (
            e.key === "f" ||
            e.key === "F"
        ) {

            toggleFullscreen();
        }
    }
);


/* ============================================================
   URUCHOMIENIE RADIA PO PIERWSZEJ INTERAKCJI
   ============================================================ */

/*
 * Niektóre przeglądarki blokują autoplay.
 *
 * Po pierwszym kliknięciu / dotknięciu próbujemy
 * ponownie uruchomić aktualne radio.
 */

document.addEventListener(
    "click",
    function() {

        const audio =
            document.querySelector(
                "#radio-audio"
            );


        if (audio) {

            audio.play()
                .catch(
                    () => {}
                );
        }
    }
);


/*
 * Również dla urządzeń dotykowych.
 */

document.addEventListener(
    "touchstart",
    function() {

        const audio =
            document.querySelector(
                "#radio-audio"
            );


        if (audio) {

            audio.play()
                .catch(
                    () => {}
                );
        }
    },
    {
        passive: true
    }
);

</script>

</html>
