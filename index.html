<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#player {
    position: fixed;
    inset: 0;
    background: #000;
}

#video-target {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

#video-target video,
#video-target iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
}

#video-target video {
    object-fit: contain;
}

/* =========================
   LEWY SIDEBAR
========================= */

#sidebar-trigger {
    position: fixed;
    left: 0;
    top: 0;
    width: 30px;
    height: 100vh;
    z-index: 9999;
}

#sidebar {
    position: fixed;
    z-index: 9998;
    left: -300px;
    top: 0;
    width: 300px;
    height: 100vh;
    background: rgba(15, 15, 15, 0.97);
    transition: left .25s ease;
    box-shadow: 5px 0 25px rgba(0,0,0,.5);
    overflow-y: auto;
    padding: 20px;
}

#sidebar.open {
    left: 0;
}

#sidebar h2 {
    color: #fff;
    margin: 0 0 20px 0;
    font-size: 20px;
}

.channel {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 0;
    border-radius: 7px;
    background: #242424;
    color: #fff;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
}

.channel:hover {
    background: #383838;
}

.channel.active {
    background: #555;
}

/* =========================
   STATUS
========================= */

#status {
    position: fixed;
    left: 50%;
    top: 15px;
    transform: translateX(-50%);
    z-index: 9000;
    background: rgba(0,0,0,.75);
    color: #fff;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
}

#status.show {
    opacity: 1;
}

/* =========================
   CC PANEL
========================= */

#cc-panel {
    position: fixed;
    right: 20px;
    bottom: 65px;
    z-index: 10000;

    display: none;
    min-width: 190px;

    padding: 12px;
    background: rgba(20,20,20,.96);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;

    box-shadow: 0 5px 25px rgba(0,0,0,.5);
}

#cc-panel.show {
    display: block;
}

#cc-panel-title {
    color: #fff;
    font-size: 13px;
    margin-bottom: 8px;
    opacity: .75;
}

.cc-option {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 5px;
    background: #292929;
    color: #fff;
    padding: 9px 10px;
    margin-top: 5px;
    text-align: left;
    cursor: pointer;
}

.cc-option:hover {
    background: #444;
}

.cc-option.active {
    background: #666;
}

/* =========================
   CUSTOM CC BUTTON
========================= */

#cc-button {
    position: fixed;
    right: 20px;
    bottom: 20px;

    z-index: 10001;

    border: 0;
    border-radius: 6px;

    background: rgba(20,20,20,.85);
    color: #fff;

    padding: 9px 13px;

    font-size: 13px;
    font-weight: bold;

    cursor: pointer;
}

#cc-button:hover {
    background: rgba(60,60,60,.95);
}

#cc-button.disabled {
    display: none;
}

/* =========================
   FULLSCREEN
========================= */

#fullscreen-button {
    position: fixed;
    right: 75px;
    bottom: 20px;

    z-index: 10001;

    border: 0;
    border-radius: 6px;

    background: rgba(20,20,20,.85);
    color: #fff;

    padding: 9px 13px;

    font-size: 13px;
    cursor: pointer;
}

#fullscreen-button:hover {
    background: rgba(60,60,60,.95);
}
</style>
</head>

<body>

<div id="player">

    <div id="video-target"></div>

</div>

<div id="sidebar-trigger"></div>

<div id="sidebar">

    <h2>Kanały</h2>

    <div id="channels"></div>

</div>

<div id="status"></div>

<button id="cc-button" class="disabled">CC</button>

<div id="cc-panel">
    <div id="cc-panel-title">Napisy</div>
    <div id="cc-options"></div>
</div>

<button id="fullscreen-button">⛶</button>


<script>

/* =========================================================
   KANAŁY
========================================================= */

const channels = [

    {
        name: "DW English",
        url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/master.m3u8",
        type: "hls"
    },

    {
        name: "(ED) DW English",
        url: "https://amg01644-amg01644c1-amgplt0343.playout.now3.amagi.tv/ts-eu-w1-n2/playlist/amg01644-amg01644c1-amgplt0343/playlist.m3u8",
        type: "hls"
    }

    /*
    ,
    {
        name: "Przykładowy iframe",
        url: "https://example.com",
        type: "iframe"
    },

    {
        name: "Przykładowy DASH",
        url: "https://example.com/stream.mpd",
        type: "dash"
    },

    {
        name: "YouTube",
        url: "VIDEO_ID",
        type: "youtube"
    }
    */

];


/* =========================================================
   ZMIENNE
========================================================= */

let currentChannel = -1;

let currentHls = null;
let currentDash = null;
let currentVideo = null;

let subtitleTracks = [];

let sidebarTimer = null;


/* =========================================================
   ELEMENTY
========================================================= */

const videoTarget =
    document.getElementById("video-target");

const sidebar =
    document.getElementById("sidebar");

const sidebarTrigger =
    document.getElementById("sidebar-trigger");

const channelsContainer =
    document.getElementById("channels");

const statusBox =
    document.getElementById("status");

const ccButton =
    document.getElementById("cc-button");

const ccPanel =
    document.getElementById("cc-panel");

const ccOptions =
    document.getElementById("cc-options");

const fullscreenButton =
    document.getElementById("fullscreen-button");


/* =========================================================
   STATUS
========================================================= */

function showStatus(message, timeout = 3000) {

    statusBox.textContent = message;

    statusBox.classList.add("show");

    clearTimeout(showStatus.timer);

    showStatus.timer = setTimeout(() => {

        statusBox.classList.remove("show");

    }, timeout);
}


/* =========================================================
   SIDEBAR
========================================================= */

function openSidebar() {

    clearTimeout(sidebarTimer);

    sidebar.classList.add("open");
}

function closeSidebar() {

    sidebarTimer = setTimeout(() => {

        sidebar.classList.remove("open");

    }, 250);
}

sidebarTrigger.addEventListener("mouseenter", openSidebar);

sidebar.addEventListener("mouseenter", () => {

    clearTimeout(sidebarTimer);

});

sidebar.addEventListener("mouseleave", closeSidebar);


/* =========================================================
   LISTA KANAŁÓW
========================================================= */

function buildChannelList() {

    channelsContainer.innerHTML = "";

    channels.forEach((channel, index) => {

        const button = document.createElement("button");

        button.className = "channel";

        button.textContent = channel.name;

        button.dataset.index = index;

        button.addEventListener("click", () => {

            loadChannel(index);

            sidebar.classList.remove("open");

        });

        channelsContainer.appendChild(button);

    });
}


/* =========================================================
   AKTYWNY KANAŁ
========================================================= */

function updateActiveChannel() {

    document
        .querySelectorAll(".channel")
        .forEach(button => {

            button.classList.toggle(
                "active",
                Number(button.dataset.index) === currentChannel
            );

        });

}


/* =========================================================
   CZYSZCZENIE PLAYERA
========================================================= */

function destroyCurrentPlayer() {

    if (currentHls) {

        try {
            currentHls.destroy();
        } catch (e) {}

        currentHls = null;
    }


    if (currentDash) {

        try {
            currentDash.reset();
        } catch (e) {}

        currentDash = null;
    }


    if (currentVideo) {

        try {
            currentVideo.pause();
        } catch (e) {}

        currentVideo = null;
    }


    subtitleTracks = [];

    ccOptions.innerHTML = "";

    ccPanel.classList.remove("show");

    ccButton.classList.add("disabled");

    videoTarget.innerHTML = "";
}


/* =========================================================
   RESET CC
========================================================= */

function resetCC() {

    subtitleTracks = [];

    ccOptions.innerHTML = "";

    ccPanel.classList.remove("show");

    ccButton.classList.add("disabled");

}


/* =========================================================
   DODAWANIE OPcji CC
========================================================= */

function addCCOption(label, callback, active = false) {

    const button =
        document.createElement("button");

    button.className = "cc-option";

    if (active) {
        button.classList.add("active");
    }

    button.textContent = label;

    button.addEventListener("click", () => {

        callback();

        document
            .querySelectorAll(".cc-option")
            .forEach(x => x.classList.remove("active"));

        button.classList.add("active");

    });

    ccOptions.appendChild(button);
}


/* =========================================================
   POKAŻ / UKRYJ PANEL CC
========================================================= */

ccButton.addEventListener("click", event => {

    event.stopPropagation();

    if (ccButton.classList.contains("disabled")) {
        return;
    }

    ccPanel.classList.toggle("show");

});


document.addEventListener("click", event => {

    if (
        !ccPanel.contains(event.target) &&
        event.target !== ccButton
    ) {

        ccPanel.classList.remove("show");

    }

});


/* =========================================================
   KONFIGURACJA CC DLA HLS
========================================================= */

function setupHlsSubtitles(hls, video) {

    function updateSubtitleTracks() {

        const tracks = hls.subtitleTracks || [];

        subtitleTracks = tracks;

        ccOptions.innerHTML = "";

        if (!tracks.length) {

            ccButton.classList.add("disabled");

            return;
        }


        ccButton.classList.remove("disabled");


        /* WYŁĄCZ */

        addCCOption(
            "Wyłącz",
            () => {

                hls.subtitleTrack = -1;

            },
            hls.subtitleTrack === -1
        );


        /* ŚCIEŻKI */

        tracks.forEach((track, index) => {

            let label =
                track.name ||
                track.lang ||
                `Napisy ${index + 1}`;


            if (track.lang && track.name) {

                label =
                    `${track.name} (${track.lang})`;

            }


            addCCOption(
                label,
                () => {

                    hls.subtitleTrack = track.id;

                },
                hls.subtitleTrack === track.id
            );

        });

    }


    hls.on(
        Hls.Events.SUBTITLE_TRACKS_UPDATED,
        updateSubtitleTracks
    );


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        updateSubtitleTracks
    );


    /*
       Jeżeli manifest już zawiera ścieżki,
       sprawdzamy je również po chwili.
    */

    setTimeout(
        updateSubtitleTracks,
        1000
    );

}


/* =========================================================
   ŁADOWANIE KANAŁU
========================================================= */

function loadChannel(index) {

    if (!channels[index]) {
        return;
    }


    currentChannel = index;

    updateActiveChannel();

    destroyCurrentPlayer();

    resetCC();


    const channel =
        channels[index];


    showStatus(
        "Ładowanie: " + channel.name,
        2500
    );


    /* =====================================================
       IFRAME
    ===================================================== */

    if (channel.type === "iframe") {

        const iframe =
            document.createElement("iframe");

        iframe.src = channel.url;

        iframe.allowFullscreen = true;

        iframe.setAttribute(
            "allow",
            "autoplay; encrypted-media; fullscreen"
        );

        iframe.setAttribute(
            "referrerpolicy",
            "no-referrer-when-downgrade"
        );

        videoTarget.appendChild(iframe);

        return;
    }


    /* =====================================================
       HLS
    ===================================================== */

    if (channel.type === "hls") {

        const video =
            document.createElement("video");

        video.controls = true;

        video.autoplay = true;

        video.playsInline = true;

        video.setAttribute(
            "crossorigin",
            "anonymous"
        );

        videoTarget.appendChild(video);

        currentVideo = video;


        /*
           Natywne HLS
        */

        if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            video.src = channel.url;

            video.addEventListener(
                "loadedmetadata",
                () => {

                    video.play().catch(() => {});

                }
            );


            /*
               Safari może samo udostępnić CC
               przez natywne TextTracks.
            */

            video.addEventListener(
                "loadedmetadata",
                () => {

                    setupNativeTextTracks(video);

                }
            );


            return;
        }


        /*
           HLS.JS
        */

        if (Hls.isSupported()) {

            const hls =
                new Hls({

                    enableWorker: true,

                    lowLatencyMode: true,

                    backBufferLength: 30,

                    maxBufferLength: 30

                });


            currentHls = hls;


            setupHlsSubtitles(
                hls,
                video
            );


            hls.on(
                Hls.Events.ERROR,
                (event, data) => {

                    console.warn(
                        "HLS error:",
                        data
                    );


                    if (
                        data.fatal
                    ) {

                        switch (
                            data.type
                        ) {

                            case Hls.ErrorTypes.NETWORK_ERROR:

                                showStatus(
                                    "Błąd sieci HLS — ponawiam..."
                                );

                                hls.startLoad();

                                break;


                            case Hls.ErrorTypes.MEDIA_ERROR:

                                showStatus(
                                    "Błąd dekodowania — naprawiam..."
                                );

                                hls.recoverMediaError();

                                break;


                            default:

                                showStatus(
                                    "Nie można odtworzyć tego kanału."
                                );

                                hls.destroy();

                                break;

                        }

                    }

                }
            );


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                () => {

                    video
                        .play()
                        .catch(() => {});

                }
            );


            hls.loadSource(
                channel.url
            );

            hls.attachMedia(
                video
            );


            return;
        }


        showStatus(
            "Ta przeglądarka nie obsługuje HLS."
        );

        return;
    }


    /* =====================================================
       DASH
    ===================================================== */

    if (channel.type === "dash") {

        const video =
            document.createElement("video");

        video.controls = true;

        video.autoplay = true;

        video.playsInline = true;

        videoTarget.appendChild(video);

        currentVideo = video;


        if (
            typeof dashjs !== "undefined"
        ) {

            currentDash =
                dashjs.MediaPlayer().create();


            currentDash.initialize(
                video,
                channel.url,
                true
            );

        } else {

            showStatus(
                "dash.js nie został załadowany."
            );

        }

        return;
    }


    /* =====================================================
       YOUTUBE
    ===================================================== */

    if (channel.type === "youtube") {

        const iframe =
            document.createElement("iframe");


        iframe.src =
            "https://www.youtube.com/embed/" +
            encodeURIComponent(channel.url) +
            "?autoplay=1&playsinline=1";


        iframe.allowFullscreen = true;

        iframe.setAttribute(
            "allow",
            "autoplay; encrypted-media; fullscreen"
        );


        videoTarget.appendChild(iframe);

        return;
    }

}


/* =========================================================
   NATYWNE NAPISY — SAFARI / NATIVE HLS
========================================================= */

function setupNativeTextTracks(video) {

    const tracks =
        video.textTracks;


    if (!tracks || !tracks.length) {

        return;

    }


    ccButton.classList.remove("disabled");

    ccOptions.innerHTML = "";


    addCCOption(
        "Wyłącz",
        () => {

            for (
                let i = 0;
                i < tracks.length;
                i++
            ) {

                tracks[i].mode = "disabled";

            }

        },
        true
    );


    for (
        let i = 0;
        i < tracks.length;
        i++
    ) {

        const track =
            tracks[i];


        const label =
            track.label ||
            track.language ||
            `Napisy ${i + 1}`;


        addCCOption(
            label,
            () => {

                for (
                    let j = 0;
                    j < tracks.length;
                    j++
                ) {

                    tracks[j].mode =
                        "disabled";

                }


                track.mode = "showing";

            }
        );

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenButton.addEventListener(
    "click",
    () => {

        const player =
            document.getElementById("player");


        if (
            !document.fullscreenElement
        ) {

            if (
                player.requestFullscreen
            ) {

                player.requestFullscreen();

            } else if (
                player.webkitRequestFullscreen
            ) {

                player.webkitRequestFullscreen();

            }

        } else {

            if (
                document.exitFullscreen
            ) {

                document.exitFullscreen();

            }

        }

    }
);


/* =========================================================
   KLAWIATURA
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
           C = CC
        */

        if (
            event.key.toLowerCase() === "c"
        ) {

            if (
                !ccButton.classList.contains(
                    "disabled"
                )
            ) {

                ccPanel.classList.toggle(
                    "show"
                );

            }

        }


        /*
           F = fullscreen
        */

        if (
            event.key.toLowerCase() === "f"
        ) {

            fullscreenButton.click();

        }


        /*
           ESC
        */

        if (
            event.key === "Escape"
        ) {

            ccPanel.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

buildChannelList();

loadChannel(0);

</script>

</body>
</html>
