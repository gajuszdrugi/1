<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odtwarzacz Streamów</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video, audio {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        iframe {
            width: 102%;
            height: 102%;
            border: none;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #trigger-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 9999;
        }

        #sidebar {
            position: absolute;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(0,0,0,0.95);
            transition: left 0.3s;
            z-index: 10000;
            overflow-y: auto;
            padding: 20px 10px;
            border-right: 1px solid #333;
            scrollbar-width: none;
        }

        #sidebar::-webkit-scrollbar {
            display: none;
        }

        #trigger-zone:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        .channel-item {
            padding: 12px;
            margin-bottom: 5px;
            background: #1a1a1a;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .channel-item:hover {
            background: #333;
        }

        .channel-item.active {
            background: #ff333d;
            color: #fff;
        }

        .channel-number {
            font-weight: bold;
            margin-right: 10px;
            min-width: 30px;
        }

        #channel-display {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 5px;
            z-index: 9998;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #channel-display.show {
            opacity: 1;
        }

        #fullscreen-btn {
            position: absolute;
            right: 20px;
            bottom: calc(20px + 57px);
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #fff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
            transition: opacity 0.5s;
        }

        #stream-status {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 9998;
            padding: 8px 14px;
            background: rgba(0,0,0,0.75);
            border-radius: 5px;
            font-size: 13px;
            color: #ddd;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #stream-status.show {
            opacity: 1;
        }

        #stream-status.error {
            color: #ff7777;
        }

        #stream-status.ok {
            color: #8cff8c;
        }
    </style>
</head>

<body>

<div id="player-container">
    <div id="channel-display"></div>
    <div id="stream-status"></div>
    <div id="trigger-zone"></div>
    <div id="sidebar">
        <ul id="channels-ul"></ul>
    </div>
    <div id="video-target" style="width:100%; height:100%;"></div>
    <button id="fullscreen-btn" onclick="toggleFullscreen()">PEŁNY EKRAN</button>
</div>

<script>
const channels = [
    // Przywrócone oryginalne linki Rakuten TV (Travelxp) oraz Magenta TV jako iframe
    {name: "travelxp", url: "https://www.rakuten.tv/pl/live_channels/travelxp-eng", type: "iframe"},
    {name: "magenta tvp1", url: "https://magentatv.pl/player/live?channelNumber=1", type: "iframe"},
    {name: "med", url: "https://med.tv/watch-live/med-tv-live", type: "iframe"},
    {name: "zaluknij", url: "https://zaluknij.cc/", type: "iframe"},
    {name: "real stories", url: "https://www.youtube.com/Real_Stories/videos", type: "iframe"},
    {name: "arte", url: "https://www.arte.tv/en/", type: "iframe"},
    {name: "TVP1", url: "https://magentatv.pl/player/live?channelNumber=1", type: "iframe"},
    {name: "POLONIA", url: "https://polonia.tvp.pl/44562671/tvp-polonia-stream", type: "iframe"},
    {name: "WP TV", url: "https://pilot.wp.pl/tv/#telewizja-wp-hd", type: "iframe"},
    {name: "ERT", url: "https://www.ertflix.gr/#/channels", type: "iframe"},
    
    // Pozostałe strumienie HLS/YouTube bez zmian
    {name: "JEDYNKA PR", url: "https://stream11.polskieradio.pl/pr1/pr1.sdp/playlist.m3u8", type: "hls", backgroundAudio: true},
    {name: "DWÓJKA PR", url: "https://stream12.polskieradio.pl/pr2/pr2.sdp/playlist.m3u8", type: "hls", backgroundAudio: true},
    {name: "TRÓJKA PR", url: "https://stream13.polskieradio.pl/pr3/pr3.sdp/playlist.m3u8", type: "hls", backgroundAudio: true},
    {name: "CZWORKA PR", url: "https://stream14.polskieradio.pl/pr4/pr4.sdp/playlist.m3u8", type: "hls", backgroundAudio: true},
    {name: "RADIO KRAKÓW", url: "https://stream3.nadaje.com:9117/radiokrakow", type: "audio", backgroundAudio: true},
    {name: "TVP Info", url: "https://dash4.antik.sk/live/test_tvp_info/playlist.m3u8", type: "hls"},
    {name: "REPUBLIKA", url: "dzntyCTgJMQ", type: "youtube"},
    {name: "TRWAM", url: "https://live-ch1.trwam.cf.insyscd.net/out/v1/b99041a282774d4a8fe84a54243af5de/trwamtv-live-ch1.mpd", type: "dash"}
];

let currentPlayer = null;
let currentHls = null;
let currentDash = null;
let ytPlayer = null;
let activeIndex = 0;

function renderSidebar() {
    const ul = document.getElementById('channels-ul');
    ul.innerHTML = '';
    channels.forEach((ch, idx) => {
        const li = document.createElement('li');
        li.className = 'channel-item' + (idx === activeIndex ? ' active' : '');
        li.innerHTML = `<span class="channel-number">${idx + 1}</span><span>${ch.name}</span>`;
        li.onclick = () => loadChannel(idx);
        ul.appendChild(li);
    });
}

function loadChannel(index) {
    if (index < 0 || index >= channels.length) return;
    activeIndex = index;
    renderSidebar();

    const channel = channels[activeIndex];
    const target = document.getElementById('video-target');
    
    if (currentHls) { currentHls.destroy(); currentHls = null; }
    if (currentDash) { currentDash.reset(); currentDash = null; }
    target.innerHTML = '';

    showStatus("Ładowanie kanału...", "ok");

    if (channel.type === 'iframe') {
        const iframe = document.createElement('iframe');
        
        // Dodanie uprawnień niezbędnych dla odtwarzaczy wideo w ramkach (pełny ekran, autostart, Encrypted Media, wibracje/skrypty)
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
        
        iframe.src = channel.url;
        target.appendChild(iframe);
        
        showStatus("Załadowano widok strony w ramce", "ok");
    } else if (channel.type === 'hls') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        target.appendChild(video);

        if (Hls.isSupported()) {
            currentHls = new Hls();
            currentHls.loadSource(channel.url);
            currentHls.attachMedia(video);
            currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = channel.url;
            video.addEventListener('loadedmetadata', () => video.play());
        }
    } else if (channel.type === 'dash') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        target.appendChild(video);
        currentDash = dashjs.MediaPlayer().create();
        currentDash.initialize(video, channel.url, true);
    } else if (channel.type === 'youtube') {
        const div = document.createElement('div');
        div.id = 'yt-player-div';
        target.appendChild(div);
        ytPlayer = new YT.Player('yt-player-div', {
            videoId: channel.url,
            playerVars: { 'autoplay': 1 }
        });
    }
}

function showStatus(text, statusClass) {
    const statusEl = document.getElementById('stream-status');
    statusEl.textContent = text;
    statusEl.className = 'show ' + statusClass;
    setTimeout(() => { statusEl.classList.remove('show'); }, 3000);
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

window.onload = () => {
    renderSidebar();
    loadChannel(0);
};
</script>

</body>
</html>
