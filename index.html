    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }

        video,
        audio {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        iframe {
            width: 102%;
            height: 102%;
            border: none;
            background: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #trigger-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 9999;
        }

        #sidebar {
            position: absolute;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            transition: left 0.3s;
            z-index: 10000;
            overflow-y: auto;
            padding: 20px 10px;
            border-right: 1px solid #333;
            scrollbar-width: none;
        }

        #sidebar::-webkit-scrollbar {
            display: none;
        }

        #trigger-zone:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        .channel-item {
            padding: 12px;
            margin-bottom: 5px;
            background: #1a1a1a;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .channel-item:hover {
            background: #333;
        }

        .channel-item.active {
            background: #ff333d;
            color: #fff;
        }

        .channel-number {
            font-weight: bold;
            margin-right: 10px;
            min-width: 30px;
        }

        #channel-display {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border-radius: 5px;
            z-index: 9998;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #channel-display.show {
            opacity: 1;
        }

        #fullscreen-btn {
            position: absolute;
            right: 20px;
            bottom: calc(20px + 57px);
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #fff;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
            transition: opacity 0.5s;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #stream-status {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 9998;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 5px;
            font-size: 13px;
            color: #ddd;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: calc(100% - 40px);
        }

        #stream-status.show {
            opacity: 1;
        }

        #stream-status.error {
            color: #ff7777;
        }

        #stream-status.ok {
            color: #8cff8c;
        }
    </style>
</head>

<div id="player-container">

let displayTimeout = null;

/* ============================================================
   KONFIGURACJA
   ============================================================ */

const HLS_CONFIG = {

    startupTimeout: 20000,

    /*
     * Retry HLS.js.
     *
     * UWAGA:
     * Retry NIE naprawia CORS.
     * Ma sens przy chwilowym timeout/
     * zerwaniu połączenia.
     */
    retriesPerUrl: 2,

    retryDelay: 1500,

    maxManifestRetry: 1,
    maxLevelRetry: 1,
    maxFragmentRetry: 1
};


/* ============================================================
   STATUS
   ============================================================ */

function showStreamStatus(text, type = "") {

    streamStatus.textContent = text;

    streamStatus.classList.remove(
        "show",
        "error",
        "ok"
    );

    if (type) {
        streamStatus.classList.add(type);
    }

    streamStatus.classList.add("show");
}


function hideStreamStatus() {

    streamStatus.classList.remove(
        "show",
        "error",
        "ok"
    );
}


/* ============================================================
   URL HELPERS
   ============================================================ */

function getUrlProtocol(url) {

    try {
        return new URL(url).protocol;
    } catch {
        return "";
    }
}


function isHttpUrl(url) {

    return getUrlProtocol(url) === "http:";
}


function isHttpsPage() {

    return window.location.protocol === "https:";
}


function isMixedContentUrl(url) {

    return (
        isHttpsPage() &&
        isHttpUrl(url)
    );
}


/* ============================================================
   HLS ERROR ANALYSIS
   ============================================================ */

function getHlsErrorName(data) {

    if (!data) {
        return "UNKNOWN";
    }

    return String(
        data.details ||
        data.type ||
        "UNKNOWN"
    );
}


function getRequestUrl(data) {

    if (!data) {
        return "";
    }

    /*
     * hls.js może umieścić URL
     * w różnych miejscach zależnie od wersji.
     */

    return (
        data.url ||
        data.networkDetails?.responseURL ||
        data.networkDetails?.url ||
        data.frag?.url ||
        data.context?.url ||
        ""
    );
}


function isManifestError(data) {

    const d =
        String(data?.details || "")
            .toLowerCase();

    return d.includes("manifest");
}


function isLevelError(data) {

    const d =
        String(data?.details || "")
            .toLowerCase();

    return (
        d.includes("level") ||
        d.includes("playlist")
    );
}


function isFragmentError(data) {

    const d =
        String(data?.details || "")
            .toLowerCase();

    return (
        d.includes("frag") ||
        d.includes("fragment")
    );
}


function getHlsFailureCategory(data) {

    if (!data) {
        return "UNKNOWN";
    }

    if (
        isManifestError(data)
    ) {
        return "MANIFEST";
    }

    if (
        isLevelError(data)
    ) {
        return "VARIANT_PLAYLIST";
    }

    if (
        isFragmentError(data)
    ) {
        return "SEGMENT";
    }

    if (
        data.type ===
        Hls.ErrorTypes.NETWORK_ERROR
    ) {
        return "NETWORK";
    }

    if (
        data.type ===
        Hls.ErrorTypes.MEDIA_ERROR
    ) {
        return "MEDIA";
    }

    return "OTHER";
}


/*
 * Bardzo ważne:
 *
 * hls.js samo nie zawsze może powiedzieć:
 *
 * "to jest CORS".
 *
 * Brak CORS często wygląda po prostu jak
 * NETWORK_ERROR.
 *
 * Dlatego NIE oznaczamy każdego
 * NETWORK_ERROR jako CORS.
 */

function printDetailedHlsError(data) {

    const requestUrl =
        getRequestUrl(data);

    const category =
        getHlsFailureCategory(data);

    console.group(
        "%c[HLS DIAGNOSTYKA]",
        "font-weight:bold"
    );

    console.log(
        "Kategoria:",
        category
    );

    console.log(
        "Typ:",
        data?.type
    );

    console.log(
        "Details:",
        data?.details
    );

    console.log(
        "Fatal:",
        data?.fatal
    );

    console.log(
        "URL:",
        requestUrl
    );

    console.log(
        "HTTP:",
        data?.response?.code
    );

    console.log(
        "Response:",
        data?.response
    );

    console.log(
        "Fragment:",
        data?.frag
    );

    console.log(
        "Network details:",
        data?.networkDetails
    );

    console.log(
        "Pełny obiekt:",
        data
    );

    console.groupEnd();


    return {
        category,
        requestUrl
    };
}


/* ============================================================
   RESET MEDIA
   ============================================================ */

function resetMediaElement(media) {

    if (!media) {
        return;
    }

    try {
        media.pause();
    } catch {}


    try {
        media.removeAttribute("src");
    } catch {}


    try {
        media.load();
    } catch {}
}


/* ============================================================
   DESTROY PLAYER
   ============================================================ */

function destroyCurrentPlayer() {

    if (currentHls) {

        try {
            currentHls.destroy();
        } catch (e) {

            console.warn(
                "[HLS destroy]",
                e
            );
        }

        currentHls = null;
    }


    if (currentDash) {

        try {
            currentDash.reset();
        } catch (e) {

            console.warn(
                "[DASH reset]",
                e
            );
        }

        currentDash = null;
    }


    if (ytPlayer) {

        try {
            ytPlayer.destroy();
        } catch (e) {

            console.warn(
                "[YouTube destroy]",
                e
            );
        }

        ytPlayer = null;
    }


    clearTimeout(
        fadeTimeout
    );
}


/* ============================================================
   HLS CANDIDATES
   ============================================================ */

function buildHlsCandidates(ch) {

    const urls = [];

    if (
        typeof ch?.url === "string" &&
        ch.url.trim()
    ) {

        urls.push(
            ch.url.trim()
        );
    }


    /*
     * Tylko jawne fallbackUrls.
     *
     * NIE generujemy:
     *
     * playlist.m3u8
     * playlist720p.m3u8
     *
     * itd.
     */

    if (
        Array.isArray(ch?.fallbackUrls)
    ) {

        for (
            const url of ch.fallbackUrls
        ) {

            if (
                typeof url === "string" &&
                url.trim()
            ) {

                urls.push(
                    url.trim()
                );
            }
        }
    }


    return [
        ...new Set(urls)
    ];
}


/* ============================================================
   HLS URL
   ============================================================ */

function tryHlsUrl(
    url,
    media,
    token,
    candidateIndex,
    totalCandidates
) {

    return new Promise(
        (resolve, reject) => {

            if (
                token !==
                loadingChannelToken
            ) {

                reject(
                    new Error("CANCELLED")
                );

                return;
            }


            if (
                !window.Hls ||
                !Hls.isSupported()
            ) {

                reject(
                    new Error(
                        "HLS_NOT_SUPPORTED"
                    )
                );

                return;
            }


            if (
                isMixedContentUrl(url)
            ) {

                console.error(
                    "[MIXED CONTENT]",
                    url
                );

                showStreamStatus(
                    "HTTP na stronie HTTPS — przeglądarka blokuje Mixed Content",
                    "error"
                );

                reject(
                    new Error(
                        "MIXED_CONTENT"
                    )
                );

                return;
            }


            showStreamStatus(
                `HLS ${candidateIndex + 1}/${totalCandidates}: łączenie...`
            );


            let settled = false;

            let startupTimer = null;
            let retryTimer = null;

            let retryCount = 0;

            let lastErrorCategory =
                "NONE";

            let lastErrorUrl =
                url;


            const hls =
                new Hls({

                    enableWorker: true,

                    lowLatencyMode: false,

                    backBufferLength: 30,

                    maxBufferLength: 30,

                    maxMaxBufferLength: 60,

                    /*
                     * Nie używamy cookies/credentials.
                     */
                    xhrSetup: function(xhr) {

                        xhr.withCredentials =
                            false;
                    },

                    manifestLoadingMaxRetry:
                        HLS_CONFIG.maxManifestRetry,

                    manifestLoadingRetryDelay:
                        1000,

                    levelLoadingMaxRetry:
                        HLS_CONFIG.maxLevelRetry,

                    levelLoadingRetryDelay:
                        1000,

                    fragLoadingMaxRetry:
                        HLS_CONFIG.maxFragmentRetry,

                    fragLoadingRetryDelay:
                        1000
                });


            currentHls =
                hls;


            function cleanup() {

                clearTimeout(
                    startupTimer
                );

                clearTimeout(
                    retryTimer
                );


                media.removeEventListener(
                    "playing",
                    onPlaying
                );

                media.removeEventListener(
                    "waiting",
                    onWaiting
                );

                media.removeEventListener(
                    "error",
                    onMediaError
                );


                hls.off(
                    Hls.Events.MANIFEST_PARSED,
                    onManifest
                );

                hls.off(
                    Hls.Events.ERROR,
                    onHlsError
                );
            }


            function finishSuccess() {

                if (settled) {
                    return;
                }

                settled = true;

                cleanup();


                showStreamStatus(
                    "STREAM DZIAŁA",
                    "ok"
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );


                resolve(hls);
            }


            function finishFailure(
                message,
                details = {}
            ) {

                if (settled) {
                    return;
                }

                settled = true;

                cleanup();


                console.error(
                    "[HLS] Źródło nie działa",
                    {
                        url,
                        message,
                        ...details
                    }
                );


                try {
                    hls.destroy();
                } catch {}


                if (
                    currentHls === hls
                ) {

                    currentHls = null;
                }


                const error =
                    new Error(message);


                Object.assign(
                    error,
                    details
                );


                reject(error);
            }


            function onPlaying() {

                if (
                    token !==
                    loadingChannelToken
                ) {
                    return;
                }


                console.log(
                    "[HLS] PLAYING:",
                    url
                );


                finishSuccess();
            }


            function onWaiting() {

                if (
                    !settled &&
                    token ===
                    loadingChannelToken
                ) {

                    showStreamStatus(
                        "Buforowanie HLS..."
                    );
                }
            }


            function onMediaError() {

                console.warn(
                    "[MEDIA ERROR]",
                    media.error,
                    url
                );
            }


            function onManifest(
                event,
                data
            ) {

                if (
                    token !==
                    loadingChannelToken
                ) {

                    finishFailure(
                        "CANCELLED"
                    );

                    return;
                }


                console.log(
                    "[HLS] MANIFEST OK:",
                    url
                );


                showStreamStatus(
                    "Manifest OK — pobieranie segmentów..."
                );


                /*
                 * Nie uznajemy jeszcze streamu
                 * za działający.
                 *
                 * Dopiero PLAYING oznacza sukces.
                 */

                media.play()
                    .catch(
                        error => {

                            console.warn(
                                "[HLS] play():",
                                error
                            );

                            /*
                             * Autoplay może być
                             * zablokowany.
                             *
                             * Nie robimy z tego
                             * błędu CORS.
                             */

                            showStreamStatus(
                                "Stream załadowany — kliknij PLAY"
                            );
                        }
                    );
            }


            function onHlsError(
                event,
                data
            ) {

                if (
                    token !==
                    loadingChannelToken
                ) {

                    finishFailure(
                        "CANCELLED"
                    );

                    return;
                }


                const info =
                    printDetailedHlsError(
                        data
                    );


                lastErrorCategory =
                    info.category;

                lastErrorUrl =
                    info.requestUrl ||
                    url;


                /*
                 * ------------------------------------------------
                 * BŁĘDY NIE-FATALNE
                 * ------------------------------------------------
                 */

                if (
                    !data.fatal
                ) {

                    if (
                        info.category ===
                        "SEGMENT"
                    ) {

                        showStreamStatus(
                            "Problem z segmentem HLS — szczegóły w F12 → Console",
                            "error"
                        );
                    }

                    return;
                }


                /*
                 * ------------------------------------------------
                 * MEDIA ERROR
                 * ------------------------------------------------
                 */

                if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    console.warn(
                        "[HLS] MEDIA_ERROR — próba recovery"
                    );


                    showStreamStatus(
                        "Błąd dekodowania — próba naprawy..."
                    );


                    try {

                        hls.recoverMediaError();

                        return;

                    } catch (error) {

                        finishFailure(
                            "MEDIA_ERROR",
                            {
                                category:
                                    "MEDIA",
                                requestUrl:
                                    lastErrorUrl,
                                originalData:
                                    data
                            }
                        );

                        return;
                    }
                }


                /*
                 * ------------------------------------------------
                 * NETWORK ERROR
                 * ------------------------------------------------
                 */

                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    retryCount++;


                    /*
                     * Bardzo ważne:
                     *
                     * nie nazywamy tego automatycznie
                     * CORS.
                     *
                     * CORS, DNS, timeout, 403,
                     * niedostępny segment itd.
                     * mogą wyglądać jako
                     * NETWORK_ERROR.
                     */

                    if (
                        retryCount <=
                        HLS_CONFIG.retriesPerUrl
                    ) {

                        showStreamStatus(
                            `Błąd sieci — retry ${retryCount}/${HLS_CONFIG.retriesPerUrl}...`,
                            "error"
                        );


                        clearTimeout(
                            retryTimer
                        );


                        retryTimer =
                            setTimeout(
                                () => {

                                    if (
                                        settled ||
                                        token !==
                                        loadingChannelToken
                                    ) {
                                        return;
                                    }


                                    console.log(
                                        "[HLS] Ponawiam:",
                                        {
                                            source:url,
                                            failedRequest:lastErrorUrl,
                                            category:lastErrorCategory
                                        }
                                    );


                                    try {

                                        hls.startLoad();

                                    } catch (error) {

                                        console.error(
                                            "[HLS] startLoad error:",
                                            error
                                        );

                                        finishFailure(
                                            "NETWORK_ERROR",
                                            {
                                                category:
                                                    lastErrorCategory,
                                                requestUrl:
                                                    lastErrorUrl,
                                                originalData:
                                                    data
                                            }
                                        );
                                    }

                                },
                                HLS_CONFIG.retryDelay
                            );


                        return;
                    }


                    /*
                     * Retry wyczerpane.
                     *
                     * loadHlsWithFallback()
                     * spróbuje kolejnego URL,
                     * jeżeli taki istnieje.
                     */

                    finishFailure(
                        "NETWORK_ERROR",
                        {
                            category:
                                lastErrorCategory,
                            requestUrl:
                                lastErrorUrl,
                            originalData:
                                data
                        }
                    );

                    return;
                }


                /*
                 * ------------------------------------------------
                 * INNY FATAL ERROR
                 * ------------------------------------------------
                 */

                finishFailure(
                    "HLS_FATAL_ERROR",
                    {
                        category:
                            lastErrorCategory,
                        requestUrl:
                            lastErrorUrl,
                        originalData:
                            data
                    }
                );
            }


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                onManifest
            );


            hls.on(
                Hls.Events.ERROR,
                onHlsError
            );


            media.addEventListener(
                "playing",
                onPlaying
            );


            media.addEventListener(
                "waiting",
                onWaiting
            );


            media.addEventListener(
                "error",
                onMediaError
            );


            /*
             * Timeout startowy.
             */

            startupTimer =
                setTimeout(
                    () => {

                        if (
                            !settled
                        ) {

                            finishFailure(
                                "HLS_TIMEOUT",
                                {
                                    category:
                                        lastErrorCategory,
                                    requestUrl:
                                        lastErrorUrl
                                }
                            );
                        }

                    },
                    HLS_CONFIG.startupTimeout
                );


            try {

                hls.attachMedia(
                    media
                );


                hls.loadSource(
                    url
                );


            } catch (error) {

                finishFailure(
                    "HLS_START_ERROR",
                    {
                        originalError:
                            error
                    }
                );
            }
        }
    );
}


/* ============================================================
   LOAD HLS
   ============================================================ */

async function loadHlsWithFallback(
    channel,
    media,
    token
) {

    const urls =
        buildHlsCandidates(
            channel
        );


    if (
        !urls.length
    ) {

        showStreamStatus(
            "Brak adresu HLS",
            "error"
        );

        return;
    }


    console.group(
        `[HLS] ${channel.name}`
    );

    console.log(
        "Źródła:",
        urls
    );

    console.groupEnd();


    /*
     * ========================================================
     * NATYWNY HLS
     * ========================================================
     */

    const nativeHls =
        media.canPlayType(
            "application/vnd.apple.mpegurl"
        );


    if (
        nativeHls
    ) {

        for (
            let i = 0;
            i < urls.length;
            i++
        ) {

            if (
                token !==
                loadingChannelToken
            ) {
                return;
            }


            const url =
                urls[i];


            if (
                isMixedContentUrl(url)
            ) {

                console.warn(
                    "[NATIVE HLS] Mixed Content:",
                    url
                );

                continue;
            }


            showStreamStatus(
                `Natywny HLS ${i + 1}/${urls.length}...`
            );


            resetMediaElement(
                media
            );


            media.src =
                url;


            try {

                await media.play();


                if (
                    token !==
                    loadingChannelToken
                ) {
                    return;
                }


                showStreamStatus(
                    "STREAM DZIAŁA",
                    "ok"
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );


                return;

            } catch (error) {

                console.warn(
                    "[NATIVE HLS] failure:",
                    {
                        url,
                        error
                    }
                );


                resetMediaElement(
                    media
                );
            }
        }
    }


    /*
     * ========================================================
     * HLS.JS
     * ========================================================
     */

    if (
        !window.Hls ||
        !Hls.isSupported()
    ) {

        showStreamStatus(
            "Ta przeglądarka nie obsługuje HLS.js",
            "error"
        );

        return;
    }


    for (
        let i = 0;
        i < urls.length;
        i++
    ) {

        if (
            token !==
            loadingChannelToken
        ) {
            return;
        }


        const url =
            urls[i];


        if (
            isMixedContentUrl(url)
        ) {

            console.warn(
                "[HLS] Pomijam Mixed Content:",
                url
            );

            continue;
        }


        showStreamStatus(
            `HLS ${i + 1}/${urls.length}: ładowanie...`
        );


        try {

            await tryHlsUrl(
                url,
                media,
                token,
                i,
                urls.length
            );


            if (
                token !==
                loadingChannelToken
            ) {
                return;
            }


            /*
             * Sukces.
             */

            return;

        } catch (error) {

            if (
                token !==
                loadingChannelToken
            ) {
                return;
            }


            console.warn(
                `[HLS] Źródło ${i + 1} nie działa`,
                {
                    url,
                    error
                }
            );


            /*
             * Informacja dla użytkownika.
             */

            switch (
                error.message
            ) {

                case "NETWORK_ERROR":

                    showStreamStatus(
                        `Błąd sieci HLS — sprawdź F12 → Console`,
                        "error"
                    );

                    break;


                case "HLS_TIMEOUT":

                    showStreamStatus(
                        `Timeout HLS`,
                        "error"
                    );

                    break;


                case "MIXED_CONTENT":

                    showStreamStatus(
                        `HTTP zablokowany przez HTTPS`,
                        "error"
                    );

                    break;


                case "MEDIA_ERROR":

                    showStreamStatus(
                        `Błąd dekodowania HLS`,
                        "error"
                    );

                    break;


                default:

                    showStreamStatus(
                        `Źródło HLS nie działa`,
                        "error"
                    );
            }


            if (
                currentHls
            ) {

                try {
                    currentHls.destroy();
                } catch {}

                currentHls = null;
            }


            resetMediaElement(
                media
            );
        }
    }


    showStreamStatus(
        "Brak działającego źródła HLS",
        "error"
    );


    console.error(
        "[HLS] Wszystkie źródła nie działają:",
        urls
    );
}


/* ============================================================
   LISTA KANAŁÓW

        const li =
            document.createElement(
                "li"
            );

            "channel-item";


        li.dataset.index =

        li.addEventListener(

                loadChannel(

                    index
                );
            }
        );


        channelsUl.appendChild(
            li
        );
    }
);


/* ============================================================
   LOAD CHANNEL
   ============================================================ */

function loadChannel(
    channel,
    index = currentChannelIndex
) {

    /*
     * Unieważniamy wszystkie stare
     * operacje asynchroniczne.
     */

    loadingChannelToken++;


    const token =
        loadingChannelToken;


    currentChannelIndex =
        index;


    destroyCurrentPlayer();


    videoTarget.innerHTML =
        "";


    document
        .querySelectorAll(
            ".channel-item"
        )
        .forEach(
            item => {

                item.classList.remove(
                    "active"
                );
            }
        );


    const activeItem =
        document.querySelector(
            `.channel-item[data-index="${index}"]`
        );


    if (
        activeItem
    ) {

        activeItem.classList.add(
            "active"
        );
    }


    channelDisplay.textContent =
        channel.name;


    channelDisplay.classList.add(
        "show"
    );


    clearTimeout(
        displayTimeout
    );


    displayTimeout =
        setTimeout(
            () => {

                channelDisplay.classList.remove(
                    "show"
                );

            },
            7000
        );


    hideStreamStatus();


    const backgroundAudio =
        channel.backgroundAudio === true;


    /* ========================================================
       HLS
       ======================================================== */

    if (
        channel.type === "hls"
    ) {

        if (
            backgroundAudio
        ) {

            videoTarget.innerHTML = `
                <audio
                    id="v"
                    autoplay
                    playsinline
                    preload="auto">
                </audio>
            `;

        } else {

            videoTarget.innerHTML = `
                <video
                    id="v"
                    controls
                    autoplay
                    playsinline
                    crossorigin="anonymous">
                </video>
            `;
        }


        const media =
            document.getElementById(
                "v"
            );


        if (
            backgroundAudio
        ) {

            media.style.display =
                "none";
        }


        media.addEventListener(
            "playing",
            () => {

                if (
                    token !==
                    loadingChannelToken
                ) {
                    return;
                }


                showStreamStatus(
                    "STREAM DZIAŁA",
                    "ok"
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );
            }
        );


        media.addEventListener(
            "waiting",
            () => {

                if (
                    token ===
                    loadingChannelToken
                ) {

                    showStreamStatus(
                        "Buforowanie..."
                    );
                }
            }
        );


        media.addEventListener(
            "error",
            () => {

                console.error(
                    "[MEDIA ERROR]",
                    {
                        error:
                            media.error,
                        currentSrc:
                            media.currentSrc,
                        networkState:
                            media.networkState,
                        readyState:
                            media.readyState
                    }
                );
            }
        );


        loadHlsWithFallback(
            channel,
            media,
            token
        );


        return;
    }


    /* ========================================================
       DASH
       ======================================================== */

    if (
        channel.type === "dash"
    ) {

        videoTarget.innerHTML = `
            <video
                id="v"
                controls
                autoplay
                playsinline>
            </video>
        `;


        const media =
            document.getElementById(
                "v"
            );


        if (
            backgroundAudio
        ) {

            media.style.display =
                "none";
        }


        showStreamStatus(
            "Ładowanie DASH..."
        );


        currentDash =
            dashjs
                .MediaPlayer()
                .create();


        currentDash.initialize(
            media,
            channel.url,
            true
        );


        media.addEventListener(
            "playing",
            () => {

                if (
                    token !==
                    loadingChannelToken
                ) {
                    return;
                }


                showStreamStatus(
                    "STREAM DZIAŁA",
                    "ok"
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );
            }
        );


        media.addEventListener(
            "error",
            () => {

                console.error(
                    "[DASH MEDIA ERROR]",
                    {
                        url:
                            channel.url,
                        error:
                            media.error
                    }
                );


                showStreamStatus(
                    "Błąd DASH — sprawdź F12 → Console",
                    "error"
                );
            }
        );


        /*
         * Dodatkowe logowanie dash.js.
         */

        try {

            currentDash.on(
                dashjs.MediaPlayer.events.ERROR,
                event => {

                    console.error(
                        "[DASH ERROR]",
                        event
                    );
                }
            );

        } catch (e) {

            console.warn(
                "[DASH] Nie można podłączyć ERROR listenera",
                e
            );
        }


        return;
    }


    /* ========================================================
       YOUTUBE
       ======================================================== */

    if (
        channel.type === "youtube"
    ) {

        videoTarget.innerHTML =
            `<div id="yt-div"></div>`;


        if (
            !window.YT ||
            !YT.Player
        ) {

            showStreamStatus(
                "YouTube API jeszcze się ładuje..."
            );


            setTimeout(
                () => {

                    if (
                        token ===
                        loadingChannelToken
                    ) {

                        loadChannel(
                            channel,
                            index
                        );
                    }

                },
                1000
            );


            return;
        }


        ytPlayer =
            new YT.Player(
                "yt-div",
                {
                    videoId:
                        channel.url,

                    playerVars: {
                        autoplay: 1,
                        playsinline: 1,
                        rel: 0
                    },

                    events: {

                        onStateChange:
                            function(event) {

                                if (
                                    token !==
                                    loadingChannelToken
                                ) {
                                    return;
                                }


                                if (
                                    event.data ===
                                    YT.PlayerState.PLAYING
                                ) {

                                    showStreamStatus(
                                        "STREAM DZIAŁA",
                                        "ok"
                                    );


                                    setTimeout(
                                        () => {

                                            if (
                                                token ===
                                                loadingChannelToken
                                            ) {

                                                hideStreamStatus();
                                            }

                                        },
                                        2500
                                    );
                                }
                            },


                        onError:
                            function(event) {

                                console.error(
                                    "[YouTube ERROR]",
                                    event.data
                                );


                                showStreamStatus(
                                    "Błąd YouTube",
                                    "error"
                                );
                            }
                    }
                }
            );


        return;
    }


    /* ========================================================
       IFRAME
       ======================================================== */

    if (
        channel.type === "iframe" ||
        channel.type === "iframe-dlhd"
    ) {

        videoTarget.innerHTML = `
            <iframe
                src="${channel.url}"
                allow="autoplay; fullscreen"
                allowfullscreen
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
            </iframe>
        `;


        showStreamStatus(
            "Ładowanie strony..."
        );


        return;
    }


    /* ========================================================
       AUDIO
       ======================================================== */

    if (
        channel.type === "audio"
    ) {

        videoTarget.innerHTML = `
            <audio
                id="radio-audio"
                autoplay
                playsinline
                preload="none">
            </audio>
        `;


        const audio =
            document.getElementById(
                "radio-audio"
            );


        audio.src =
            channel.url;


        if (
            backgroundAudio
        ) {

            audio.style.display =
                "none";

        } else {

            audio.controls =
                true;
        }


        audio.addEventListener(
            "playing",
            () => {

                if (
                    token !==
                    loadingChannelToken
                ) {
                    return;
                }


                showStreamStatus(
                    "RADIO DZIAŁA",
                    "ok"
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );
            }
        );


        audio.addEventListener(
            "waiting",
            () => {

                if (
                    token ===
                    loadingChannelToken
                ) {

                    showStreamStatus(
                        "Ładowanie radia..."
                    );
                }
            }
        );


        audio.addEventListener(
            "stalled",
            () => {

                console.warn(
                    "[RADIO STALLED]",
                    channel.url
                );
            }
        );


        audio.addEventListener(
            "error",
            () => {

                console.error(
                    "[RADIO ERROR]",
                    {
                        url:
                            channel.url,
                        error:
                            audio.error
                    }
                );


                showStreamStatus(
                    "Błąd odtwarzania radia",
                    "error"
                );
            }
        );


        audio.play()
            .catch(
                error => {

                    console.warn(
                        "[RADIO AUTOPLAY]",
                        error
                    );


                    showStreamStatus(
                        "Radio oczekuje na kliknięcie"
                    );
                }
            );


        return;
    }


    showStreamStatus(
        `Nieobsługiwany typ: ${channel.type}`,
        "error"
    );
}


/* ============================================================
   NEXT
   ============================================================ */

function nextChannel() {

    currentChannelIndex =
        (
            currentChannelIndex + 1
        ) %
        channels.length;


    loadChannel(
        channels[
            currentChannelIndex
        ],
        currentChannelIndex
    );
}


/* ============================================================
   PREVIOUS
   ============================================================ */

function previousChannel() {

    currentChannelIndex =
        (
            currentChannelIndex - 1 +
            channels.length
        ) %
        channels.length;


    loadChannel(
        channels[
            currentChannelIndex
        ],
        currentChannelIndex
    );
}


/* ============================================================
   FULLSCREEN
   ============================================================ */

function toggleFullscreen() {

    if (
        !document.fullscreenElement
    ) {

        const container =
            document.getElementById(
                "player-container"
            );


        if (
            container.requestFullscreen
        ) {

            container
                .requestFullscreen()
                .catch(
                    () => {}
                );
        }

    } else {

        document
            .exitFullscreen()
            .catch(
                () => {}
            );
    }
}


/* ============================================================
   FADE
   ============================================================ */

function resetFade() {

    const button =
        document.getElementById(
            "fullscreen-btn"
        );


    button.classList.remove(
        "fade-out"
    );


    clearTimeout(
        fadeTimeout
    );


    fadeTimeout =
        setTimeout(
            () => {

                button.classList.add(
                    "fade-out"
                );

            },
            3000
        );
}


document.addEventListener(
    "mousemove",
    resetFade
);


/* ============================================================
   START
   ============================================================ */

loadChannel(
    channels[0],
    0
);

resetFade();


/* ============================================================
   CONTEXT MENU
   ============================================================ */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();
    }
);


/* ============================================================
   MOUSE
   ============================================================ */

document.addEventListener(
    "mousedown",
    event => {

        /*
         * Środkowy przycisk:
         * następny kanał.
         */

        if (
            event.button === 1
        ) {

            event.preventDefault();

            nextChannel();
        }


        /*
         * Prawy:
         * poprzedni kanał.
         */

        if (
            event.button === 2
        ) {

            event.preventDefault();

            previousChannel();
        }
    }
);


/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowRight"
        ) {

            nextChannel();
        }


        if (
            event.key === "ArrowLeft"
        ) {

            previousChannel();
        }


        if (
            event.key === "f" ||
            event.key === "F"
        ) {

            toggleFullscreen();
        }
    }
);


/* ============================================================
   RADIO AUTOPLAY PO INTERAKCJI
   ============================================================ */

document.addEventListener(
    "click",
    () => {

        const audio =
            document.querySelector(
                "#radio-audio"
            );


        if (
            audio
        ) {

            audio.play()
                .catch(
                    () => {}
                );
        }
    }
);


document.addEventListener(
    "touchstart",
    () => {

        const audio =
            document.querySelector(
                "#radio-audio"
            );


        if (
            audio
        ) {

            audio.play()
                .catch(
                    () => {}
                );
        }
    },
    {
        passive: true
    }
);

</script>
