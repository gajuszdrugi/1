        * {

            margin: 0;
            padding: 0;
        }

            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video, audio {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        iframe {
            width: 102%;
            height: 102%;
            border: none;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #trigger-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 9999;
        }

        #sidebar {
            position: absolute;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(0,0,0,0.95);
            transition: left 0.3s;
            z-index: 10000;
            overflow-y: auto;
            padding: 20px 10px;
            border-right: 1px solid #333;
            scrollbar-width: none;
        }

        #sidebar::-webkit-scrollbar {
            display: none;
        }

        #trigger-zone:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        .channel-item {
            padding: 12px;
            margin-bottom: 5px;
            background: #1a1a1a;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .channel-item:hover {
            background: #333;
        }

        .channel-item.active {
            background: #ff333d;
            color: #fff;
        }

        .channel-number {
            font-weight: bold;
            margin-right: 10px;
            min-width: 30px;
        }

        #channel-display {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 5px;
            z-index: 9998;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #channel-display.show {
            opacity: 1;
        }

        #fullscreen-btn {
            position: absolute;
            right: 20px;
            bottom: calc(20px + 57px);
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #fff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
            transition: opacity 0.5s;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #stream-status {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 9998;
            padding: 8px 14px;
            background: rgba(0,0,0,0.75);
            border-radius: 5px;
            font-size: 13px;
            color: #ddd;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #stream-status.show {
            opacity: 1;
        }

        #stream-status.error {
            color: #ff7777;
        }

        #stream-status.ok {
            color: #8cff8c;
        }

    clearTimeout(statusTimeout);

    streamStatus.textContent = text;

    streamStatus.classList.remove(
        'show',
        'error',
        'ok'
    );

    if (type) {

        streamStatus.classList.add(type);
    }

    streamStatus.classList.add('show');
}


function hideStreamStatus() {

    clearTimeout(statusTimeout);

    streamStatus.classList.remove(
        'show',
        'error',
        'ok'
    );
}


function hideStatusLater(
    token,
    delay = 2500
) {

    clearTimeout(statusTimeout);

    statusTimeout =
        setTimeout(
            () => {

                if (
                    token ===
                    loadingChannelToken
                ) {

                    hideStreamStatus();
                }

            },
            delay
        );
}


/* ============================================================
   CZYSZCZENIE
   ============================================================ */

function destroyCurrentPlayer() {

    loadingChannelToken++;

    clearTimeout(statusTimeout);

    if (currentHls) {

        try {

            currentHls.stopLoad();

        } catch (e) {}

        try {

            currentHls.detachMedia();

        } catch (e) {}

        try {

            currentHls.destroy();

        } catch (e) {}

        currentHls = null;
    }


    if (currentDash) {

        try {

            currentDash.pause();

        } catch (e) {}

        try {

            currentDash.reset();

        } catch (e) {}

        currentDash = null;
    }


    if (ytPlayer) {

        try {

            ytPlayer.stopVideo();

        } catch (e) {}

        try {

            ytPlayer.destroy();

        } catch (e) {}

        ytPlayer = null;
    }


    const mediaElements =
        videoTarget.querySelectorAll(
            'video, audio'
        );


    mediaElements.forEach(
        media => {

            try {

                media.pause();

            } catch (e) {}

            try {

                media.removeAttribute('src');

                media.load();

            } catch (e) {}
        }
    );


    pendingYoutubeChannel = null;
}


/* ============================================================
   HLS CANDIDATES
   ============================================================ */

function buildHlsCandidates(ch) {

    const urls = [];


    if (
        ch.url &&
        typeof ch.url === 'string'
    ) {

        urls.push(
            ch.url.trim()
        );
    }


    if (
        Array.isArray(
            ch.fallbackUrls
        )
    ) {

        ch.fallbackUrls.forEach(
            url => {

                if (
                    url &&
                    typeof url === 'string'
                ) {

                    urls.push(
                        url.trim()
                    );
                }
            }
        );
    }


    /*
     * Nie generujemy już ślepo
     * playlist.m3u8 / playlist720p.m3u8
     *
     * ponieważ wiele serwerów HLS ma
     * zupełnie inną strukturę URL.
     */


    return [
        ...new Set(
            urls.filter(Boolean)
        )
    ];
}


/* ============================================================
   HLS
   ============================================================ */

function tryHlsUrl(
    url,
    media,
    token,
    candidateIndex
) {

    return new Promise(
        (resolve, reject) => {

            if (
                token !==
                loadingChannelToken
            ) {

                reject(
                    new Error('cancelled')
                );

                return;
            }


            if (
                !window.Hls ||
                !Hls.isSupported()
            ) {

                reject(
                    new Error(
                        'HLS.js not supported'
                    )
                );

                return;
            }


            showStreamStatus(
                `HLS ${candidateIndex + 1}/${currentHlsUrls.length}: ładowanie...`
            );


            let finished = false;
            let fatalErrors = 0;
            let timeout = null;


            const hls =
                new Hls({

                    enableWorker: true,

                    lowLatencyMode: false,

                    backBufferLength: 30,

                    maxBufferLength: 30,

                    maxMaxBufferLength: 60,

                    manifestLoadingMaxRetry: 2,

                    manifestLoadingRetryDelay: 1000,

                    levelLoadingMaxRetry: 2,

                    levelLoadingRetryDelay: 1000,

                    fragLoadingMaxRetry: 3,

                    fragLoadingRetryDelay: 1000,

                    startFragPrefetch: true,

                    xhrSetup: function(xhr) {

                        try {

                            xhr.withCredentials =
                                false;

                        } catch (e) {}
                    }
                });


            currentHls = hls;


            function cleanup() {

                clearTimeout(timeout);

                hls.off(
                    Hls.Events.MANIFEST_PARSED,
                    onManifest
                );

                hls.off(
                    Hls.Events.ERROR,
                    onError
                );
            }


            function success() {

                if (finished) {
                    return;
                }

                finished = true;

                cleanup();

                showStreamStatus(
                    "STREAM DZIAŁA",
                    "ok"
                );

                hideStatusLater(
                    token,
                    2500
                );

                resolve(hls);
            }


            function failure(error) {

                if (finished) {
                    return;
                }

                finished = true;

                cleanup();

                try {
                    hls.stopLoad();
                } catch (e) {}

                try {
                    hls.detachMedia();
                } catch (e) {}

                try {
                    hls.destroy();
                } catch (e) {}

                if (
                    currentHls === hls
                ) {
                    currentHls = null;
                }

                reject(error);
            }


            function onManifest() {

                if (
                    token !==
                    loadingChannelToken
                ) {

                    failure(
                        new Error(
                            'cancelled'
                        )
                    );

                    return;
                }


                /*
                 * Manifest został odczytany.
                 * Próbujemy rozpocząć odtwarzanie.
                 */

                media.play()
                    .then(
                        () => {

                            success();

                        }
                    )
                    .catch(
                        error => {

                            /*
                             * Autoplay może być
                             * zablokowany przez przeglądarkę.
                             *
                             * Nie traktujemy tego jako
                             * awarii streamu.
                             */

                            console.warn(
                                'Autoplay zablokowany:',
                                error
                            );

                            showStreamStatus(
                                'Kliknij ekran, aby uruchomić stream'
                            );

                            success();
                        }
                    );
            }


            function onError(
                event,
                data
            ) {

                if (
                    token !==
                    loadingChannelToken
                ) {

                    failure(
                        new Error(
                            'cancelled'
                        )
                    );

                    return;
                }


                console.warn(
                    'HLS error:',
                    url,
                    data
                );


                if (
                    !data.fatal
                ) {

                    return;
                }


                fatalErrors++;


                /*
                 * Błąd sieci.
                 */

                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    showStreamStatus(
                        `Problem sieci — ponawiam ${fatalErrors}/2`
                    );


                    if (
                        fatalErrors < 2
                    ) {

                        setTimeout(
                            () => {

                                if (
                                    !finished &&
                                    token ===
                                    loadingChannelToken
                                ) {

                                    try {

                                        hls.startLoad();

                                    } catch (e) {}

                                }

                            },
                            1200
                        );

                    } else {

                        failure(
                            new Error(
                                'NETWORK_ERROR'
                            )
                        );
                    }


                    return;
                }


                /*
                 * Błąd dekodowania.
                 */

                if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    showStreamStatus(
                        'Naprawianie błędu media...'
                    );


                    if (
                        fatalErrors <= 2
                    ) {

                        try {

                            hls.recoverMediaError();

                        } catch (e) {

                            failure(
                                new Error(
                                    'MEDIA_ERROR'
                                )
                            );
                        }

                    } else {

                        failure(
                            new Error(
                                'MEDIA_ERROR'
                            )
                        );
                    }


                    return;
                }


                /*
                 * Pozostałe błędy fatalne.
                 */

                failure(
                    new Error(
                        data.details ||
                        'HLS_FATAL_ERROR'
                    )
                );
            }


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                onManifest
            );


            hls.on(
                Hls.Events.ERROR,
                onError
            );


            timeout =
                setTimeout(
                    () => {

                        if (
                            !finished
                        ) {

                            failure(
                                new Error(
                                    'HLS_TIMEOUT'
                                )
                            );
                        }

                    },
                    10000
                );


            try {

                /*
                 * WAŻNE:
                 *
                 * Najpierw attachMedia,
                 * dopiero później loadSource.
                 */

                hls.attachMedia(
                    media
                );

                hls.loadSource(
                    url
                );

            } catch (e) {

                failure(e);
            }
        }
    );
}


/* ============================================================
   HLS Z FALLBACKAMI
   ============================================================ */

async function loadHlsWithFallback(
    ch,
    media,
    token
) {

    currentHlsUrls =
        buildHlsCandidates(ch);


    currentHlsIndex = 0;


    if (
        currentHlsUrls.length === 0
    ) {

        showStreamStatus(
            'Brak adresu HLS',
            'error'
        );

        return;
    }


    console.log(
        'HLS candidates:',
        currentHlsUrls
    );


    /*
     * NATYWNY HLS
     *
     * Safari / iOS.
     */

    if (
        media.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ) {

        for (
            let i = 0;
            i < currentHlsUrls.length;
            i++
        ) {

            if (
                token !==
                loadingChannelToken
            ) {

                return;
            }


            const url =
                currentHlsUrls[i];


            currentHlsIndex = i;


            showStreamStatus(
                `Natywny HLS ${i + 1}/${currentHlsUrls.length}...`
            );


            try {

                media.pause();

            } catch (e) {}


            try {

                media.removeAttribute(
                    'src'
                );

                media.load();

            } catch (e) {}


            media.src = url;


            try {

                await media.play();


                showStreamStatus(
                    'STREAM DZIAŁA',
                    'ok'
                );

                hideStatusLater(
                    token,
                    2500
                );

                return;

            } catch (error) {

                console.warn(
                    'Natywny HLS nie działa:',
                    url,
                    error
                );


                if (
                    token !==
                    loadingChannelToken
                ) {

                    return;
                }


                try {

                    media.pause();

                    media.removeAttribute(
                        'src'
                    );

                    media.load();

                } catch (e) {}
            }
        }
    }


    /*
     * HLS.JS
     */

    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        for (
            let i = 0;
            i < currentHlsUrls.length;
            i++
        ) {

            if (
                token !==
                loadingChannelToken
            ) {

                return;
            }


            currentHlsIndex = i;


            const url =
                currentHlsUrls[i];


            try {

                await tryHlsUrl(
                    url,
                    media,
                    token,
                    i
                );


                return;

            } catch (error) {

                console.warn(
                    'HLS fallback:',
                    url,
                    error
                );


                if (
                    token !==
                    loadingChannelToken
                ) {

                    return;
                }


                if (currentHls) {

                    try {
                        currentHls.destroy();
                    } catch (e) {}

                    currentHls = null;
                }


                try {

                    media.pause();

                    media.removeAttribute(
                        'src'
                    );

                    media.load();

                } catch (e) {}


                if (
                    i <
                    currentHlsUrls.length - 1
                ) {

                    showStreamStatus(
                        `Próba kolejnego wariantu HLS...`
                    );

                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                500
                            )
                    );
                }
            }
        }
    }


    if (
        token ===
        loadingChannelToken
    ) {

        showStreamStatus(
            'Brak działającego wariantu HLS',
            'error'
        );

        console.error(
            'Żaden wariant HLS nie działa:',
            currentHlsUrls
        );
    }
}


/* ============================================================
   YOUTUBE
   ============================================================ */

function createYoutubePlayer(
    elementId,
    videoId,
    token
) {

    if (
        token !==
        loadingChannelToken
    ) {

        return;
    }


    if (
        !window.YT ||
        !YT.Player
    ) {

        pendingYoutubeChannel = {
            id: elementId,
            videoId: videoId,
            token: token
        };

        showStreamStatus(
            'Ładowanie YouTube...'
        );

        return;
    }


    ytPlayer =
        new YT.Player(
            elementId,
            {
                videoId: videoId,

                playerVars: {
                    autoplay: 1,
                    playsinline: 1,
                    controls: 1,
                    rel: 0,
                    modestbranding: 1
                },

                events: {

                    onReady:
                        function(event) {

                            if (
                                token !==
                                loadingChannelToken
                            ) {

                                try {
                                    event.target.destroy();
                                } catch (e) {}

                                return;
                            }


                            try {

                                event.target.playVideo();

                            } catch (e) {}

                        },

                    onStateChange:
                        function(event) {

                            if (
                                token !==
                                loadingChannelToken
                            ) {

                                return;
                            }


                            if (
                                event.data ===
                                YT.PlayerState.PLAYING
                            ) {

                                showStreamStatus(
                                    'STREAM DZIAŁA',
                                    'ok'
                                );

                                hideStatusLater(
                                    token,
                                    2500
                                );
                            }


                            if (
                                event.data ===
                                YT.PlayerState.BUFFERING
                            ) {

                                showStreamStatus(
                                    'Buforowanie...'
                                );
                            }
                        },

                    onError:
                        function(event) {

                            console.warn(
                                'YouTube error:',
                                event.data
                            );

                            showStreamStatus(
                                'Błąd YouTube',
                                'error'
                            );
                        }
                }
            }
        );
}

/* ============================================================
   LOAD CHANNEL
   ============================================================ */

function loadChannel(
    ch,
    index = currentChannelIndex
) {

    /*
     * Każde przełączenie dostaje nowy token.
     */

    loadingChannelToken++;

    const token =
        loadingChannelToken;


    currentChannelIndex =
        index;


    destroyCurrentPlayer();


    /*
     * destroyCurrentPlayer zwiększa token,
     * dlatego ustawiamy właściwy token jeszcze raz.
     */

    loadingChannelToken++;

    const currentToken =
        loadingChannelToken;


    videoTarget.innerHTML =
        '';


    /*
     * Aktywny kanał.
     */

    document
        .querySelectorAll(
            '.channel-item'
        )
        .forEach(
            el =>
                el.classList.remove(
                    'active'
                )
        );


    const activeItem =
        document.querySelector(
            `.channel-item[data-index="${index}"]`
        );


    if (activeItem) {

        activeItem.classList.add(
            'active'
        );
    }


    /*
     * Nazwa kanału.
     */

    channelDisplay.textContent =
        ch.name;


    channelDisplay.classList.add(
        'show'
    );


    clearTimeout(
        displayTimeout
    );


    displayTimeout =
        setTimeout(
            () => {

                channelDisplay.classList.remove(
                    'show'
                );

            },
            7000
        );


    const isBackgroundAudio =
        ch.backgroundAudio === true;


    /* ========================================================
       HLS
       ======================================================== */

    if (
        ch.type === 'hls'
    ) {

        if (isBackgroundAudio) {

            videoTarget.innerHTML =
                `
                <audio
                    id="v"
                    autoplay
                    playsinline
                    preload="auto">
                </audio>
                `;

        } else {

            videoTarget.innerHTML =
                `
                <video
                    id="v"
                    controls
                    autoplay
                    playsinline
                    preload="auto">
                </video>
                `;
        }


        const v =
            document.getElementById(
                'v'
            );


        if (isBackgroundAudio) {

            v.style.display =
                'none';
        }


        v.onplaying =
            () => {

                if (
                    currentToken !==
                    loadingChannelToken
                ) {

                    return;
                }


                showStreamStatus(
                    'STREAM DZIAŁA',
                    'ok'
                );

                hideStatusLater(
                    currentToken,
                    2500
                );
            };


        v.onwaiting =
            () => {

                if (
                    currentToken ===
                    loadingChannelToken
                ) {

                    showStreamStatus(
                        'Buforowanie...'
                    );
                }
            };


        v.onerror =
            () => {

                console.warn(
                    'HLS element error:',
                    v.error
                );
            };


        loadHlsWithFallback(
            ch,
            v,
            currentToken
        );


        return;
    }


    /* ========================================================
       DASH
       ======================================================== */

    if (
        ch.type === 'dash'
    ) {

        videoTarget.innerHTML =
            `
            <video
                id="v"
                controls
                autoplay
                playsinline
                preload="auto">
            </video>
            `;


        const v =
            document.getElementById(
                'v'
            );


        if (isBackgroundAudio) {

            v.style.display =
                'none';
        }


        if (
            !window.dashjs
        ) {

            showStreamStatus(
                'DASH.js nie został załadowany',
                'error'
            );

            return;
        }


        currentDash =
            dashjs
                .MediaPlayer()
                .create();


        currentDash.initialize(
            v,
            ch.url,
            false
        );


        v.onplaying =
            () => {

                if (
                    currentToken !==
                    loadingChannelToken
                ) {

                    return;
                }


                showStreamStatus(
                    'STREAM DZIAŁA',
                    'ok'
                );

                hideStatusLater(
                    currentToken,
                    2500
                );
            };


        v.onwaiting =
            () => {

                if (
                    currentToken ===
                    loadingChannelToken
                ) {

                    showStreamStatus(
                        'Buforowanie...'
                    );
                }
            };


        v.onerror =
            () => {

                console.warn(
                    'DASH error:',
                    v.error
                );

                showStreamStatus(
                    'Błąd DASH',
                    'error'
                );
            };


        /*
         * DASH może wymagać ręcznego play().
         */

        setTimeout(
            () => {

                if (
                    currentToken !==
                    loadingChannelToken
                ) {

                    return;
                }


                v.play()
                    .catch(
                        () => {

                            showStreamStatus(
                                'Kliknij ekran, aby uruchomić stream'
                            );
                        }
                    );

            },
            300
        );


        return;
    }


    /* ========================================================
       YOUTUBE
       ======================================================== */

    if (
        ch.type === 'youtube'
    ) {

        const youtubeId =
            `yt-${Date.now()}-${Math.random()
                .toString(36)
                .substring(2, 8)}`;


        videoTarget.innerHTML =
            `
            <div
                id="${youtubeId}"
                style="width:100%;height:100%;">
            </div>
            `;


        if (
            ytApiReady &&
            window.YT &&
            YT.Player
        ) {

            createYoutubePlayer(
                youtubeId,
                ch.url,
                currentToken
            );

        } else {

            pendingYoutubeChannel = {

                id: youtubeId,

                videoId: ch.url,

                token: currentToken
            };


            showStreamStatus(
                'Ładowanie YouTube...'
            );
        }


        return;
    }


    /* ========================================================
       IFRAME
       ======================================================== */

    if (
        ch.type === 'iframe' ||
        ch.type === 'iframe-dlhd'
    ) {

        videoTarget.innerHTML =
            `
            <iframe
                src="${escapeHtmlAttribute(ch.url)}"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
            </iframe>
            `;


        return;
    }


    /* ========================================================
       AUDIO
       ======================================================== */

    if (
        ch.type === 'audio'
    ) {

        videoTarget.innerHTML =
            `
            <audio
                id="radio-audio"
                autoplay
                playsinline
                preload="none">
            </audio>
            `;


        const a =
            document.getElementById(
                'radio-audio'
            );


        a.src =
            ch.url;


        if (
            isBackgroundAudio
        ) {

            a.style.display =
                'none';

        } else {

            a.controls =
                true;
        }


        a.onplaying =
            () => {

                if (
                    currentToken !==
                    loadingChannelToken
                ) {

                    return;
                }


                showStreamStatus(
                    'RADIO DZIAŁA',
                    'ok'
                );

                hideStatusLater(
                    currentToken,
                    2500
                );
            };


        a.onwaiting =
            () => {

                if (
                    currentToken ===
                    loadingChannelToken
                ) {

                    showStreamStatus(
                        'Ładowanie radia...'
                    );
                }
            };


        a.onstalled =
            () => {

                console.warn(
                    'Radio stalled:',
                    ch.url
                );
            };


        a.onerror =
            () => {

                console.warn(
                    'Radio error:',
                    a.error,
                    ch.url
                );


                if (
                    currentToken ===
                    loadingChannelToken
                ) {

                    showStreamStatus(
                        'Błąd odtwarzania radia',
                        'error'
                    );
                }
            };


        a.play()
            .then(
                () => {

                    if (
                        currentToken ===
                        loadingChannelToken
                    ) {

                        showStreamStatus(
                            'RADIO DZIAŁA',
                            'ok'
                        );

                        hideStatusLater(
                            currentToken,
                            2500
                        );
                    }

                }
            )
            .catch(
                error => {

                    console.warn(
                        'Autoplay radia zablokowany:',
                        error
                    );


                    if (
                        currentToken ===
                        loadingChannelToken
                    ) {

                        showStreamStatus(
                            'Kliknij ekran, aby uruchomić radio'
                        );
                    }
                }
            );


        return;
    }
}


/* ============================================================
   ESCAPE HTML ATTRIBUTE
   ============================================================ */

function escapeHtmlAttribute(
    value
) {

    return String(value)
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        );
}


/* ============================================================
   NEXT
   ============================================================ */

function nextChannel() {

    currentChannelIndex =
        (
            currentChannelIndex + 1
        ) %
        channels.length;


    loadChannel(
        channels[
            currentChannelIndex
        ],
        currentChannelIndex
    );
}


/* ============================================================
   PREVIOUS
   ============================================================ */

function previousChannel() {

    currentChannelIndex =
        (
            currentChannelIndex - 1 +
            channels.length
        ) %
        channels.length;


    loadChannel(
        channels[
            currentChannelIndex
        ],
        currentChannelIndex
    );
}


/* ============================================================
   FULLSCREEN
   ============================================================ */

function toggleFullscreen() {

    if (
        !document.fullscreenElement
    ) {

        const container =
            document.getElementById(
                'player-container'
            );


        if (
            container.requestFullscreen
        ) {

            container
                .requestFullscreen()
                .catch(
                    () => {}
                );
        }

    } else {

        if (
            document.exitFullscreen
        ) {

            document
                .exitFullscreen()
                .catch(
                    () => {}
                );
        }
    }
}


/* ============================================================
   FADE
   ============================================================ */

function resetFade() {

    const btn =
        document.getElementById(
            'fullscreen-btn'
        );


    btn.classList.remove(
        'fade-out'
    );


    clearTimeout(
        fadeTimeout
    );


    fadeTimeout =
        setTimeout(
            () => {

                btn.classList.add(
                    'fade-out'
                );

            },
            3000
        );
}


document.addEventListener(
    'mousemove',
    resetFade
);

document.addEventListener(
    'touchstart',
    resetFade,
    {
        passive: true
    }
);


/* ============================================================
   START
   ============================================================ */

resetFade();

loadChannel(
    channels[0],
    0
);


/* ============================================================
   MYSZ
   ============================================================ */

document.addEventListener(
    'contextmenu',
    e =>
        e.preventDefault()
);


document.addEventListener(
    'mousedown',
    function(e) {

        /*
         * Środkowy przycisk:
         * następny kanał.
         */

        if (
            e.button === 1
        ) {

            e.preventDefault();

            nextChannel();
        }


        /*
         * Prawy przycisk:
         * poprzedni kanał.
         */

        else if (
            e.button === 2
        ) {

            e.preventDefault();

            previousChannel();
        }
    }
);


/* ============================================================
   KLAWIATURA
   ============================================================ */

document.addEventListener(
    'keydown',
    function(e) {

        if (
            e.key === 'ArrowRight'
        ) {

            nextChannel();

            return;
        }


        if (
            e.key === 'ArrowLeft'
        ) {

            previousChannel();

            return;
        }


        if (
            e.key === 'f' ||
            e.key === 'F'
        ) {

            toggleFullscreen();
        }
    }
);


/* ============================================================
   URUCHOMIENIE AUDIO PO INTERAKCJI
   ============================================================ */

async function resumeCurrentAudio() {

    const audio =
        document.querySelector(
            '#radio-audio, audio#v'
        );


    if (!audio) {
        return;
    }


    try {

        await audio.play();

    } catch (e) {

        console.warn(
            'Nie można uruchomić audio:',
            e
        );
    }
}


document.addEventListener(
    'click',
    function() {

        resumeCurrentAudio();

    },
    {
        passive: true
    }
);


document.addEventListener(
    'touchstart',
    function() {

        resumeCurrentAudio();

    },
    {
        passive: true
    }
);


document.addEventListener(
    'keydown',
    function() {

        resumeCurrentAudio();

    },
    {
        passive: true
    }
);

</script>
