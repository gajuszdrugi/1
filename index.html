    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }

        video,
        audio {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        iframe {
            width: 102%;
            height: 102%;
            border: none;
            background: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #trigger-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 9999;
        }

        #sidebar {
            position: absolute;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            transition: left 0.3s;
            z-index: 10000;
            overflow-y: auto;
            padding: 20px 10px;
            border-right: 1px solid #333;
            scrollbar-width: none;
        }

        #sidebar::-webkit-scrollbar {
            display: none;
        }

        #trigger-zone:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        .channel-item {
            padding: 12px;
            margin-bottom: 5px;
            background: #1a1a1a;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .channel-item:hover {
            background: #333;
        }

        .channel-item.active {
            background: #ff333d;
            color: #fff;
        }

        .channel-number {
            font-weight: bold;
            margin-right: 10px;
            min-width: 30px;
        }

        #channel-display {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border-radius: 5px;
            z-index: 9998;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #channel-display.show {
            opacity: 1;
        }

        #fullscreen-btn {
            position: absolute;
            right: 20px;
            bottom: calc(20px + 57px);
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #fff;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
            transition: opacity 0.5s;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #stream-status {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 9998;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 5px;
            font-size: 13px;
            color: #ddd;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: calc(100% - 40px);
        }

        #stream-status.show {
            opacity: 1;
        }

        #stream-status.error {
            color: #ff7777;
        }

        #stream-status.ok {
            color: #8cff8c;
        }
    </style>
</head>

<div id="player-container">

let currentHls = null;
let currentDash = null;
let ytPlayer = null;

const videoTarget = document.getElementById('video-target');
const channelsUl = document.getElementById('channels-ul');
const channelDisplay = document.getElementById('channel-display');
const streamStatus = document.getElementById('stream-status');

function renderChannels() {
    channelsUl.innerHTML = '';
    channels.forEach((ch, index) => {
        const li = document.createElement('li');
        li.className = 'channel-item';
        li.innerHTML = `<span class="channel-number">${index + 1}</span><span>${ch.name}</span>`;
        li.onclick = () => selectChannel(index);
        channelsUl.appendChild(li);
    });
}

function selectChannel(index) {
    document.querySelectorAll('.channel-item').forEach((el, idx) => {
        if (idx === index) el.classList.add('active');
        else el.classList.remove('active');
    });

    const ch = channels[index];
    showChannelDisplay(ch.name);
    loadStream(ch);
}

function showChannelDisplay(name) {
    channelDisplay.textContent = name;
    channelDisplay.classList.add('show');
    setTimeout(() => {
        channelDisplay.classList.remove('show');
    }, 3000);
}

function showStatus(text, type = '') {
    streamStatus.textContent = text;
    streamStatus.className = `show ${type}`;
    setTimeout(() => {
        streamStatus.classList.remove('show');
    }, 4000);
}

function cleanPlayer() {
    if (currentHls) {
        currentHls.destroy();
        currentHls = null;
    }
    if (currentDash) {
        currentDash.reset();
        currentDash = null;
    }
    if (ytPlayer && typeof ytPlayer.destroy === 'function') {
        ytPlayer.destroy();
        ytPlayer = null;
    }
    videoTarget.innerHTML = '';
}

function loadStream(ch) {
    cleanPlayer();
    let streamUrl = ch.url;
    
    // Obsługa CORS proxy dla kanałów wymagających ominięcia blokady przeglądarki (np. Rotana)
    if (ch.proxy) {
        streamUrl = "https://corsproxy.io/?" + encodeURIComponent(ch.url);
    }

    if (ch.type === 'hls') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        videoTarget.appendChild(video);

        if (Hls.isSupported()) {
            currentHls = new Hls();
            currentHls.loadSource(streamUrl);
            currentHls.attachMedia(video);
            currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(() => {});
                showStatus("Strumień HLS załadowany", "ok");
            });
            currentHls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    showStatus("Błąd strumienia HLS", "error");
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', () => {
                video.play().catch(() => {});
            });
        }
    } else if (ch.type === 'dash') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        videoTarget.appendChild(video);

        currentDash = dashjs.MediaPlayer().create();
        currentDash.initialize(video, streamUrl, true);
    } else if (ch.type === 'audio') {
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.autoplay = true;
        audio.src = streamUrl;
        videoTarget.appendChild(audio);
        audio.play().catch(() => {});
    } else if (ch.type === 'youtube') {
        const div = document.createElement('div');
        div.id = 'yt-player';
        div.style.width = '100%';
        div.style.height = '100%';
        videoTarget.appendChild(div);

        ytPlayer = new YT.Player('yt-player', {
            videoId: streamUrl,
            playerVars: { 'autoplay': 1, 'controls': 1 },
            events: {
                'onReady': (event) => event.target.playVideo()
            }
        });
    } else if (ch.type === 'iframe' || ch.type === 'iframe-dlhd') {
        const iframe = document.createElement('iframe');
        iframe.src = streamUrl;
        iframe.allow = "autoplay; fullscreen";
        videoTarget.appendChild(iframe);
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

window.onload = () => {
    renderChannels();
    if (channels.length > 0) {
        selectChannel(0);
    }
};
