<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odtwarzacz Strumieni</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
        }
        iframe, video, audio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000000;
            cursor: pointer;
        }
        /* Domyślnie (niezmaksymalizowane) zachowujemy proporcje */
        .fit-contain {
            object-fit: contain !important;
        }
        /* Rozciąganie gdy okno jest zmaksymalizowane lub pełnoekranowe */
        .fit-fill {
            object-fit: fill !important;
        }

        #error-msg {
            color: #ff5555;
            font-family: monospace;
            padding: 20px;
            display: none;
            z-index: 999;
            position: relative;
        }

        /* Przycisk maksymalizowania (tylko ikona, brak napisów) */
        #pip-btn {
            position: fixed;
            bottom: 25px;
            right: 85px;
            width: 48px;
            height: 48px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: #ffffff;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.4s ease, background-color 0.2s ease, transform 0.2s ease;
        }
        #pip-btn:hover {
            background-color: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }
        #pip-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        #fs-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 48px;
            height: 48px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.4s ease, background-color 0.2s ease, transform 0.2s ease;
        }
        #fs-btn:hover {
            background-color: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }
        #fs-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        .hidden-cursor {
            cursor: none !important;
        }
    </style>
    <!-- HLS.js dla .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Dash.js dla .mpd -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
</head>
<body>
    <div id="error-msg"></div>
    <button id="fs-btn" title="Pełny ekran" style="display: none;">
        <svg viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
    </button>
    <button id="pip-btn" title="Okno w oknie" aria-label="Okno w oknie">
        <svg viewBox="0 0 24 24">
            <path d="M3 5h18v14H3V5zm2 2v10h14V7H5zm7 5h5v4h-5v-4z"/>
        </svg>
    </button>

    <script>
        function getTargetUrl() {
            if (window.location.hash) {
                let h = window.location.hash.substring(1);
                try { h = decodeURIComponent(h); } catch(e) {}
                return h;
            }
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('url')) {
                return urlParams.get('url');
            }
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            if (pathSegments.length > 1) {
                pathSegments.shift();
                if (pathSegments.length > 0) {
                    let reconstructed = pathSegments.join('/');
                    if (window.location.search) {
                        reconstructed += window.location.search;
                    }
                    return reconstructed;
                }
            }
            return null;
        }

        let currentActiveElement = null;
        let currentHlsInstance = null;
        let isStreamM3u8OrMpd = false;
        let isYouTubeStream = false;
        let pageSwitchInProgress = false;

        // Nawigacja stron: integracja z nadrzędną aplikacją/oknem.
        // Obsługuje popularne komunikaty; w razie braku hosta używa historii przeglądarki.
        function switchPage(direction) {
            const eventName = direction === 'next' ? 'nextPage' : 'previousPage';
            const detail = { direction, source: 'stream-player' };
            let dispatched = false;

            try {
                const event = new CustomEvent('stream-player:navigate', { detail, bubbles: true });
                dispatched = window.dispatchEvent(event);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'stream-player:navigate', ...detail }, '*');
                }
            } catch (e) {}

            // Jeśli aplikacja osadza odtwarzacz, nie zmieniaj historii samego odtwarzacza.
            if (window.parent && window.parent !== window) return;
            if (direction === 'next') history.forward();
            else history.back();
        }

        function requestPictureInPicture() {
            // PiP natywne działa na elementach <video>, ale nie na iframe YouTube.
            if (currentActiveElement && currentActiveElement.tagName === 'VIDEO') {
                if (document.pictureInPictureElement) {
                    document.exitPictureInPicture().catch(() => {});
                } else if (currentActiveElement.requestPictureInPicture) {
                    currentActiveElement.requestPictureInPicture().catch(err => {
                        console.warn('Nie można uruchomić obrazu w obrazie:', err);
                    });
                }
                return;
            }

            if (isYouTubeStream && currentActiveElement && currentActiveElement.tagName === 'IFRAME') {
                // YouTube nie udostępnia API PiP dla iframe cross-origin.
                // Próbujemy przełączyć wbudowany odtwarzacz w PiP przez komunikat YouTube
                // (obsługa zależy od przeglądarki i ustawień odtwarzacza).
                try {
                    currentActiveElement.contentWindow.postMessage(
                        JSON.stringify({ event: 'command', func: 'togglePictureInPicture', args: [] }),
                        'https://www.youtube.com'
                    );
                } catch (e) {}
                // Fallback: standardowe skróty YouTube/Chromium nie mogą być wywołane
                // programowo z powodu ograniczeń bezpieczeństwa przeglądarki.
                console.info('PiP dla YouTube może wymagać użycia kontrolki odtwarzacza YouTube.');
            }
        }

        // Funkcja sprawdzająca czy okno jest zmaksymalizowane lub w fullscreenie
        function checkWindowMaximization() {
            if (!currentActiveElement || currentActiveElement.tagName !== 'VIDEO') return;

            // Sprawdzamy czy okno zajmuje pełny ekran fizyczny ekranu (szacunkowo z marginesem paska zadań)
            // lub czy jest włączone API Fullscreen, bądź okno pokrywa cały obszar ekranu monitora.
            const isFullscreen = document.fullscreenElement !== null;
            const isMaximized = (window.outerWidth >= screen.availWidth && window.outerHeight >= screen.availHeight) ||
                                (window.innerWidth >= screen.width - 15 && window.innerHeight >= screen.height - 15);

            if (isFullscreen || isMaximized) {
                currentActiveElement.classList.remove('fit-contain');
                currentActiveElement.classList.add('fit-fill');
            } else {
                currentActiveElement.classList.remove('fit-fill');
                currentActiveElement.classList.add('fit-contain');
            }
        }

        window.addEventListener('resize', checkWindowMaximization);
        document.addEventListener('fullscreenchange', checkWindowMaximization);

        function loadStream() {
            document.querySelectorAll('iframe, video, audio').forEach(el => el.remove());
            if (currentHlsInstance) {
                currentHlsInstance.destroy();
                currentHlsInstance = null;
            }

            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';
            const fsBtn = document.getElementById('fs-btn');
            fsBtn.style.display = 'none';
            isStreamM3u8OrMpd = false;
            isYouTubeStream = false;
            const pipBtn = document.getElementById('pip-btn');
            pipBtn.style.display = 'none';

            const rawTarget = getTargetUrl();
            if (!rawTarget) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Brak adresu strumienia w URL (użyj np. /#twoj-link)';
                return;
            }

            let targetUrl = rawTarget;
            if (targetUrl.startsWith('http://')) {
                targetUrl = targetUrl.replace('http://', 'https://');
            } else if (!targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }

            const lowerUrl = targetUrl.toLowerCase();
            isStreamM3u8OrMpd = lowerUrl.includes('.m3u8') || lowerUrl.includes('.mpd');

            if (isStreamM3u8OrMpd) {
                fsBtn.style.display = 'flex';
                document.getElementById('pip-btn').style.display = 'flex';
            }

            // --- YOUTUBE ---
            if (lowerUrl.includes('youtube.com') || lowerUrl.includes('youtu.be')) {
                isYouTubeStream = true;
                fsBtn.style.display = 'flex';
                document.getElementById('pip-btn').style.display = 'flex';
                let ytEmbedUrl = targetUrl;
                if (targetUrl.includes('watch?v=')) {
                    const urlObj = new URL(targetUrl);
                    const v = urlObj.searchParams.get('v');
                    const list = urlObj.searchParams.get('list');
                    ytEmbedUrl = `https://www.youtube.com/embed/${v}?autoplay=1`;
                    if (list) ytEmbedUrl += `&list=${list}`;
                } else if (!targetUrl.includes('/embed/')) {
                    const match = targetUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                    if (match && match[1]) {
                        const urlObj = new URL(targetUrl);
                        const list = urlObj.searchParams.get('list');
                        ytEmbedUrl = `https://www.youtube.com/embed/${match[1]}?autoplay=1`;
                        if (list) ytEmbedUrl += `&list=${list}`;
                    }
                } else {
                    if (!ytEmbedUrl.includes('autoplay=1')) {
                        ytEmbedUrl += (ytEmbedUrl.includes('?') ? '&' : '?') + 'autoplay=1';
                    }
                }

                const iframe = document.createElement('iframe');
                // Włącz JS API YouTube, wymagane dla komunikacji z osadzonym odtwarzaczem.
                ytEmbedUrl += (ytEmbedUrl.includes('?') ? '&' : '?') + 'enablejsapi=1';
                iframe.src = ytEmbedUrl;
                iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                iframe.setAttribute('allowfullscreen', 'true');
                document.body.appendChild(iframe);
                currentActiveElement = iframe;

            } 
            // --- DASH (.mpd) ---
            else if (lowerUrl.includes('.mpd')) {
                const video = document.createElement('video');
                video.controls = false;
                video.autoplay = true;
                video.muted = false;
                video.className = 'fit-contain';
                document.body.appendChild(video);
                currentActiveElement = video;

                if (typeof dashjs !== 'undefined') {
                    const player = dashjs.MediaPlayer().create();
                    player.initialize(video, targetUrl, true);
                } else {
                    video.src = targetUrl;
                }
                checkWindowMaximization();
            } 
            // --- HLS / RADIO (.m3u8, .sdp) ---
            else if (lowerUrl.includes('.m3u8') || lowerUrl.includes('.sdp') || lowerUrl.includes('playlist')) {
                const isAudioOnly = lowerUrl.includes('.sdp') || lowerUrl.includes('polskieradio.pl') || lowerUrl.includes('radio');

                if (isAudioOnly) {
                    fsBtn.style.display = 'none'; // Ukryj przycisk pełnego ekranu dla audio
                    const audio = document.createElement('audio');
                    audio.autoplay = true;
                    audio.controls = false;
                    document.body.appendChild(audio);
                    currentActiveElement = audio;

                    if (Hls.isSupported() && lowerUrl.includes('.m3u8')) {
                        const hls = new Hls();
                        currentHlsInstance = hls;
                        hls.loadSource(targetUrl);
                        hls.attachMedia(audio);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            audio.play().catch(e => console.log("Autoplay zablokowany, kliknij w ekran."));
                        });
                    } else {
                        audio.src = targetUrl;
                        audio.play().catch(e => console.log("Autoplay zablokowany, kliknij w ekran."));
                    }
                } else {
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.controls = false;
                    video.className = 'fit-contain';
                    document.body.appendChild(video);
                    currentActiveElement = video;

                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        currentHlsInstance = hls;
                        hls.loadSource(targetUrl);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            video.play().catch(e => console.log("Autoplay zablokowany, kliknij w ekran."));
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = targetUrl;
                        video.play().catch(e => console.log("Autoplay zablokowany, kliknij w ekran."));
                    }
                    checkWindowMaximization();
                }
            } 
            // --- INNE ---
            else {
                const video = document.createElement('video');
                video.src = targetUrl;
                video.autoplay = true;
                video.controls = false;
                video.className = 'fit-contain';
                document.body.appendChild(video);
                currentActiveElement = video;
                video.play().catch(e => console.log("Autoplay zablokowany, kliknij w ekran."));
                checkWindowMaximization();
            }
        }

        loadStream();

        window.addEventListener('hashchange', () => {
            loadStream();
        });

        // Obsługa kliknięcia: pauza/odtwarzanie dla elementu wideo
        window.addEventListener('click', (e) => {
            // Ignoruj kliknięcie w przycisk pełnego ekranu
            if (e.target.closest('#fs-btn')) return;

            if (currentActiveElement && currentActiveElement.tagName === 'VIDEO') {
                if (currentActiveElement.paused) {
                    currentActiveElement.play().catch(err => console.log("Błąd odtwarzania:", err));
                } else {
                    currentActiveElement.pause();
                }
            }
        });

        // Przyciski odtwarzacza
        const pipBtn = document.getElementById('pip-btn');
        pipBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            requestPictureInPicture();
        });

        // Przełączanie stron: klawiatura, rolka kliknięta (middle) i prawy przycisk.
        window.addEventListener('keydown', (e) => {
            if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
            const target = e.target;
            if (target && (target.isContentEditable ||
                ['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(target.tagName))) return;

            if (e.key === 'ArrowUp') {
                e.preventDefault();
                switchPage('next');
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                switchPage('previous');
            }
        }, true);

        window.addEventListener('mousedown', (e) => {
            if (e.button === 1) {
                e.preventDefault();
                switchPage('next');
            } else if (e.button === 2) {
                e.preventDefault();
                switchPage('next');
            }
        }, true);

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, true);

        // Przycisk pełnego ekranu logika
        const fsBtn = document.getElementById('fs-btn');
        fsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error("Błąd wejścia w tryb pełnoekranowy:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // Ukrywanie przycisku oraz kursora po 5 sekundach bezczynności myszy
        let inactivityTimeout;
        function resetInactivityTimer() {
            if (isStreamM3u8OrMpd) {
                fsBtn.style.opacity = '1';
                document.body.classList.remove('hidden-cursor');
            }
            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(() => {
                if (isStreamM3u8OrMpd) {
                    fsBtn.style.opacity = '0';
                    document.body.classList.add('hidden-cursor');
                }
            }, 5000);
        }

        window.addEventListener('mousemove', resetInactivityTimer);
        window.addEventListener('mousedown', resetInactivityTimer);
    </script>
</body>
</html>
