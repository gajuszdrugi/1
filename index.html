<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odtwarzacz Streamów</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
            color: #fff;
            user-select: none;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #000;
        }

        video, audio {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        /* Ukrywanie elementu audio w trybie rozdzielonym (odtwarza się w tle pod wideo) */
        audio.split-audio {
            display: none;
        }

        .radio-mode video, 
        .radio-mode audio {
            display: none !important;
        }

        iframe {
            width: 102%;
            height: 102%;
            border: none;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9990;
            background: transparent;
        }

        #click-overlay.disabled {
            display: none !important;
        }

        #trigger-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 9999;
        }

        #sidebar {
            position: absolute;
            left: -320px;
            top: 0;
            width: 320px;
            height: 100%;
            background: rgba(0,0,0,0.95);
            transition: left 0.3s ease;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }

        #trigger-zone:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        #channels-ul {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding: 10px 10px 5px 10px;
            scrollbar-width: none;
        }

        #channels-ul::-webkit-scrollbar {
            display: none;
        }

        .channel-item {
            padding: 6px 10px;
            margin-bottom: 2px;
            background: #1a1a1a;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.15s;
            font-size: 0.9rem;
        }

        .channel-item:hover {
            background: #333;
        }

        .channel-item.active {
            background: #ff333d;
            color: #fff;
        }

        .channel-number {
            font-weight: bold;
            margin-right: 8px;
            min-width: 26px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .channel-item.active .channel-number {
            color: #fff;
        }

        .sidebar-controls {
            padding: 10px;
            border-top: 1px solid #222;
            background: rgba(0,0,0,0.98);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-btn {
            width: 100%;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        .sidebar-btn.active-control {
            background: rgba(40, 167, 69, 0.4);
            border-color: #28a745;
        }

        #channel-display {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 5px;
            z-index: 9998;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #channel-display.show {
            opacity: 1;
        }

        #stream-status {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 9998;
            padding: 8px 14px;
            background: rgba(0,0,0,0.75);
            border-radius: 5px;
            font-size: 13px;
            color: #ddd;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #stream-status.show {
            opacity: 1;
        }

        #stream-status.error {
            color: #ff7777;
        }

        #stream-status.ok {
            color: #8cff8c;
        }
    </style>
</head>

<body>

    <div id="click-overlay"></div>
    <div id="channel-display"></div>
    <div id="stream-status"></div>
    <div id="trigger-zone"></div>
    
    <div id="sidebar">
        <ul id="channels-ul"></ul>
        <div class="sidebar-controls">
            <button class="sidebar-btn" onclick="togglePictureInPicture()">OBRAZ W OBRAZIE (PiP)</button>
            <button class="sidebar-btn" onclick="toggleFullscreen()">PEŁNY EKRAN</button>
            <button class="sidebar-btn" id="toggle-yt-controls-btn" onclick="toggleYTControls()">PRZEŁĄCZ STEROWANIE YT</button>
        </div>
    </div>
    
    <div id="video-target" style="width:100%; height:100%;"></div>
</div>

let currentIndex = 0;
let hlsInstance = null;
let hlsAudioInstance = null;
let dashInstance = null;
let displayTimeout = null;
let statusTimeout = null;

function getYouTubeEmbedUrl(url) {
    let videoId = url;
    if (url.includes('youtube.com/watch?v=')) {
        videoId = url.split('watch?v=')[1].split('&')[0];
    } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
    } else if (url.includes('youtube.com/embed/')) {
        videoId = url.split('embed/')[1].split('?')[0];
    }
    return `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1&rel=0`;
}

function initSidebar() {
    const ul = document.getElementById('channels-ul');
    ul.innerHTML = '';
    channels.forEach((ch, idx) => {
        const li = document.createElement('li');
        li.className = 'channel-item' + (idx === currentIndex ? ' active' : '');
        li.innerHTML = `<span class="channel-number">${idx + 1}.</span><span>${ch.name}</span>`;
        li.onclick = () => playChannel(idx);
        ul.appendChild(li);
    });
}

function updateActiveSidebarItem() {
    const items = document.querySelectorAll('.channel-item');
    items.forEach((item, idx) => {
        if (idx === currentIndex) {
            item.classList.add('active');
            item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else {
            item.classList.remove('active');
        }
    });
}

function showChannelName(name) {
    const display = document.getElementById('channel-display');
    display.innerText = `${currentIndex + 1}. ${name}`;
    display.classList.add('show');
    clearTimeout(displayTimeout);
    displayTimeout = setTimeout(() => display.classList.remove('show'), 3000);
}

function showStatus(msg, isError = false) {
    const status = document.getElementById('stream-status');
    status.innerText = msg;
    status.className = 'show ' + (isError ? 'error' : 'ok');
    clearTimeout(statusTimeout);
    statusTimeout = setTimeout(() => status.classList.remove('show'), 4000);
}

function cleanupPlayer() {
    if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
    }
    if (hlsAudioInstance) {
        hlsAudioInstance.destroy();
        hlsAudioInstance = null;
    }
    if (dashInstance) {
        dashInstance.reset();
        dashInstance = null;
    }
    const container = document.getElementById('video-target');
    container.innerHTML = '';
    document.body.classList.remove('radio-mode');
}

function playChannel(index) {
    if (index < 0) index = channels.length - 1;
    if (index >= channels.length) index = 0;

    currentIndex = index;
    const channel = channels[currentIndex];

    cleanupPlayer();
    updateActiveSidebarItem();
    showChannelName(channel.name);
    showStatus(`Ładowanie: ${channel.name}...`);

    const container = document.getElementById('video-target');

    if (channel.type === 'hls') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        container.appendChild(video);

        if (Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(channel.url);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) showStatus(`Błąd ładowania HLS: ${channel.name}`, true);
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = channel.url;
            video.play().catch(() => {});
        }
    } 
    else if (channel.type === 'hls-split') {
        // Tworzenie elementu wideo oraz ukrytego elementu audio dla rozdzielonego strumienia
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        container.appendChild(video);

        const audio = document.createElement('audio');
        audio.autoplay = true;
        audio.className = 'split-audio';
        container.appendChild(audio);

        if (Hls.isSupported()) {
            // Inicjalizacja wideo
            hlsInstance = new Hls();
            hlsInstance.loadSource(channel.videoUrl);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));

            // Inicjalizacja audio
            hlsAudioInstance = new Hls();
            hlsAudioInstance.loadSource(channel.audioUrl);
            hlsAudioInstance.attachMedia(audio);
            hlsAudioInstance.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(() => {}));

            // Synchronizacja akcji odtwarzacza
            video.onplay = () => audio.play().catch(() => {});
            video.onpause = () => audio.pause();
            video.onseeking = () => { audio.currentTime = video.currentTime; };

            hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) showStatus(`Błąd strumienia wideo: ${channel.name}`, true);
            });
            hlsAudioInstance.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) showStatus(`Błąd strumienia audio: ${channel.name}`, true);
            });
        }
    }
    else if (channel.type === 'dash') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        container.appendChild(video);

        dashInstance = dashjs.MediaPlayer().create();
        dashInstance.initialize(video, channel.url, true);
    } 
    else if (channel.type === 'audio') {
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.autoplay = true;
        audio.src = channel.url;
        container.appendChild(audio);
        audio.play().catch(() => {});
    } 
    else if (channel.type === 'iframe' || channel.type === 'youtube') {
        const iframe = document.createElement('iframe');
        iframe.src = channel.type === 'youtube' ? getYouTubeEmbedUrl(channel.url) : channel.url;
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; web-share";
        iframe.allowFullscreen = true;
        container.appendChild(iframe);
    }
}

function nextStream() {
    playChannel(currentIndex + 1);
}

function prevStream() {
    playChannel(currentIndex - 1);
}

window.addEventListener('contextmenu', (e) => {
    if (e.target.closest('#sidebar')) return;
    e.preventDefault();
    nextStream();
});

window.addEventListener('auxclick', (e) => {
    if (e.button === 1) {
        e.preventDefault();
        prevStream();
    }
});

function toggleYTControls() {
    const overlay = document.getElementById('click-overlay');
    const btn = document.getElementById('toggle-yt-controls-btn');
    overlay.classList.toggle('disabled');
    btn.classList.toggle('active-control');
}

async function togglePictureInPicture() {
    try {
        const channel = channels[currentIndex];
        if (channel.type === 'youtube' || channel.type === 'iframe') {
            showStatus("Tryb Picture-in-Picture jest niedostępny dla tego typu strumienia.", true);
            return;
        }

        const video = document.querySelector('video');
        if (video) {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else {
                await video.requestPictureInPicture();
            }
            return;
        }

        showStatus("Picture-in-Picture niedostępne dla bieżącego odtwarzacza.", true);
    } catch (err) {
        showStatus("Błąd trybu Obraz w obrazie: " + err.message, true);
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
        }
    }
}

window.onload = () => {
    initSidebar();
    playChannel(0);
};
</script>
