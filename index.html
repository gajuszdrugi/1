<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Fullscreen Stream Player</title>
    <!-- Tailwind CSS for modern, clean styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="relative w-full h-full bg-black">

    <!-- Fullscreen Player Container -->
    <div id="player-container" class="absolute inset-0 w-full h-full z-0">
        <iframe id="yt-player" 
                class="w-full h-full border-0"
                src="" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- Toggle Controls Button (Top Right) -->
    <button id="toggle-ui" onclick="toggleUI()" class="absolute top-4 right-4 z-20 bg-zinc-900/80 hover:bg-zinc-800 text-white px-4 py-2 rounded-xl backdrop-blur-md border border-zinc-700/50 shadow-lg transition-all text-sm font-medium flex items-center gap-2 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span id="toggle-text">Ukryj Panel</span>
    </button>

    <!-- Floating Control Panel (Bottom/Center overlay) -->
    <div id="control-panel" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 w-[90%] max-w-3xl bg-zinc-900/90 backdrop-blur-xl border border-zinc-800 p-5 rounded-2xl shadow-2xl transition-all duration-300">
        <h1 class="text-white text-lg font-semibold mb-3 flex items-center justify-between">
            <span>Odtwarzacz Transmisji YouTube</span>
            <span class="text-xs text-zinc-400 font-normal">Tryb pełnoekranowy bez błędu 152</span>
        </h1>

        <!-- Custom Link Input Bar -->
        <div class="flex gap-2 mb-4">
            <input type="text" id="custom-url" placeholder="Wklej dowolny link HTTPS YouTube (np. https://youtu.be/...)" 
                   class="flex-1 bg-zinc-950/60 border border-zinc-700/60 rounded-xl px-4 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-red-500 transition-colors">
            <button onclick="playCustomLink()" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-colors cursor-pointer shadow-lg shadow-red-600/20">
                Odtwórz
            </button>
        </div>

        <!-- Predefined Streams List with Individual Link Options -->
        <div class="space-y-2">
            <p class="text-xs text-zinc-400 font-medium uppercase tracking-wider mb-2">Domyślne transmisje:</p>
            
            <!-- Stream 1 -->
            <div class="flex items-center justify-between bg-zinc-950/40 border border-zinc-800/80 px-4 py-2.5 rounded-xl hover:border-zinc-700 transition-all">
                <div class="flex items-center gap-3 overflow-hidden">
                    <span class="text-xs bg-red-600/20 text-red-400 font-mono px-2 py-0.5 rounded border border-red-500/30">Stream 1</span>
                    <span class="text-xs text-zinc-300 font-mono truncate">0i7n3r01L2U</span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="copyStreamLink('0i7n3r01L2U')" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
                        Kopiuj link
                    </button>
                    <a href="https://www.youtube.com/watch?v=0i7n3r01L2U" target="_blank" rel="noopener noreferrer" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg transition-colors">
                        Otwórz ↗
                    </a>
                    <button onclick="loadVideo('0i7n3r01L2U')" class="text-xs bg-red-600 hover:bg-red-500 text-white font-medium px-4 py-1.5 rounded-lg transition-colors cursor-pointer">
                        Włącz
                    </button>
                </div>
            </div>

            <!-- Stream 2 -->
            <div class="flex items-center justify-between bg-zinc-950/40 border border-zinc-800/80 px-4 py-2.5 rounded-xl hover:border-zinc-700 transition-all">
                <div class="flex items-center gap-3 overflow-hidden">
                    <span class="text-xs bg-red-600/20 text-red-400 font-mono px-2 py-0.5 rounded border border-red-500/30">Stream 2</span>
                    <span class="text-xs text-zinc-300 font-mono truncate">hvVlyZ5GiE8</span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="copyStreamLink('hvVlyZ5GiE8')" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
                        Kopiuj link
                    </button>
                    <a href="https://www.youtube.com/watch?v=hvVlyZ5GiE8" target="_blank" rel="noopener noreferrer" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg transition-colors">
                        Otwórz ↗
                    </a>
                    <button onclick="loadVideo('hvVlyZ5GiE8')" class="text-xs bg-red-600 hover:bg-red-500 text-white font-medium px-4 py-1.5 rounded-lg transition-colors cursor-pointer">
                        Włącz
                    </button>
                </div>
            </div>

            <!-- Stream 3 -->
            <div class="flex items-center justify-between bg-zinc-950/40 border border-zinc-800/80 px-4 py-2.5 rounded-xl hover:border-zinc-700 transition-all">
                <div class="flex items-center gap-3 overflow-hidden">
                    <span class="text-xs bg-red-600/20 text-red-400 font-mono px-2 py-0.5 rounded border border-red-500/30">Stream 3</span>
                    <span class="text-xs text-zinc-300 font-mono truncate">IimtbuqYIE8</span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="copyStreamLink('IimtbuqYIE8')" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
                        Kopiuj link
                    </button>
                    <a href="https://www.youtube.com/watch?v=IimtbuqYIE8" target="_blank" rel="noopener noreferrer" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg transition-colors">
                        Otwórz ↗
                    </a>
                    <button onclick="loadVideo('IimtbuqYIE8')" class="text-xs bg-red-600 hover:bg-red-500 text-white font-medium px-4 py-1.5 rounded-lg transition-colors cursor-pointer">
                        Włącz
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Extracts YouTube Video ID from standard and short HTTPS URLs or direct IDs
        function extractVideoId(urlOrId) {
            if (!urlOrId) return "";
            const trimmed = urlOrId.trim();
            
            // If it's already a clean ID (like 11 characters alphanumeric)
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) {
                return trimmed;
            }

            try {
                const parsedUrl = new URL(trimmed);
                if (parsedUrl.hostname.includes('youtu.be')) {
                    return parsedUrl.pathname.slice(1);
                } else if (parsedUrl.searchParams.has('v')) {
                    return parsedUrl.searchParams.get('v');
                } else if (parsedUrl.pathname.includes('/embed/')) {
                    return parsedUrl.pathname.split('/embed/')[1];
                } else if (parsedUrl.pathname.includes('/live/')) {
                    return parsedUrl.pathname.split('/live/')[1];
                }
            } catch (e) {
                // Not a valid URL, fallback search regex
                const match = trimmed.match(/(?:v=|\/embed\/|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
                if (match) return match[1];
            }
            return trimmed;
        }

        // Loads the video into the iframe with parameters to avoid restriction/152 issues
        function loadVideo(input) {
            const videoId = extractVideoId(input);
            if (!videoId) {
                alert("Nieprawidłowy identyfikator lub link transmisji!");
                return;
            }

            // Using official embed parameters with autoplay and full api enablement
            const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1&playsinline=1`;
            document.getElementById('yt-player').src = embedUrl;
        }

        // Handles custom link input field submission
        function playCustomLink() {
            const val = document.getElementById('custom-url').value;
            if (val) {
                loadVideo(val);
            } else {
                alert("Najpierw wklej link HTTPS!");
            }
        }

        // Copies individual stream link to clipboard
        function copyStreamLink(id) {
            const fullLink = `https://www.youtube.com/watch?v=${id}`;
            navigator.clipboard.writeText(fullLink).then(() => {
                alert("Skopiowano link do schowka: " + fullLink);
            }).catch(err => {
                console.error("Błąd kopiowania", err);
            });
        }

        // Toggle UI visibility for cleaner fullscreen viewing
        let isUIVisible = true;
        function toggleUI() {
            const panel = document.getElementById('control-panel');
            const btnText = document.getElementById('toggle-text');
            isUIVisible = !isUIVisible;
            
            if (isUIVisible) {
                panel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                btnText.textContent = "Ukryj Panel";
            } else {
                panel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                btnText.textContent = "Pokaź Panel";
            }
        }

        // Automatically load the first stream on startup
        window.onload = function() {
            loadVideo('0i7n3r01L2U');
        };
    </script>
</body>
</html>
