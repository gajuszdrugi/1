    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video, audio {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        iframe {
            width: 102%;
            height: 102%;
            border: none;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #trigger-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 9999;
        }

        #sidebar {
            position: absolute;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(0,0,0,0.95);
            transition: left 0.3s;
            z-index: 10000;
            overflow-y: auto;
            padding: 20px 10px;
            border-right: 1px solid #333;
            scrollbar-width: none;
        }

        #sidebar::-webkit-scrollbar {
            display: none;
        }

        #trigger-zone:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        .channel-item {
            padding: 12px;
            margin-bottom: 5px;
            background: #1a1a1a;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .channel-item:hover {
            background: #333;
        }

        .channel-item.active {
            background: #ff333d;
            color: #fff;
        }

        .channel-number {
            font-weight: bold;
            margin-right: 10px;
            min-width: 30px;
        }

        #channel-display {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 5px;
            z-index: 9998;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #channel-display.show {
            opacity: 1;
        }

        #fullscreen-btn {
            position: absolute;
            right: 20px;
            bottom: calc(20px + 57px);
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #fff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
            transition: opacity 0.5s;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /*
         * Informacja o aktualnym stanie HLS.
         */
        #stream-status {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 9998;
            padding: 8px 14px;
            background: rgba(0,0,0,0.75);
            border-radius: 5px;
            font-size: 13px;
            color: #ddd;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #stream-status.show {
            opacity: 1;
        }

        #stream-status.error {
            color: #ff7777;
        }

        #stream-status.ok {
            color: #8cff8c;
        }
    </style>
</head>

   ZMIENNE ODTWARZACZA
   ============================================================ */

let currentHls = null;
let currentDash = null;
let ytPlayer = null;

let fadeTimeout;
let displayTimeout;

let currentChannelIndex = 0;

let currentHlsUrls = [];
let currentHlsIndex = 0;

let hlsAttempt = 0;
let hlsFailTimer = null;

let loadingChannelToken = 0;


/* ============================================================
   WEB AUDIO
   ============================================================ */

let audioCtx = null;
let audioSourceNode = null;
let gainNode = null;
let compressorNode = null;


/* ============================================================
   KONFIGURACJA AUTOMATYCZNEGO HLS
   ============================================================ */

const HLS_CONFIG = {

    /*
     * Ile czasu dajemy playlistcie na rozpoczęcie pracy.
     */
    startupTimeout: 9000,

    /*
     * Ile razy próbujemy ponownie ten sam URL.
     */
    retriesPerUrl: 2,

    /*
     * Opóźnienie pomiędzy retry.
     */
    retryDelay: 1200,

    /*
     * Po ilu błędach przechodzimy na następny URL.
     */
    maxFatalErrorsPerUrl: 2
};


/* ============================================================
   STATUS
   ============================================================ */

function showStreamStatus(text, type = '') {

    streamStatus.textContent = text;

    streamStatus.classList.remove('show', 'error', 'ok');

    if (type) {
        streamStatus.classList.add(type);
    }

    streamStatus.classList.add('show');
}


function hideStreamStatus() {

    streamStatus.classList.remove('show', 'error', 'ok');

}


/* ============================================================
   CZYSZCZENIE ODTWARZACZA
   ============================================================ */

function destroyCurrentPlayer() {

    clearTimeout(hlsFailTimer);

    if (currentHls) {

        try {
            currentHls.destroy();
        } catch (e) {
            console.warn("HLS destroy error:", e);
        }

        currentHls = null;
    }

    if (currentDash) {

        try {
            currentDash.reset();
        } catch (e) {
            console.warn("DASH reset error:", e);
        }

        currentDash = null;
    }

    if (ytPlayer) {

        try {
            ytPlayer.destroy();
        } catch (e) {}

        ytPlayer = null;
    }

    if (audioSourceNode) {

        try {
            audioSourceNode.disconnect();
        } catch (e) {}

        audioSourceNode = null;
    }
}


/* ============================================================
   WEB AUDIO
   ============================================================ */

function initAudioContext() {

    if (!audioCtx) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return false;
        }

        audioCtx = new AudioContext();

        compressorNode =
            audioCtx.createDynamicsCompressor();

        compressorNode.threshold.setValueAtTime(
            -12,
            audioCtx.currentTime
        );

        compressorNode.knee.setValueAtTime(
            3,
            audioCtx.currentTime
        );

        compressorNode.ratio.setValueAtTime(
            12,
            audioCtx.currentTime
        );

        compressorNode.attack.setValueAtTime(
            0.003,
            audioCtx.currentTime
        );

        compressorNode.release.setValueAtTime(
            0.25,
            audioCtx.currentTime
        );

        gainNode = audioCtx.createGain();

        gainNode.gain.setValueAtTime(
            0.2,
            audioCtx.currentTime
        );

        compressorNode.connect(gainNode);

        gainNode.connect(audioCtx.destination);
    }

    if (audioCtx.state === 'suspended') {

        audioCtx.resume().catch(() => {});
    }

    return true;
}


/*
 * WAŻNA ZMIANA:
 *
 * WebAudio może wymagać CORS.
 *
 * Dlatego nie pozwalamy, żeby błąd WebAudio
 * zatrzymał odtwarzanie HLS.
 */
function connectMediaElement(element) {

    try {

        if (!initAudioContext()) {
            return;
        }

        if (audioSourceNode) {

            try {
                audioSourceNode.disconnect();
            } catch (e) {}

            audioSourceNode = null;
        }

        audioSourceNode =
            audioCtx.createMediaElementSource(element);

        audioSourceNode.connect(compressorNode);

    } catch (e) {

        /*
         * Jeżeli źródło nie posiada CORS,
         * WebAudio może tutaj zgłosić błąd.
         *
         * STREAM NADAL MOŻE DZIAŁAĆ NORMALNIE.
         */
        console.warn(
            "WebAudio/CORS - pozostawiam normalne odtwarzanie:",
            e
        );
    }
}


/* ============================================================
   BUDOWANIE LISTY HLS
   ============================================================ */

function buildHlsCandidates(ch) {

    const urls = [];

    /*
     * Najpierw podstawowy URL.
     */
    if (ch.url) {
        urls.push(ch.url.trim());
    }

    /*
     * Własne fallbackUrls.
     */
    if (Array.isArray(ch.fallbackUrls)) {

        ch.fallbackUrls.forEach(url => {

            if (url && typeof url === 'string') {

                urls.push(url.trim());
            }
        });
    }

    /*
     * AUTOMATYCZNE WARIANTY.
     *
     * Dla:
     *
     * /64733/64733_264_live.m3u8
     *
     * próbujemy również:
     *
     * /64733/playlist.m3u8
     * /64733/playlist720p.m3u8
     */
    try {

        const parsed = new URL(ch.url);

        const path = parsed.pathname;

        if (
            path.endsWith('.m3u8') &&
            !path.endsWith('/playlist.m3u8') &&
            !path.endsWith('/playlist720p.m3u8')
        ) {

            const directory =
                path.substring(
                    0,
                    path.lastIndexOf('/') + 1
                );

            const origin =
                parsed.origin;

            urls.push(
                origin +
                directory +
                'playlist.m3u8'
            );

            urls.push(
                origin +
                directory +
                'playlist720p.m3u8'
            );
        }

    } catch (e) {

        console.warn(
            "Nie można wygenerować wariantów HLS:",
            e
        );
    }

    /*
     * Usuwamy duplikaty.
     */
    return [...new Set(
        urls.filter(Boolean)
    )];
}


/* ============================================================
   SPRAWDZENIE CZY URL WYGLĄDA NA HLS
   ============================================================ */

function isHlsUrl(url) {

    if (!url) return false;

    return (
        url.toLowerCase().includes('.m3u8')
    );
}


/* ============================================================
   CORS / FETCH TEST
   ============================================================ */

/*
 * UWAGA:
 *
 * Ten test nie może "naprawić" CORS.
 *
 * Ma tylko wykryć, czy przeglądarka może
 * pobrać playlistę przez fetch.
 *
 * Jeżeli fetch zakończy się błędem CORS,
 * przechodzimy dalej do następnego wariantu.
 */
async function testCors(url, token) {

    if (token !== loadingChannelToken) {
        return {
            ok: false,
            cancelled: true
        };
    }

    try {

        const controller =
            new AbortController();

        const timeout =
            setTimeout(
                () => controller.abort(),
                4500
            );

        const response =
            await fetch(
                url,
                {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-store',
                    signal: controller.signal
                }
            );

        clearTimeout(timeout);

        if (!response.ok) {

            return {
                ok: false,
                status: response.status,
                cors: true
            };
        }

        /*
         * Czytamy niewielki fragment.
         */
        await response.text();

        return {
            ok: true,
            cors: true
        };

    } catch (e) {

        return {
            ok: false,
            cors: false,
            error: e
        };
    }
}


/* ============================================================
   PRÓBA HLS
   ============================================================ */

function tryHlsUrl(
    url,
    video,
    token,
    candidateIndex
) {

    return new Promise((resolve, reject) => {

        if (token !== loadingChannelToken) {

            reject(
                new Error("cancelled")
            );

            return;
        }

        if (!window.Hls || !Hls.isSupported()) {

            reject(
                new Error("HLS.js not supported")
            );

            return;
        }

        showStreamStatus(
            `HLS ${candidateIndex + 1}/${currentHlsUrls.length}: ładowanie...`
        );

        let resolved = false;
        let fatalErrors = 0;

        clearTimeout(hlsFailTimer);

        const hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 30,

                maxBufferLength: 30,

                maxMaxBufferLength: 60,

                manifestLoadingMaxRetry: 1,

                manifestLoadingRetryDelay: 1000,

                levelLoadingMaxRetry: 1,

                levelLoadingRetryDelay: 1000,

                fragLoadingMaxRetry: 2,

                fragLoadingRetryDelay: 1000,

                /*
                 * Nie wymuszamy credentials.
                 */
                xhrSetup: function(xhr) {

                    try {
                        xhr.withCredentials = false;
                    } catch (e) {}
                }
            });

        currentHls = hls;

        function cleanup() {

            clearTimeout(hlsFailTimer);

            hls.off(
                Hls.Events.MANIFEST_PARSED,
                onManifest
            );

            hls.off(
                Hls.Events.ERROR,
                onError
            );
        }


        function success() {

            if (resolved) return;

            resolved = true;

            cleanup();

            showStreamStatus(
                "STREAM DZIAŁA",
                "ok"
            );

            /*
             * Po 3 sekundach chowamy status.
             */
            setTimeout(() => {

                if (token === loadingChannelToken) {
                    hideStreamStatus();
                }

            }, 3000);

            resolve(hls);
        }


        function failure(error) {

            if (resolved) return;

            resolved = true;

            cleanup();

            try {
                hls.destroy();
            } catch (e) {}

            if (currentHls === hls) {
                currentHls = null;
            }

            reject(error);
        }


        function onManifest() {

            if (token !== loadingChannelToken) {

                failure(
                    new Error("cancelled")
                );

                return;
            }

            /*
             * Manifest został pobrany.
             *
             * Teraz próbujemy uruchomić video.
             */
            video.play()
                .then(() => {

                    success();

                })
                .catch(() => {

                    /*
                     * Autoplay może być zablokowany.
                     * Sam manifest jest jednak poprawny.
                     */
                    success();
                });
        }


        function onError(event, data) {

            if (token !== loadingChannelToken) {

                failure(
                    new Error("cancelled")
                );

                return;
            }

            console.warn(
                "HLS:",
                url,
                data
            );

            if (!data.fatal) {
                return;
            }

            fatalErrors++;

            /*
             * Błąd CORS / manifestu.
             */
            if (
                data.type === Hls.ErrorTypes.NETWORK_ERROR
            ) {

                showStreamStatus(
                    `Błąd sieci/CORS — wariant ${candidateIndex + 1}`
                );

                if (
                    fatalErrors >=
                    HLS_CONFIG.maxFatalErrorsPerUrl
                ) {

                    failure(
                        new Error(
                            "NETWORK_ERROR"
                        )
                    );

                } else {

                    setTimeout(() => {

                        if (
                            !resolved &&
                            token === loadingChannelToken
                        ) {

                            try {
                                hls.startLoad();
                            } catch (e) {}
                        }

                    }, HLS_CONFIG.retryDelay);
                }

                return;
            }


            /*
             * Błąd kodeka / media.
             */
            if (
                data.type === Hls.ErrorTypes.MEDIA_ERROR
            ) {

                showStreamStatus(
                    `Błąd media — próba naprawy`
                );

                try {

                    hls.recoverMediaError();

                } catch (e) {

                    failure(
                        new Error(
                            "MEDIA_ERROR"
                        )
                    );
                }

                return;
            }


            /*
             * Każdy inny fatalny błąd.
             */
            failure(
                new Error(
                    data.details ||
                    "HLS_FATAL_ERROR"
                )
            );
        }


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            onManifest
        );

        hls.on(
            Hls.Events.ERROR,
            onError
        );


        /*
         * Timeout zabezpieczający.
         */
        hlsFailTimer =
            setTimeout(() => {

                if (!resolved) {

                    failure(
                        new Error(
                            "HLS_TIMEOUT"
                        )
                    );
                }

            }, HLS_CONFIG.startupTimeout);


        try {

            hls.loadSource(url);

            hls.attachMedia(video);

        } catch (e) {

            failure(e);
        }

    });
}


/* ============================================================
   GŁÓWNA FUNKCJA HLS Z FALLBACKAMI
   ============================================================ */

async function loadHlsWithFallback(
    ch,
    video,
    token
) {

    currentHlsUrls =
        buildHlsCandidates(ch);

    currentHlsIndex = 0;

    hlsAttempt = 0;


    console.log(
        "HLS candidates:",
        currentHlsUrls
    );


    /*
     * Safari / iOS:
     *
     * Jeżeli natywny HLS jest dostępny,
     * możemy spróbować bez hls.js.
     */
    if (
        video.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ) {

        for (
            let i = 0;
            i < currentHlsUrls.length;
            i++
        ) {

            if (
                token !== loadingChannelToken
            ) {
                return;
            }

            const url =
                currentHlsUrls[i];

            showStreamStatus(
                `Natywny HLS: wariant ${i + 1}/${currentHlsUrls.length}`
            );

            video.src = url;

            try {

                await video.play();

                showStreamStatus(
                    "STREAM DZIAŁA",
                    "ok"
                );

                setTimeout(() => {

                    if (
                        token === loadingChannelToken
                    ) {
                        hideStreamStatus();
                    }

                }, 3000);

                return;

            } catch (e) {

                console.warn(
                    "Natywny HLS nie działa:",
                    url,
                    e
                );

                video.removeAttribute('src');

                try {
                    video.load();
                } catch (x) {}
            }
        }
    }


    /*
     * Chrome / Edge / Firefox:
     * HLS.js.
     */
    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        for (
            let i = 0;
            i < currentHlsUrls.length;
            i++
        ) {

            if (
                token !== loadingChannelToken
            ) {
                return;
            }

            currentHlsIndex = i;

            const url =
                currentHlsUrls[i];

            /*
             * Najpierw test CORS.
             *
             * Jeżeli test przejdzie:
             * próbujemy HLS.js.
             *
             * Jeżeli CORS nie przejdzie:
             * i tak próbujemy HLS.js, ponieważ
             * niektóre serwery zachowują się
             * inaczej dla HEAD/fetch i dla HLS.
             */
            showStreamStatus(
                `Sprawdzanie HLS ${i + 1}/${currentHlsUrls.length}...`
            );

            const corsResult =
                await testCors(
                    url,
                    token
                );

            if (
                token !== loadingChannelToken
            ) {
                return;
            }

            if (!corsResult.ok) {

                console.warn(
                    "Możliwy CORS:",
                    url,
                    corsResult
                );

                showStreamStatus(
                    `CORS / brak dostępu — próbuję wariant ${i + 1}`
                );
            } else {

                showStreamStatus(
                    `CORS OK — wariant ${i + 1}`
                );
            }


            /*
             * Próba HLS.
             */
            try {

                await tryHlsUrl(
                    url,
                    video,
                    token,
                    i
                );

                /*
                 * Sukces.
                 */
                return;

            } catch (e) {

                console.warn(
                    "Wariant HLS nie działa:",
                    url,
                    e
                );

                /*
                 * Czyścimy HLS.
                 */
                if (currentHls) {

                    try {
                        currentHls.destroy();
                    } catch (x) {}

                    currentHls = null;
                }

                /*
                 * Czyścimy video.
                 */
                try {

                    video.pause();

                    video.removeAttribute(
                        'src'
                    );

                    video.load();

                } catch (x) {}
            }
        }
    }


    /*
     * Nic nie zadziałało.
     */
    showStreamStatus(
        "Brak działającego wariantu HLS",
        "error"
    );

    console.error(
        "Żaden wariant HLS nie działa:",
        currentHlsUrls
    );
}


/* ============================================================
   LISTA KANAŁÓW
   ============================================================ */

channels.forEach((ch, i) => {

    const li =
        document.createElement('li');

    li.className =
        'channel-item';

    li.dataset.index =
        i;

    li.innerHTML =
        `<span class="channel-number">${i + 1}</span>${ch.name}`;

    li.onclick = () =>
        loadChannel(ch, i);

    channelsUl.appendChild(li);
});


/* ============================================================
   LOAD CHANNEL
   ============================================================ */

function loadChannel(
    ch,
    index = currentChannelIndex
) {

    /*
     * Token zabezpiecza przed sytuacją:
     *
     * kliknięto kanał A
     * -> A zaczyna ładować
     * -> kliknięto B
     * -> A kończy ładowanie po czasie
     *
     * Dzięki tokenowi A nie nadpisze B.
     */
    loadingChannelToken++;

    const token =
        loadingChannelToken;


    currentChannelIndex =
        index;


    destroyCurrentPlayer();


    videoTarget.innerHTML = "";


    document
        .querySelectorAll('.channel-item')
        .forEach(el =>
            el.classList.remove('active')
        );


    const activeItem =
        document.querySelector(
            `.channel-item[data-index="${index}"]`
        );

    if (activeItem) {
        activeItem.classList.add('active');
    }


    channelDisplay.textContent =
        ch.name;

    channelDisplay.classList.add(
        'show'
    );

    clearTimeout(displayTimeout);

    displayTimeout =
        setTimeout(() => {

            channelDisplay.classList.remove(
                'show'
            );

        }, 7000);


    const isBackgroundAudio =
        ch.backgroundAudio === true;


    /* ========================================================
       HLS
       ======================================================== */

    if (ch.type === 'hls') {

        /*
         * CELowo NIE dodajemy tutaj:
         *
         * crossorigin="anonymous"
         *
         * ponieważ to właśnie może blokować
         * streamy bez odpowiednich nagłówków CORS.
         */
        videoTarget.innerHTML =
            `<video id="v"
                ${isBackgroundAudio ? '' : 'controls'}
                autoplay
                playsinline>
            </video>`;


        const v =
            document.getElementById('v');


        if (isBackgroundAudio) {
            v.style.display = 'none';
        }


        /*
         * Nie podłączamy WebAudio automatycznie
         * przed rozpoczęciem odtwarzania.
         */
        v.onplay = () => {

            /*
             * Próba WebAudio jest opcjonalna.
             *
             * Jeżeli CORS nie pozwoli,
             * stream nadal pozostanie odtwarzany.
             */
            if (isBackgroundAudio) {
                connectMediaElement(v);
            }
        };


        v.onerror = () => {

            console.warn(
                "Video element error:",
                v.error
            );
        };


        loadHlsWithFallback(
            ch,
            v,
            token
        );

        return;
    }


    /* ========================================================
       DASH
       ======================================================== */

    if (ch.type === 'dash') {

        videoTarget.innerHTML =
            `<video id="v"
                ${isBackgroundAudio ? '' : 'controls'}
                autoplay
                playsinline>
            </video>`;


        const v =
            document.getElementById('v');


        if (isBackgroundAudio) {
            v.style.display = 'none';
        }


        currentDash =
            dashjs
                .MediaPlayer()
                .create();


        currentDash.initialize(
            v,
            ch.url,
            true
        );


        v.onplay = () => {

            if (isBackgroundAudio) {
                connectMediaElement(v);
            }
        };

        return;
    }


    /* ========================================================
       YOUTUBE
       ======================================================== */

    if (ch.type === 'youtube') {

        videoTarget.innerHTML =
            `<div id="yt-div"></div>`;


        ytPlayer =
            new YT.Player(
                'yt-div',
                {
                    videoId: ch.url,

                    playerVars: {
                        autoplay: 1,
                        playsinline: 1
                    }
                }
            );

        return;
    }


    /* ========================================================
       IFRAME
       ======================================================== */

    if (
        ch.type === 'iframe' ||
        ch.type === 'iframe-dlhd'
    ) {

        videoTarget.innerHTML =
            `<iframe
                src="${ch.url}"
                allow="autoplay; fullscreen"
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
            </iframe>`;

        return;
    }


    /* ========================================================
       AUDIO
       ======================================================== */

    if (ch.type === 'audio') {

        /*
         * Tak samo jak przy HLS:
         *
         * brak crossorigin="anonymous"
         *
         * żeby nie wymuszać CORS.
         */
        videoTarget.innerHTML =
            `<audio
                ${isBackgroundAudio ? '' : 'controls'}
                autoplay
                playsinline>
            </audio>`;


        const a =
            videoTarget.querySelector(
                'audio'
            );


        a.src =
            ch.url;


        if (isBackgroundAudio) {
            a.style.display = 'none';
        }


        a.onplay = () => {

            if (isBackgroundAudio) {
                connectMediaElement(a);
            }
        };


        a.onerror = () => {

            console.warn(
                "Audio error:",
                a.error
            );
        };


        /*
         * Niektóre przeglądarki wymagają
         * rozpoczęcia odtwarzania po interakcji.
         */
        a.play().catch(() => {});

        return;
    }
}


/* ============================================================
   NEXT
   ============================================================ */

function nextChannel() {

    currentChannelIndex =
        (currentChannelIndex + 1) %
        channels.length;

    loadChannel(
        channels[currentChannelIndex],
        currentChannelIndex
    );
}


/* ============================================================
   PREVIOUS
   ============================================================ */

function previousChannel() {

    currentChannelIndex =
        (currentChannelIndex - 1 +
            channels.length) %
        channels.length;

    loadChannel(
        channels[currentChannelIndex],
        currentChannelIndex
    );
}


/* ============================================================
   FULLSCREEN
   ============================================================ */

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        const container =
            document.getElementById(
                'player-container'
            );

        if (
            container.requestFullscreen
        ) {

            container
                .requestFullscreen()
                .catch(() => {});
        }

    } else {

        document
            .exitFullscreen()
            .catch(() => {});
    }
}


/* ============================================================
   FADE PRZYCISKU
   ============================================================ */

function resetFade() {

    const btn =
        document.getElementById(
            'fullscreen-btn'
        );

    btn.classList.remove(
        'fade-out'
    );

    clearTimeout(fadeTimeout);

    fadeTimeout =
        setTimeout(() => {

            btn.classList.add(
                'fade-out'
            );

        }, 3000);
}


document.onmousemove =
    resetFade;


/* ============================================================
   START
   ============================================================ */

loadChannel(
    channels[0],
    0
);


/* ============================================================
   MYSZ
   ============================================================ */

document.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);


document.addEventListener(
    "mousedown",
    function(e) {

        /*
         * Środkowy przycisk:
         * następny kanał.
         */
        if (e.button === 1) {

            e.preventDefault();

            nextChannel();
        }

        /*
         * Prawy przycisk:
         * poprzedni kanał.
         */
        else if (e.button === 2) {

            e.preventDefault();

            previousChannel();
        }
    }

document.addEventListener(

        if (e.key === "ArrowRight") {
