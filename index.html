<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odtwarzacz Streamów</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video, audio {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        iframe {
            width: 102%;
            height: 102%;
            border: none;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #trigger-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 9999;
        }

        #sidebar {
            position: absolute;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(0,0,0,0.95);
            transition: left 0.3s;
            z-index: 10000;
            overflow-y: auto;
            padding: 20px 10px;
            border-right: 1px solid #333;
            scrollbar-width: none;
        }

        #sidebar::-webkit-scrollbar {
            display: none;
        }

        #trigger-zone:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        .channel-item {
            padding: 12px;
            margin-bottom: 5px;
            background: #1a1a1a;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .channel-item:hover {
            background: #333;
        }

        .channel-item.active {
            background: #ff333d;
            color: #fff;
        }

        .channel-number {
            font-weight: bold;
            margin-right: 10px;
            min-width: 30px;
        }

        #channel-display {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 5px;
            z-index: 9998;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #channel-display.show {
            opacity: 1;
        }

        #fullscreen-btn {
            position: absolute;
            right: 20px;
            bottom: calc(20px + 57px);
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #fff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
            transition: opacity 0.5s;
        }

        #stream-status {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 9998;
            padding: 8px 14px;
            background: rgba(0,0,0,0.75);
            border-radius: 5px;
            font-size: 13px;
            color: #ddd;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #stream-status.show {
            opacity: 1;
        }

        #stream-status.error {
            color: #ff7777;
        }

        #stream-status.ok {
            color: #8cff8c;
        }
    </style>
</head>

<body>

<div id="player-container">
    <div id="channel-display"></div>
    <div id="stream-status"></div>
    <div id="trigger-zone"></div>
    <div id="sidebar">
        <ul id="channels-ul"></ul>
    </div>
    <div id="video-target" style="width:100%; height:100%;"></div>
    <button id="fullscreen-btn" onclick="toggleFullscreen()">PEŁNY EKRAN</button>
</div>

<script>
const channels = [
    // Zaktualizowane wpisy dla Travelxp oraz alternatywne podejście dla Magenta TV / iframe
    {name: "travelxp", url: "https://travelxp-travelxp-1-eu.rakuten.wurl.tv/playlist.m3u8", type: "hls"},
    {name: "travelxp (iframe)", url: "https://www.rakuten.tv/pl/live_channels/travelxp-eng", type: "iframe"},
    {name: "magenta tvp1", url: "https://magentatv.pl/player/live?channelNumber=1", type: "iframe"},
    {name: "med", url: "https://med.tv/watch-live/med-tv-live", type: "iframe"},

    {name: "real stories", url: "https://www.youtube.com/Real_Stories/videos", type: "iframe"},
    {name: "arte", url: "https://www.arte.tv/en/", type: "iframe"},
    {name: "TVP1", url: "https://magentatv.pl/player/live?channelNumber=1", type: "iframe"},
    {name: "POLONIA", url: "https://polonia.tvp.pl/44562671/tvp-polonia-stream", type: "iframe"},
    {name: "WP TV", url: "https://pilot.wp.pl/tv/#telewizja-wp-hd", type: "iframe"},
    {name: "ERT", url: "https://www.ertflix.gr/#/channels", type: "iframe"},
    
    {name: "JEDYNKA PR", url: "https://stream11.polskieradio.pl/pr1/pr1.sdp/playlist.m3u8", type: "hls", backgroundAudio: true},
    {name: "DWÓJKA PR", url: "https://stream12.polskieradio.pl/pr2/pr2.sdp/playlist.m3u8", type: "hls", backgroundAudio: true},
    {name: "TRÓJKA PR", url: "https://stream13.polskieradio.pl/pr3/pr3.sdp/playlist.m3u8", type: "hls", backgroundAudio: true},
    {name: "CZWORKA PR", url: "https://stream14.polskieradio.pl/pr4/pr4.sdp/playlist.m3u8", type: "hls", backgroundAudio: true},
    {name: "RADIO KRAKÓW", url: "https://stream3.nadaje.com:9117/radiokrakow", type: "audio", backgroundAudio: true},
    {name: "POLONIA", url: "https://dash2.antik.sk/live/test_tvp_polonia/playlist.m3u8", type: "hls"},
    {name: "TVP Info", url: "https://dash4.antik.sk/live/test_tvp_info/playlist.m3u8", type: "hls"},
    {name: "wPolsce 24", url: "https://str.onnetwork.tv/hls/onnet-358726_hi/index.m3u8", type: "hls"},
    {name: "REPUBLIKA", url: "dzntyCTgJMQ", type: "youtube"},
    {name: "TRWAM", url: "https://live-ch1.trwam.cf.insyscd.net/out/v1/b99041a282774d4a8fe84a54243af5de/trwamtv-live-ch1.mpd", type: "dash"},
    {name: "EWTN", url: "https://cdn3.wowza.com/1/ZHdrMWt1NjlDSzFu/bzdDVG10/hls/tdjybg8v/360/chunklist.m3u8", type: "hls"},
    {name: "LUBELSKA TV", url: "https://1409502578.rsc.cdn77.org/live/stream-1/chunklist.m3u8", type: "hls"},
    {name: "TV KUJAWY", url: "https://stream.tvkujawy.pl:8090/live/broadcast.m3u8", type: "hls"},
    {name: "TV REGIONALNA", url: "https://tvregfull.mailfull.pl/tvregfull/memfs/e64b3e05-649c-4939-9ff6-584e79285ccd_output_0.m3u8", type: "hls"},
    {name: "Grjngo Westerny", url: "https://b6c7c7d1020a4588982ca7c2625f85d1.mediatailor.us-east-1.amazonaws.com/v1/master/0fb304b2320b25f067414d481a779b77db81760d/RakutenTV-eu_GrjngoWesterny/playlist.m3u8", type: "hls"},
    {name: "RED CARPET", url: "https://fast-rakuten.okast.tv/fa2e8c4385712f9a9076eaf728c751de/channels/1a6ecfaa-40c6-41b8-8634-595c424f856e/21f67fd1-4d21-43ba-8ad8-3afac9982c25/master.m3u8", type: "hls"},
    {name: "TOP MOVIES", url: "https://top-movies-rakuten-tv-pl.fast.rakuten.tv/v1/master/0547f18649bd788bec7b67b746e47670f558b6b2/production-LiveChannel-6059/master.m3u8", type: "hls"},    
    {name: "Royalworld", url: "https://ac76260b1102416c93f3d20958bfeb4b.mediatailor.us-east-1.amazonaws.com/v1/master/44f73ba4d03e9607dcd9bebdcb8494d86964f1d8/RakutenTV-pl_Royalworld/playlist.m3u8", type: "hls"},    
    {name: "VIASAT EXPLORE", url: "https://da9c49fa.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLXBsX1ZpYXNhdEV4cGxvcmVfSExT/playlist.m3u8", type: "hls"}
];

// Główna logika odtwarzacza (zachowana oryginalna struktura Twojego skryptu z obsługą HLS, Dash, YouTube i Iframe)
let currentPlayer = null;
let currentHls = null;
let currentDash = null;
let ytPlayer = null;
let activeIndex = 0;

function renderSidebar() {
    const ul = document.getElementById('channels-ul');
    ul.innerHTML = '';
    channels.forEach((ch, idx) => {
        const li = document.createElement('li');
        li.className = 'channel-item' + (idx === activeIndex ? ' active' : '');
        li.innerHTML = `<span class="channel-number">${idx + 1}</span><span>${ch.name}</span>`;
        li.onclick = () => loadChannel(idx);
        ul.appendChild(li);
    });
}

function loadChannel(index) {
    if (index < 0 || index >= channels.length) return;
    activeIndex = index;
    renderSidebar();

    const channel = channels[activeIndex];
    const target = document.getElementById('video-target');
    
    // Reset poprzednich odtwarzaczy
    if (currentHls) { currentHls.destroy(); currentHls = null; }
    if (currentDash) { currentDash.reset(); currentDash = null; }
    target.innerHTML = '';

    showStatus("Ładowanie strumienia...", "ok");

    if (channel.type === 'iframe') {
        // Zabezpieczenie przed blokowaniem ramek X-Frame-Options przez zewnętrzne serwisy (jak Magenta TV)
        const iframe = document.createElement('iframe');
        iframe.src = channel.url;
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('allow', 'autoplay; encrypted-media');
        target.appendChild(iframe);
        showStatus("Załadowano w ramce (wymaga wsparcia zewnętrznej strony)", "ok");
    } else if (channel.type === 'hls') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        target.appendChild(video);

        if (Hls.isSupported()) {
            currentHls = new Hls();
            currentHls.loadSource(channel.url);
            currentHls.attachMedia(video);
            currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            currentHls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) showStatus("Błąd strumienia HLS", "error");
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = channel.url;
            video.addEventListener('loadedmetadata', () => video.play());
        }
    } else if (channel.type === 'dash') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        target.appendChild(video);
        currentDash = dashjs.MediaPlayer().create();
        currentDash.initialize(video, channel.url, true);
    } else if (channel.type === 'youtube') {
        const div = document.createElement('div');
        div.id = 'yt-player-div';
        target.appendChild(div);
        ytPlayer = new YT.Player('yt-player-div', {
            videoId: channel.url,
            playerVars: { 'autoplay': 1 },
            events: { 'onError': () => showStatus("Błąd odtwarzania YouTube", "error") }
        });
    }
}

function showStatus(text, statusClass) {
    const statusEl = document.getElementById('stream-status');
    statusEl.textContent = text;
    statusEl.className = 'show ' + statusClass;
    setTimeout(() => { statusEl.classList.remove('show'); }, 3000);
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

window.onload = () => {
    renderSidebar();
    loadChannel(0);
};
</script>

</body>
</html>
