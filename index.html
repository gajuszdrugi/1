<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odtwarzacz Strumieni</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
        }
        iframe, video, audio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000000;
            cursor: pointer;
        }
        /* Domyślnie zachowujemy proporcje (contain) */
        .video-contain {
            object-fit: contain !important;
        }
        /* Rozciąganie do krawędzi (fill) gdy spełnione warunki */
        .video-fill {
            object-fit: fill !important;
        }
        #error-msg {
            color: #ff5555;
            font-family: monospace;
            padding: 20px;
            display: none;
            z-index: 999;
            position: relative;
        }
        /* Przycisk maksymalizowania wideo (tylko ikona SVG) */
        #fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            cursor: pointer;
            display: none; /* Domyślnie ukryty, widoczny tylko dla m3u8/mpd */
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: background-color 0.2s, border-color 0.2s;
        }
        #fullscreen-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.8);
        }
        #fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }
    </style>
    <!-- HLS.js dla .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Dash.js dla .mpd -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
</head>
<body>
    <div id="error-msg"></div>
    <button id="fullscreen-btn" title="Pełny ekran">
        <svg viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
    </button>

    <script>
        function getTargetUrl() {
            // 1. Sprawdź Hash (#)
            if (window.location.hash) {
                let h = window.location.hash.substring(1);
                try { h = decodeURIComponent(h); } catch(e) {}
                return h;
            }

            // 2. Sprawdź parametr ?url=
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('url')) {
                return urlParams.get('url');
            }

            // 3. Ścieżka po nazwie repozytorium
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            if (pathSegments.length > 1) {
                pathSegments.shift(); // Usuwa nazwę repo
                if (pathSegments.length > 0) {
                    let reconstructed = pathSegments.join('/');
                    if (window.location.search) {
                        reconstructed += window.location.search;
                    }
                    return reconstructed;
                }
            }
            return null;
        }

        let currentActiveElement = null;
        let currentHlsInstance = null;
        let isStreamM3u8OrMpd = false;

        function updateVideoScaling() {
            if (!currentActiveElement || currentActiveElement.tagName !== 'VIDEO') return;

            // Sprawdzenie czy okno jest zmaksymalizowane oraz czy włączony jest tryb pełnoekranowy przeglądarki
            const isWindowMaximized = window.outerWidth >= screen.availWidth && window.outerHeight >= screen.availHeight;
            const isFullscreenActive = !!document.fullscreenElement;

            if (isWindowMaximized && isFullscreenActive) {
                currentActiveElement.classList.remove('video-contain');
                currentActiveElement.classList.add('video-fill');
            } else {
                currentActiveElement.classList.remove('video-fill');
                currentActiveElement.classList.add('video-contain');
            }
        }

        // Nasłuchiwanie zmian trybu pełnoekranowego oraz rozmiaru okna
        document.addEventListener('fullscreenchange', updateVideoScaling);
        window.addEventListener('resize', updateVideoScaling);

        function loadStream() {
            // Usuń poprzednie elementy odtwarzacza, jeśli istnieją
            document.querySelectorAll('iframe, video, audio').forEach(el => el.remove());
            if (currentHlsInstance) {
                currentHlsInstance.destroy();
                currentHlsInstance = null;
            }

            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            fullscreenBtn.style.display = 'none';
            isStreamM3u8OrMpd = false;

            const rawTarget = getTargetUrl();

            if (!rawTarget) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Brak adresu strumienia w URL (użyj np. /#twoj-link)';
                return;
            }

            // Normalizacja HTTPS
            let targetUrl = rawTarget;
            if (targetUrl.startsWith('http://')) {
                targetUrl = targetUrl.replace('http://', 'https://');
            } else if (!targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }

            const lowerUrl = targetUrl.toLowerCase();

            // --- YOUTUBE ---
            if (lowerUrl.includes('youtube.com') || lowerUrl.includes('youtu.be')) {
                let ytEmbedUrl = targetUrl;
                if (targetUrl.includes('watch?v=')) {
                    const urlObj = new URL(targetUrl);
                    const v = urlObj.searchParams.get('v');
                    const list = urlObj.searchParams.get('list');
                    ytEmbedUrl = `https://www.youtube.com/embed/${v}?autoplay=1`;
                    if (list) ytEmbedUrl += `&list=${list}`;
                } else if (!targetUrl.includes('/embed/')) {
                    const match = targetUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                    if (match && match[1]) {
                        const urlObj = new URL(targetUrl);
                        const list = urlObj.searchParams.get('list');
                        ytEmbedUrl = `https://www.youtube.com/embed/${match[1]}?autoplay=1`;
                        if (list) ytEmbedUrl += `&list=${list}`;
                    }
                } else {
                    if (!ytEmbedUrl.includes('autoplay=1')) {
                        ytEmbedUrl += (ytEmbedUrl.includes('?') ? '&' : '?') + 'autoplay=1';
                    }
                }

                const iframe = document.createElement('iframe');
                iframe.src = ytEmbedUrl;
                iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                iframe.setAttribute('allowfullscreen', 'true');
                document.body.appendChild(iframe);
                currentActiveElement = iframe;

            } 
            // --- DASH (.mpd) ---
            else if (lowerUrl.includes('.mpd')) {
                isStreamM3u8OrMpd = true;
                const video = document.createElement('video');
                video.controls = false;
                video.autoplay = true;
                video.muted = false;
                video.className = 'video-contain';
                document.body.appendChild(video);
                currentActiveElement = video;
                fullscreenBtn.style.display = 'flex';

                if (typeof dashjs !== 'undefined') {
                    const player = dashjs.MediaPlayer().create();
                    player.initialize(video, targetUrl, true);
                } else {
                    video.src = targetUrl;
                }
            } 
            // --- HLS / RADIO (.m3u8, .sdp) ---
            else if (lowerUrl.includes('.m3u8') || lowerUrl.includes('.sdp') || lowerUrl.includes('playlist')) {
                const isAudioOnly = lowerUrl.includes('.sdp') || lowerUrl.includes('polskieradio.pl') || lowerUrl.includes('radio');

                if (isAudioOnly) {
                    const audio = document.createElement('audio');
                    audio.autoplay = true;
                    audio.controls = false;
                    document.body.appendChild(audio);
                    currentActiveElement = audio;

                    if (Hls.isSupported() && lowerUrl.includes('.m3u8')) {
                        const hls = new Hls();
                        currentHlsInstance = hls;
                        hls.loadSource(targetUrl);
                        hls.attachMedia(audio);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            audio.play().catch(e => console.log("Autoplay zablokowany."));
                        });
                    } else {
                        audio.src = targetUrl;
                        audio.play().catch(e => console.log("Autoplay zablokowany."));
                    }
                } else {
                    isStreamM3u8OrMpd = true;
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.controls = false;
                    video.className = 'video-contain';
                    document.body.appendChild(video);
                    currentActiveElement = video;
                    fullscreenBtn.style.display = 'flex';

                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        currentHlsInstance = hls;
                        hls.loadSource(targetUrl);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            video.play().catch(e => console.log("Autoplay zablokowany."));
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = targetUrl;
                        video.play().catch(e => console.log("Autoplay zablokowany."));
                    }
                }
            } 
            // --- INNE ---
            else {
                isStreamM3u8OrMpd = true;
                const video = document.createElement('video');
                video.src = targetUrl;
                video.autoplay = true;
                video.controls = false;
                video.className = 'video-contain';
                document.body.appendChild(video);
                currentActiveElement = video;
                fullscreenBtn.style.display = 'flex';
                video.play().catch(e => console.log("Autoplay zablokowany."));
            }

            updateVideoScaling();
        }

        loadStream();

        window.addEventListener('hashchange', () => {
            loadStream();
        });

        // Obsługa kliknięcia w element wideo: pauza / odtwarzanie (z uwzględnieniem kliknięcia w przycisk pełnego ekranu)
        window.addEventListener('click', (e) => {
            if (e.target.closest('#fullscreen-btn')) return;

            if (currentActiveElement && currentActiveElement.tagName === 'VIDEO') {
                if (currentActiveElement.paused) {
                    currentActiveElement.play().catch(err => console.log("Błąd odtwarzania:", err));
                } else {
                    currentActiveElement.pause();
                }
            } else if (currentActiveElement && typeof currentActiveElement.play === 'function' && currentActiveElement.paused) {
                currentActiveElement.play().catch(err => console.log("Błąd odtwarzania:", err));
            }
        });

        // Obsługa przycisku maksymalizowania wideo (Fullscreen API) dla m3u8/mpd
        document.getElementById('fullscreen-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Błąd włączenia pełnego ekranu:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
