<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player</title>
    <!-- Tailwind CSS for full-screen resetting -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js CDN for m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Dash.js CDN for mpd streams -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        iframe, video, audio, div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
            background-color: #000000;
        }
    </style>
</head>
<body class="bg-black">
    <div id="player-container"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('player-container');
            const pathname = window.location.pathname;
            const search = window.location.search;
            const fullUrlString = window.location.href;

            // Check if there is a YouTube video ID or list parameter in search or pathname
            // Example: /fSUMKrxPEd8?list=... or similar
            const urlParams = new URLSearchParams(search);
            
            // Extract potential YouTube ID from pathname (e.g. /repo/VIDEO_ID or just /VIDEO_ID)
            const pathSegments = pathname.split('/').filter(Boolean);
            let potentialYTId = null;
            let streamPathParts = [];

            // GitHub Pages often looks like username.github.io/repository/RESOURCE
            // Let's inspect segments. If the first segment is the repo name and second is a YT id or domain.
            // A standard YouTube ID is typically 11 characters long (alphanumeric, underscores, hyphens).
            const ytIdRegex = /^[a-zA-Z0-9_-]{11}$/;

            for (let i = 0; i < pathSegments.length; i++) {
                if (ytIdRegex.test(pathSegments[i]) && !pathSegments[i].includes('.')) {
                    potentialYTId = pathSegments[i];
                    break;
                }
            }

            // Check if search contains v= or if we found a YT ID in path or if there's a list parameter
            const ytParamV = urlParams.get('v');
            const ytParamList = urlParams.get('list');

            if (ytParamV || (potentialYTId && (ytParamList || pathSegments.length <= 2)) && !pathname.includes('.')) {
                const videoId = ytParamV || potentialYTId;
                let ytEmbedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&fs=0`;
                if (ytParamList) {
                    ytEmbedUrl += `&list=${ytParamList}`;
                }

                container.innerHTML = `
                    <iframe src="${ytEmbedUrl}" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                `;
                return;
            }

            // Reconstruct stream URL from pathname if it contains domain/path like live-ch1.trwam.cf...
            // Find where the actual stream domain/path starts in the full URL or pathname
            // We want everything after the domain + repository prefix if applicable, or parse the remaining path.
            
            // Let's find index of protocol or domain in pathname or full URL
            // If user enters: https://user.github.io/repo/stream11.polskieradio.pl/pr1/pr1.sdp/playlist.m3u8
            // We can search for known extensions or keywords like .m3u8, .mpd, .sdp, .mp3, .aac, or web domains.
            
            let targetStreamUrl = '';
            
            // Look for http/https embedded inside or extract everything after root/repo
            const matchIndex = fullUrlString.indexOf(':/{1,2}', 8); // find protocol after origin
            if (matchIndex !== -1) {
                // If there's an absolute URL embedded
                targetStreamUrl = fullUrlString.substring(matchIndex + 1);
                if (!targetStreamUrl.startsWith('http')) {
                    targetStreamUrl = 'https:' + targetStreamUrl;
                }
            } else {
                // Relative pathname parsing: strip leading slash and repo name if necessary
                // Let's reconstruct by joining path segments that look like a URL path
                // e.g. /repo/live-ch1.trwam.cf.insyscd.net/... -> live-ch1.trwam.cf.insyscd.net/...
                if (pathSegments.length > 0) {
                    // Filter out common gh-pages repo name if it doesn't contain dots or slashes, 
                    // but to be safe, let's stitch all segments after the first or second if it looks like a domain.
                    let candidatePath = pathSegments.join('/');
                    // If candidatePath contains a dot (domain name indicator), treat it as the URL host/path
                    const firstDotIdx = candidatePath.indexOf('.');
                    if (firstDotIdx !== -1) {
                        // Find the start of the domain (could be preceded by repo name)
                        // Let's find the segment that contains a dot
                        const domainSegmentIdx = pathSegments.findIndex(seg => seg.includes('.'));
                        if (domainSegmentIdx !== -1) {
                            const actualPath = pathSegments.slice(domainSegmentIdx).join('/');
                            targetStreamUrl = 'https://' + actualPath + search;
                        }
                    }
                }
            }

            if (!targetStreamUrl) {
                // Fallback: if search has a stream query like ?url=...
                targetStreamUrl = urlParams.get('url') || urlParams.get('src') || '';
            }

            if (!targetStreamUrl) {
                // Default black screen if nothing matched
                return;
            }

            const isAudioStream = targetStreamUrl.includes('.sdp') || 
                                  targetStreamUrl.includes('.mp3') || 
                                  targetStreamUrl.includes('.aac') || 
                                  targetStreamUrl.includes('polskieradio.pl') ||
                                  targetStreamUrl.includes('audio');

            if (isAudioStream) {
                const audio = document.createElement('audio');
                audio.autoplay = true;
                audio.controls = false;
                audio.style.display = 'none';
                document.body.appendChild(audio);

                if (targetStreamUrl.includes('.m3u8') && window.Hls && Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(targetStreamUrl);
                    hls.attachMedia(audio);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        audio.play().catch(e => console.log("Autoplay blocked:", e));
                    });
                } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                    audio.src = targetStreamUrl;
                    audio.addEventListener('loadedmetadata', () => {
                        audio.play().catch(e => console.log("Autoplay blocked:", e));
                    });
                } else {
                    audio.src = targetStreamUrl;
                    audio.play().catch(e => console.log("Autoplay blocked:", e));
                }
            } else {
                const video = document.createElement('video');
                video.autoplay = true;
                video.controls = false;
                video.muted = false;
                video.playsInline = true;
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.backgroundColor = '#000000';
                container.appendChild(video);

                if (targetStreamUrl.endsWith('.m3u8') || targetStreamUrl.includes('.m3u8')) {
                    if (window.Hls && Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(targetStreamUrl);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            video.play().catch(e => console.log("Autoplay blocked:", e));
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = targetStreamUrl;
                        video.addEventListener('loadedmetadata', () => {
                            video.play().catch(e => console.log("Autoplay blocked:", e));
                        });
                    }
                } else if (targetStreamUrl.endsWith('.mpd') || targetStreamUrl.includes('.mpd')) {
                    if (window.dashjs) {
                        const player = dashjs.MediaPlayer().create();
                        player.initialize(video, targetStreamUrl, true);
                    }
                } else {
                    video.src = targetStreamUrl;
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                }
            }
        });
    </script>
</body>
</html>
