<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odtwarzacz Strumieni</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
        }
        iframe, video, audio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000000;
            cursor: pointer;
        }
        /* Domyślnie (niezmaksymalizowane) zachowujemy proporcje */
        .fit-contain {
            object-fit: contain !important;
        }
        /* Rozciąganie gdy okno jest zmaksymalizowane lub pełnoekranowe */
        .fit-fill {
            object-fit: fill !important;
        }

        #error-msg {
            color: #ff5555;
            font-family: monospace;
            padding: 20px;
            display: none;
            z-index: 999;
            position: relative;
        }

        /* Kontener na przyciski nawigacyjne w prawym dolnym rogu */
        .controls-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            gap: 12px;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .action-btn {
            width: 48px;
            height: 48px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .action-btn:hover {
            background-color: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }
        .action-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        .hidden-cursor {
            cursor: none !important;
        }
    </style>
    <!-- HLS.js dla .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Dash.js dla .mpd -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
</head>
<body>
    <div id="error-msg"></div>

    <div class="controls-container" id="controls">
        <!-- Przycisk Picture in Picture (Obraz w obrazie) -->
        <button id="pip-btn" class="action-btn" title="Obraz w obrazie (PiP)" style="display: none;">

            </svg>
        </button>
