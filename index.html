    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
            color: #fff;
            user-select: none;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #000;
        }

        video, audio {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        .radio-mode video, 
        .radio-mode audio {
            display: none !important;
        }

        iframe {
            width: 102%;
            height: 102%;
            border: none;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9990;
            background: transparent;
            pointer-events: none; 
        }

        #trigger-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 9999;
        }

        #sidebar {
            position: absolute;
            left: -320px;
            top: 0;
            width: 320px;
            height: 100%;
            background: rgba(0,0,0,0.95);
            transition: left 0.3s ease;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }

        #trigger-zone:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        #channels-ul {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding: 10px 10px 5px 10px;
            scrollbar-width: none;
        }

        #channels-ul::-webkit-scrollbar {
            display: none;
        }

        .channel-item {
            padding: 6px 10px;
            margin-bottom: 2px;
            background: #1a1a1a;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.15s;
            font-size: 0.9rem;
        }

        .channel-item:hover {
            background: #333;
        }

        .channel-item.active {
            background: #ff333d;
            color: #fff;
        }

        .channel-number {
            font-weight: bold;
            margin-right: 8px;
            min-width: 26px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .channel-item.active .channel-number {
            color: #fff;
        }

        .sidebar-controls {
            padding: 10px;
            border-top: 1px solid #222;
            background: rgba(0,0,0,0.98);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-btn {
            width: 100%;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        #channel-display {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 5px;
            z-index: 9998;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #channel-display.show {
            opacity: 1;
        }

        #stream-status {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 9998;
            padding: 8px 14px;
            background: rgba(0,0,0,0.75);
            border-radius: 5px;
            font-size: 13px;
            color: #ddd;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #stream-status.show {
            opacity: 1;
        }

        #stream-status.error {
            color: #ff7777;
        }

        #stream-status.ok {
            color: #8cff8c;
        }
    </style>
</head>

<body>

<div id="player-container">
    <div id="click-overlay"></div>
    <div id="channel-display"></div>
    <div id="stream-status"></div>
    <div id="trigger-zone"></div>
    
    <div id="sidebar">
        <ul id="channels-ul"></ul>
        <div class="sidebar-controls">

            <button class="sidebar-btn" onclick="toggleFullscreen()">PEŁNY EKRAN</button>
        </div>
    </div>
    
    <div id="video-target" style="width:100%; height:100%;"></div>
</div>
