<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body, html {
        width: 100%;
        height: 100%;
        background-color: #000;
        font-family: sans-serif;
        overflow: hidden;
        color: #fff;
    }

    #player-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    video, audio {
        width: 100%;
        height: 100%;
        border: none;
        background-color: #000;
    }

    iframe {
        width: 102%;
        height: 102%;
        border: none;
        background-color: #000;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    #trigger-zone {
        position: absolute;
        left: 0;
        top: 0;
        width: 30px;
        height: 100%;
        z-index: 9999;
    }

    #sidebar {
        position: absolute;
        left: -300px;
        top: 0;
        width: 300px;
        height: 100%;
        background: rgba(0,0,0,0.95);
        transition: left 0.3s;
        z-index: 10000;
        overflow-y: auto;
        padding: 20px 10px;
        border-right: 1px solid #333;
        scrollbar-width: none;
    }

    #sidebar::-webkit-scrollbar {
        display: none;
    }

    #trigger-zone:hover + #sidebar,
    #sidebar:hover {
        left: 0;
    }

    .channel-item {
        padding: 12px;
        margin-bottom: 5px;
        background: #1a1a1a;
        border-radius: 5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        transition: background 0.2s;
    }

    .channel-item:hover {
        background: #333;
    }

    .channel-item.active {
        background: #ff333d;
        color: #fff;
    }

    .channel-number {
        font-weight: bold;
        margin-right: 10px;
        min-width: 30px;
    }

    #channel-display {
        position: absolute;
        left: 20px;
        top: 20px;
        padding: 10px 20px;
        background: rgba(0,0,0,0.7);
        color: white;
        border-radius: 5px;
        z-index: 9998;
        font-size: 1.2rem;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s;
    }

    #channel-display.show {
        opacity: 1;
    }

    #fullscreen-btn {
        position: absolute;
        right: 20px;
        bottom: calc(20px + 57px);
        padding: 12px 20px;
        background: rgba(0,0,0,0.7);
        border: 1px solid #fff;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        z-index: 999;
        transition: opacity 0.5s;
    }

    .fade-out {
        opacity: 0;
        pointer-events: none;
    }

    #stream-status {
        position: absolute;
        left: 20px;
        bottom: 20px;
        z-index: 9998;
        padding: 8px 14px;
        background: rgba(0,0,0,0.75);
        border-radius: 5px;
        font-size: 13px;
        color: #ddd;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        max-width: calc(100% - 40px);
    }

    #stream-status.show {
        opacity: 1;
    }

    #stream-status.error {
        color: #ff7777;
    }

    #stream-status.ok {
        color: #8cff8c;
    }
</style>


</head>

</div>

const HLS_CONFIG = {

    /*
     * Maksymalny czas oczekiwania na rozpoczęcie
     * prawidłowego ładowania HLS.
     */
    startupTimeout: 15000,

    /*
     * Ile razy próbujemy naprawić fatalny

/* ============================================================
   STATUS
   ============================================================ */

function showStreamStatus(text, type = '') {

    streamStatus.textContent = text;

    streamStatus.classList.remove(
        'show',
        'error',
        'ok'
    );

    if (type) {
        streamStatus.classList.add(type);
    }

    streamStatus.classList.add('show');
}


function hideStreamStatus() {

    streamStatus.classList.remove(
        'show',
        'error',
        'ok'
    );
}


/* ============================================================
   POMOCNICZE
   ============================================================ */

function isHttpUrl(url) {

    try {
        return new URL(url).protocol === 'http:';
    } catch (e) {
        return false;
    }
}


function isHttpsPage() {

    return window.location.protocol === 'https:';
}


function isMixedContentUrl(url) {

    return isHttpsPage() && isHttpUrl(url);
}


function getHlsErrorDescription(data) {

    if (!data) {
        return 'Nieznany błąd HLS';
    }

    const details =
        data.details ||
        data.type ||
        'HLS_ERROR';

    const response =
        data.response;

    let responseInfo = '';

    if (response) {

        if (response.code) {
            responseInfo += ` HTTP ${response.code}`;
        }

        if (response.text) {
            responseInfo += ` ${response.text}`;
        }
    }

    return `${details}${responseInfo}`;
}


/*
 * Określamy, czy błąd wygląda jak CORS / problem
 * z dostępem przeglądarki do zasobu.
 */
function looksLikeCorsError(data) {

    if (!data) {
        return false;
    }

    const details =
        String(
            data.details || ''
        ).toLowerCase();

    const errorText =
        String(
            data.error || ''
        ).toLowerCase();

    const responseText =
        String(
            data.response?.text || ''
        ).toLowerCase();

    const combined =
        `${details} ${errorText} ${responseText}`;

    return (
        combined.includes('cors') ||
        combined.includes('cross-origin') ||
        combined.includes('access-control') ||
        combined.includes('network')
    );
}

/* ============================================================
   BUDOWANIE LISTY HLS
   ============================================================ */

/*
 * WAŻNE:
 *
 * Nie generujemy już:
 *
 * playlist.m3u8
 * playlist720p.m3u8
 *
 * automatycznie.
 *
 * Każdy CDN ma własną strukturę.
 * Automatyczne zgadywanie powodowało
 * dodatkowe błędne żądania.
 *
 * Jeżeli kanał ma alternatywne źródło,
 * należy dodać:
 *
 * fallbackUrls: [
 *     "https://..."
 * ]
 */
function buildHlsCandidates(ch) {

    const urls = [];

    if (
        ch &&
        typeof ch.url === 'string' &&
        ch.url.trim()
    ) {

        urls.push(
            ch.url.trim()
        );
    }


    if (
        Array.isArray(
            ch.fallbackUrls
        )
    ) {

        ch.fallbackUrls.forEach(
            url => {

                if (
                    typeof url === 'string' &&
                    url.trim()
                ) {

                    urls.push(
                        url.trim()
                    );
                }
            }
        );
    }


    return [
        ...new Set(
            urls
        )
    ];
}


/* ============================================================
   RESET MEDIA
   ============================================================ */

function resetMediaElement(media) {

    if (!media) {
        return;
    }

    try {
        media.pause();
    } catch (e) {}


    try {
        media.removeAttribute('src');
    } catch (e) {}


    try {
        media.load();
    } catch (e) {}
}


/* ============================================================
   PRÓBA HLS
   ============================================================ */

function tryHlsUrl(
    url,
    media,
    token,
    candidateIndex
) {

    return new Promise(
        (resolve, reject) => {

            if (
                token !==
                loadingChannelToken
            ) {

                reject(
                    new Error('cancelled')
                );

                return;
            }


            if (
                !window.Hls ||
                !Hls.isSupported()
            ) {

                reject(
                    new Error(
                        'HLS.js not supported'
                    )
                );

                return;
            }


            if (
                isMixedContentUrl(url)
            ) {

                showStreamStatus(
                    'Zablokowany Mixed Content — stream HTTP na stronie HTTPS',
                    'error'
                );

                console.error(
                    'MIXED CONTENT:',
                    url
                );

                reject(
                    new Error(
                        'MIXED_CONTENT'
                    )
                );

                return;
            }


            showStreamStatus(
                `HLS ${candidateIndex + 1}/${currentHlsUrls.length}: łączenie...`
            );


            let resolved = false;
            let fatalErrors = 0;
            let retryCount = 0;
            let startupTimer = null;
            let retryTimer = null;


            const hls =
                new Hls({

                    enableWorker: true,

                    lowLatencyMode: false,

                    backBufferLength: 30,

                    maxBufferLength: 30,

                    maxMaxBufferLength: 60,

                    manifestLoadingMaxRetry: 1,

                    manifestLoadingRetryDelay: 1000,

                    levelLoadingMaxRetry: 2,

                    levelLoadingRetryDelay: 1000,

                    fragLoadingMaxRetry: 2,

                    fragLoadingRetryDelay: 1000,

                    /*
                     * CORS:
                     *
                     * Nie używamy credentials.
                     *
                     * To oznacza:
                     * Access-Control-Allow-Origin może
                     * być "*" po stronie CDN.
                     */
                    xhrSetup: function(xhr) {

                        try {
                            xhr.withCredentials = false;
                        } catch (e) {}
                    }
                });


            currentHls = hls;


            function cleanup() {

                clearTimeout(
                    startupTimer
                );

                clearTimeout(
                    retryTimer
                );


                hls.off(
                    Hls.Events.MANIFEST_PARSED,
                    onManifest
                );

                hls.off(
                    Hls.Events.ERROR,
                    onError
                );
            }


            function success() {

                if (resolved) {
                    return;
                }

                resolved = true;

                cleanup();


                showStreamStatus(
                    'STREAM DZIAŁA',
                    'ok'
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    3000
                );


                resolve(hls);
            }


            function failure(error) {

                if (resolved) {
                    return;
                }

                resolved = true;

                cleanup();


                try {
                    hls.destroy();
                } catch (e) {}


                if (
                    currentHls === hls
                ) {
                    currentHls = null;
                }


                reject(error);
            }


            function onManifest(data) {

                if (
                    token !==
                    loadingChannelToken
                ) {

                    failure(
                        new Error(
                            'cancelled'
                        )
                    );

                    return;
                }


                console.info(
                    '[HLS] Manifest załadowany:',
                    url
                );


                /*
                 * Manifest został pobrany.
                 *
                 * To jednak NIE gwarantuje jeszcze,
                 * że wszystkie segmenty mają poprawny CORS.
                 *
                 * Dlatego stream uznajemy za działający
                 * dopiero po "playing".
                 */

                showStreamStatus(
                    'Manifest OK — uruchamianie streamu...'
                );


                media.play()
                    .then(
                        () => {
                            /*
                             * onplaying również potwierdzi
                             * odtwarzanie.
                             */
                        }
                    )
                    .catch(
                        err => {

                            /*
                             * Autoplay może być zablokowany.
                             * Nie traktujemy tego jako CORS.
                             */
                            console.warn(
                                '[HLS] Autoplay:',
                                err
                            );

                            showStreamStatus(
                                'Stream załadowany — kliknij odtwarzanie'
                            );
                        }
                    );
            }


            function onError(
                event,
                data
            ) {

                if (
                    token !==
                    loadingChannelToken
                ) {

                    failure(
                        new Error(
                            'cancelled'
                        )
                    );

                    return;
                }


                const description =
                    getHlsErrorDescription(
                        data
                    );


                console.warn(
                    '[HLS ERROR]',
                    {
                        url,
                        type: data?.type,
                        details: data?.details,
                        fatal: data?.fatal,
                        response: data?.response,
                        frag: data?.frag,
                        level: data?.level,
                        description
                    }
                );


                /*
                 * Szczegółowe komunikaty.
                 */

                if (
                    data.details ===
                    Hls.ErrorDetails.MANIFEST_LOAD_ERROR
                ) {

                    showStreamStatus(
                        `Nie można pobrać manifestu: ${description}`,
                        'error'
                    );
                }


                else if (
                    data.details ===
                    Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT
                ) {

                    showStreamStatus(
                        'Timeout podczas pobierania manifestu',
                        'error'
                    );
                }


                else if (
                    data.details ===
                    Hls.ErrorDetails.LEVEL_LOAD_ERROR
                ) {

                    showStreamStatus(
                        'Błąd playlisty wariantu HLS — możliwy CORS',
                        'error'
                    );
                }


                else if (
                    data.details ===
                    Hls.ErrorDetails.LEVEL_LOAD_TIMEOUT
                ) {

                    showStreamStatus(
                        'Timeout playlisty wariantu HLS',
                        'error'
                    );
                }


                else if (
                    data.details ===
                    Hls.ErrorDetails.FRAG_LOAD_ERROR
                ) {

                    showStreamStatus(
                        'Błąd segmentu HLS — sprawdź CORS CDN',
                        'error'
                    );
                }


                else if (
                    data.details ===
                    Hls.ErrorDetails.FRAG_LOAD_TIMEOUT
                ) {

                    showStreamStatus(
                        'Timeout segmentu HLS',
                        'error'
                    );
                }


                else if (
                    looksLikeCorsError(data)
                ) {

                    showStreamStatus(
                        'Błąd sieci/CORS — sprawdź nagłówki CDN',
                        'error'
                    );
                }


                /*
                 * Nie-fatalne błędy są obsługiwane
                 * przez hls.js.
                 */

                if (
                    !data.fatal
                ) {

                    return;
                }


                fatalErrors++;


                /*
                 * ==================================================
                 * NETWORK ERROR
                 * ==================================================
                 */

                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    console.error(
                        '[HLS NETWORK ERROR]',
                        url,
                        data
                    );


                    if (
                        retryCount <
                        HLS_CONFIG.retriesPerUrl
                    ) {

                        retryCount++;


                        showStreamStatus(
                            `Błąd sieci/CORS — ponowienie ${retryCount}/${HLS_CONFIG.retriesPerUrl}`
                        );


                        clearTimeout(
                            retryTimer
                        );


                        retryTimer =
                            setTimeout(
                                () => {

                                    if (
                                        resolved ||
                                        token !==
                                        loadingChannelToken
                                    ) {
                                        return;
                                    }


                                    try {

                                        hls.startLoad();

                                    } catch (e) {

                                        console.warn(
                                            '[HLS] startLoad:',
                                            e
                                        );
                                    }

                                },
                                HLS_CONFIG.retryDelay
                            );


                        return;
                    }


                    failure(
                        new Error(
                            'NETWORK_ERROR'
                        )
                    );


                    return;
                }


                /*
                 * ==================================================
                 * MEDIA ERROR
                 * ==================================================
                 */

                if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    showStreamStatus(
                        'Błąd dekodowania — próba naprawy...'
                    );


                    try {

                        hls.recoverMediaError();

                        return;

                    } catch (e) {

                        console.warn(
                            '[HLS] recoverMediaError:',
                            e
                        );


                        failure(
                            new Error(
                                'MEDIA_ERROR'
                            )
                        );

                        return;
                    }
                }


                /*
                 * ==================================================
                 * OTHER FATAL ERROR
                 * ==================================================
                 */

                console.error(
                    '[HLS FATAL]',
                    url,
                    data
                );


                failure(
                    new Error(
                        data.details ||
                        'HLS_FATAL_ERROR'
                    )
                );
            }


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                onManifest
            );


            hls.on(
                Hls.Events.ERROR,
                onError
            );


            /*
             * Potwierdzenie realnego rozpoczęcia odtwarzania.
             */

            const onPlaying =
                () => {

                    if (
                        token !==
                        loadingChannelToken
                    ) {
                        return;
                    }


                    success();
                };


            const onWaiting =
                () => {

                    if (
                        !resolved
                    ) {

                        showStreamStatus(
                            'Buforowanie HLS...'
                        );
                    }
                };


            const onMediaError =
                () => {

                    if (
                        !resolved
                    ) {

                        console.warn(
                            '[MEDIA ERROR]',
                            media.error
                        );
                    }
                };


            media.addEventListener(
                'playing',
                onPlaying,
                {
                    once: true
                }
            );


            media.addEventListener(
                'waiting',
                onWaiting
            );


            media.addEventListener(
                'error',
                onMediaError
            );


            /*
             * Timeout startowy.
             */

            startupTimer =
                setTimeout(
                    () => {

                        if (
                            !resolved
                        ) {

                            console.error(
                                '[HLS TIMEOUT]',
                                url
                            );


                            failure(
                                new Error(
                                    'HLS_TIMEOUT'
                                )
                            );
                        }

                    },
                    HLS_CONFIG.startupTimeout
                );


            try {

                /*
                 * Najpierw attachMedia,
                 * potem loadSource.
                 *
                 * Taka kolejność jest stabilniejsza
                 * w różnych wersjach hls.js.
                 */

                hls.attachMedia(
                    media
                );


                hls.loadSource(
                    url
                );


            } catch (e) {

                console.error(
                    '[HLS START ERROR]',
                    e
                );


                failure(e);
            }
        }
    );
}


/* ============================================================
   GŁÓWNA FUNKCJA HLS
   ============================================================ */

async function loadHlsWithFallback(
    ch,
    media,
    token
) {

    currentHlsUrls =
        buildHlsCandidates(ch);

    currentHlsIndex = 0;


    if (
        !currentHlsUrls.length
    ) {

        showStreamStatus(
            'Brak adresu HLS',
            'error'
        );

        return;
    }


    console.log(
        '[HLS] Lista źródeł:',
        currentHlsUrls
    );


    /*
     * ==========================================================
     * NATYWNY HLS
     * ==========================================================
     *
     * Safari/iOS może obsługiwać HLS natywnie.
     *
     * Nie wykonujemy tutaj fetch() testującego CORS.
     */

    if (
        media.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ) {

        for (
            let i = 0;
            i < currentHlsUrls.length;
            i++
        ) {

            if (
                token !==
                loadingChannelToken
            ) {
                return;
            }


            const url =
                currentHlsUrls[i];


            if (
                isMixedContentUrl(url)
            ) {

                console.warn(
                    '[HLS] Pomijam HTTP na stronie HTTPS:',
                    url
                );

                continue;
            }


            currentHlsIndex = i;


            showStreamStatus(
                `Natywny HLS ${i + 1}/${currentHlsUrls.length}...`
            );


            resetMediaElement(
                media
            );


            media.src =
                url;


            try {

                await media.play();


                if (
                    token !==
                    loadingChannelToken
                ) {
                    return;
                }


                showStreamStatus(
                    'STREAM DZIAŁA',
                    'ok'
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    3000
                );


                return;

            } catch (e) {

                console.warn(
                    '[HLS native] Nie działa:',
                    url,
                    e
                );


                resetMediaElement(
                    media
                );
            }
        }
    }


    /*
     * ==========================================================
     * HLS.JS
     * ==========================================================
     */

    if (
        !window.Hls ||
        !Hls.isSupported()
    ) {

        showStreamStatus(
            'Przeglądarka nie obsługuje HLS.js',
            'error'
        );

        return;
    }


    for (
        let i = 0;
        i < currentHlsUrls.length;
        i++
    ) {

        if (
            token !==
            loadingChannelToken
        ) {
            return;
        }


        currentHlsIndex = i;


        const url =
            currentHlsUrls[i];


        /*
         * Mixed Content wykrywamy przed HLS.js.
         */

        if (
            isMixedContentUrl(url)
        ) {

            console.warn(
                '[HLS] Mixed Content:',
                url
            );


            showStreamStatus(
                'HTTP stream zablokowany przez HTTPS — Mixed Content',
                'error'
            );


            continue;
        }


        /*
         * NIE MA JUŻ:
         *
         * testCors()
         *
         *
         * Bezpośrednio przekazujemy URL
         * do HLS.js.
         */

        showStreamStatus(
            `HLS ${i + 1}/${currentHlsUrls.length}: ładowanie...`
        );


        try {

            await tryHlsUrl(
                url,
                media,
                token,
                i
            );


            if (
                token !==
                loadingChannelToken
            ) {
                return;
            }


            /*
             * Sukces.
             */

            return;

        } catch (e) {

            if (
                token !==
                loadingChannelToken
            ) {
                return;
            }


            console.warn(
                `[HLS] Źródło ${i + 1} nie działa:`,
                url,
                e
            );


            /*
             * Jeżeli to był CORS/network error,
             * informujemy dokładnie.
             */

            if (
                e.message ===
                'NETWORK_ERROR'
            ) {

                showStreamStatus(
                    `Brak dostępu do HLS — możliwy CORS (${i + 1}/${currentHlsUrls.length})`,
                    'error'
                );
            }


            else if (
                e.message ===
                'HLS_TIMEOUT'
            ) {

                showStreamStatus(
                    `Timeout HLS (${i + 1}/${currentHlsUrls.length})`,
                    'error'
                );
            }


            else {

                showStreamStatus(
                    `Źródło HLS nie działa (${i + 1}/${currentHlsUrls.length})`,
                    'error'
                );
            }


            /*
             * Czyścimy poprzedni HLS.
             */

            if (
                currentHls
            ) {

                try {
                    currentHls.destroy();
                } catch (x) {}

                currentHls = null;
            }


            resetMediaElement(
                media
            );
        }
    }


    /*
     * Nic nie zadziałało.
     */

    showStreamStatus(
        'Brak działającego źródła HLS',
        'error'
    );


    console.error(
        '[HLS] Żadne źródło nie działa:',
        currentHlsUrls
    );
}


/* ============================================================
   LISTA KANAŁÓW
   ============================================================ */

channels.forEach(
    (ch, i) => {

        const li =
            document.createElement(
                'li'
            );


        li.className =
            'channel-item';


        li.dataset.index =
            i;


        li.textContent =
            `${i + 1} ${ch.name}`;


        li.onclick =
            () =>
                loadChannel(
                    ch,
                    i
                );


        channelsUl.appendChild(
            li
        );
    }
);


/* ============================================================
   LOAD CHANNEL
   ============================================================ */

function loadChannel(
    ch,
    index = currentChannelIndex
) {

    /*
     * Nowy token unieważnia wszystkie poprzednie
     * operacje asynchroniczne.
     */

    loadingChannelToken++;


    const token =
        loadingChannelToken;


    currentChannelIndex =
        index;


    destroyCurrentPlayer();


    videoTarget.innerHTML =
        "";


    document
        .querySelectorAll(
            '.channel-item'
        )
        .forEach(
            el =>
                el.classList.remove(
                    'active'
                )
        );


    const activeItem =
        document.querySelector(
            `.channel-item[data-index="${index}"]`
        );


    if (activeItem) {

        activeItem.classList.add(
            'active'
        );
    }


    channelDisplay.textContent =
        ch.name;


    channelDisplay.classList.add(
        'show'
    );


    clearTimeout(
        displayTimeout
    );


    displayTimeout =
        setTimeout(
            () => {

                channelDisplay.classList.remove(
                    'show'
                );

            },
            7000
        );


    hideStreamStatus();


    const isBackgroundAudio =
        ch.backgroundAudio === true;


    /* ========================================================
       HLS
       ======================================================== */

    if (
        ch.type === 'hls'
    ) {

        if (
            isBackgroundAudio
        ) {

            videoTarget.innerHTML =
                `
                <audio
                    id="v"
                    autoplay
                    playsinline
                    preload="auto">
                </audio>
                `;

        } else {

            videoTarget.innerHTML =
                `
                <video
                    id="v"
                    controls
                    autoplay
                    playsinline>
                </video>
                `;
        }


        const v =
            document.getElementById(
                'v'
            );


        if (
            isBackgroundAudio
        ) {

            v.style.display =
                'none';
        }


        v.onplaying =
            () => {

                if (
                    token !==
                    loadingChannelToken
                ) {
                    return;
                }


                showStreamStatus(
                    'STREAM DZIAŁA',
                    'ok'
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );
            };


        v.onwaiting =
            () => {

                if (
                    token ===
                    loadingChannelToken
                ) {

                    showStreamStatus(
                        'Buforowanie...'
                    );
                }
            };


        v.onerror =
            () => {

                console.warn(
                    '[HLS MEDIA ERROR]',
                    v.error
                );
            };


        loadHlsWithFallback(
            ch,
            v,
            token
        );


        return;
    }


    /* ========================================================
       DASH
       ======================================================== */

    if (
        ch.type === 'dash'
    ) {

        videoTarget.innerHTML =
            `
            <video
                id="v"
                controls
                autoplay
                playsinline>
            </video>
            `;


        const v =
            document.getElementById(
                'v'
            );


        if (
            isBackgroundAudio
        ) {

            v.style.display =
                'none';
        }


        showStreamStatus(
            'Ładowanie DASH...'
        );


        currentDash =
            dashjs
                .MediaPlayer()
                .create();


        /*
         * dash.js również korzysta z żądań
         * cross-origin.
         *
         * Nie możemy naprawić braku CORS
         * po stronie CDN z poziomu JS.
         */

        currentDash.initialize(
            v,
            ch.url,
            true
        );


        v.onplaying =
            () => {

                if (
                    token !==
                    loadingChannelToken
                ) {
                    return;
                }


                showStreamStatus(
                    'STREAM DZIAŁA',
                    'ok'
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );
            };


        v.onerror =
            () => {

                console.warn(
                    '[DASH ERROR]',
                    v.error,
                    ch.url
                );


                showStreamStatus(
                    'Błąd DASH / możliwy CORS',
                    'error'
                );
            };


        return;
    }


    /* ========================================================
       YOUTUBE
       ======================================================== */

    if (
        ch.type === 'youtube'
    ) {

        videoTarget.innerHTML =
            `<div id="yt-div"></div>`;


        if (
            !window.YT ||
            !YT.Player
        ) {

            showStreamStatus(
                'YouTube API jeszcze się ładuje'
            );


            setTimeout(
                () => {

                    if (
                        token ===
                        loadingChannelToken
                    ) {

                        loadChannel(
                            ch,
                            index
                        );
                    }

                },
                1000
            );


            return;
        }


        ytPlayer =
            new YT.Player(
                'yt-div',
                {
                    videoId:
                        ch.url,

                    playerVars: {
                        autoplay: 1,
                        playsinline: 1,
                        rel: 0
                    },

                    events: {

                        onStateChange:
                            function(event) {

                                if (
                                    token !==
                                    loadingChannelToken
                                ) {
                                    return;
                                }


                                if (
                                    event.data ===
                                    YT.PlayerState.PLAYING
                                ) {

                                    showStreamStatus(
                                        'STREAM DZIAŁA',
                                        'ok'
                                    );


                                    setTimeout(
                                        () => {

                                            if (
                                                token ===
                                                loadingChannelToken
                                            ) {

                                                hideStreamStatus();
                                            }

                                        },
                                        2500
                                    );
                                }
                            },

                        onError:
                            function(event) {

                                console.warn(
                                    '[YouTube]',
                                    event.data
                                );


                                showStreamStatus(
                                    'Błąd YouTube',
                                    'error'
                                );
                            }
                    }
                }
            );


        return;
    }


    /* ========================================================
       IFRAME
       ======================================================== */

    if (
        ch.type === 'iframe' ||
        ch.type === 'iframe-dlhd'
    ) {

        videoTarget.innerHTML =
            `
            <iframe
                src="${ch.url}"
                allow="autoplay; fullscreen"
                allowfullscreen
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
            </iframe>
            `;


        showStreamStatus(
            'Ładowanie strony...'
        );


        return;
    }


    /* ========================================================
       AUDIO
       ======================================================== */

    if (
        ch.type === 'audio'
    ) {

        videoTarget.innerHTML =
            `
            <audio
                id="radio-audio"
                autoplay
                playsinline
                preload="none">
            </audio>
            `;


        const a =
            document.getElementById(
                'radio-audio'
            );


        a.src =
            ch.url;


        if (
            isBackgroundAudio
        ) {

            a.style.display =
                'none';

        } else {

            a.controls =
                true;
        }


        a.onplaying =
            () => {

                if (
                    token !==
                    loadingChannelToken
                ) {
                    return;
                }


                showStreamStatus(
                    'RADIO DZIAŁA',
                    'ok'
                );


                setTimeout(
                    () => {

                        if (
                            token ===
                            loadingChannelToken
                        ) {

                            hideStreamStatus();
                        }

                    },
                    2500
                );
            };


        a.onerror =
            () => {

                console.warn(
                    '[RADIO ERROR]',
                    a.error,
                    ch.url
                );


                showStreamStatus(
                    'Błąd odtwarzania radia',
                    'error'
                );
            };


        a.onwaiting =
            () => {

                if (
                    token ===
                    loadingChannelToken
                ) {

                    showStreamStatus(
                        'Ładowanie radia...'
                    );
                }
            };


        a.onstalled =
            () => {

                console.warn(
                    '[RADIO STALLED]',
                    ch.url
                );
            };


        a.play()
            .catch(
                err => {

                    console.warn(
                        '[RADIO AUTOPLAY]',
                        err
                    );


                    showStreamStatus(
                        'Radio oczekuje na uruchomienie'
                    );
                }
            );


        return;
    }


    /*
     * Nieznany typ.
     */

    showStreamStatus(
        `Nieobsługiwany typ: ${ch.type}`,
        'error'
    );
}


/* ============================================================
   NEXT
   ============================================================ */

function nextChannel() {

    currentChannelIndex =
        (
            currentChannelIndex + 1
        ) %
        channels.length;


    loadChannel(
        channels[
            currentChannelIndex
        ],
        currentChannelIndex
    );
}


/* ============================================================
   PREVIOUS
   ============================================================ */

function previousChannel() {

    currentChannelIndex =
        (
            currentChannelIndex - 1 +
            channels.length
        ) %
        channels.length;


    loadChannel(
        channels[
            currentChannelIndex
        ],
        currentChannelIndex
    );
}


/* ============================================================
   FULLSCREEN
   ============================================================ */

function toggleFullscreen() {

    if (
        !document.fullscreenElement
    ) {

        const container =
            document.getElementById(
                'player-container'
            );


        if (
            container.requestFullscreen
        ) {

            container
                .requestFullscreen()
                .catch(
                    () => {}
                );
        }

    } else {

        document
            .exitFullscreen()
            .catch(
                () => {}
            );
    }
}


/* ============================================================
   FADE PRZYCISKU
   ============================================================ */

function resetFade() {

    const btn =
        document.getElementById(
            'fullscreen-btn'
        );


    btn.classList.remove(
        'fade-out'
    );


    clearTimeout(
        fadeTimeout
    );


    fadeTimeout =
        setTimeout(
            () => {

                btn.classList.add(
                    'fade-out'
                );

            },
            3000
        );
}


document.addEventListener(
    'mousemove',
    resetFade
);


/* ============================================================
   START
   ============================================================ */

loadChannel(
    channels[0],
    0
);

resetFade();


/* ============================================================
   MYSZ
   ============================================================ */

document.addEventListener(
    'contextmenu',
    e => {
        e.preventDefault();
    }
);


document.addEventListener(
    'mousedown',
    function(e) {

        /*
         * Środkowy przycisk:
         * następny kanał.
         */

        if (
            e.button === 1
        ) {

            e.preventDefault();

            nextChannel();
        }


        /*
         * Prawy przycisk:
         * poprzedni kanał.
         */

        else if (
            e.button === 2
        ) {

            e.preventDefault();

            previousChannel();
        }
    }
);


/* ============================================================
   KLAWIATURA
   ============================================================ */

document.addEventListener(
    'keydown',
    function(e) {

        if (
            e.key === 'ArrowRight'
        ) {

            nextChannel();
        }


        if (
            e.key === 'ArrowLeft'
        ) {

            previousChannel();
        }


        if (
            e.key === 'f' ||
            e.key === 'F'
        ) {

            toggleFullscreen();
        }
    }
);


/* ============================================================
   URUCHOMIENIE RADIA PO INTERAKCJI
   ============================================================ */

document.addEventListener(
    'click',
    function() {

        const audio =
            document.querySelector(
                '#radio-audio'
            );


        if (audio) {

            audio.play()
                .catch(
                    () => {}
                );
        }
    }
);


document.addEventListener(
    'touchstart',
    function() {

        const audio =
            document.querySelector(
                '#radio-audio'
            );


        if (audio) {

            audio.play()
                .catch(
                    () => {}
                );
        }
    },
    {
        passive: true
    }
);

</script>
