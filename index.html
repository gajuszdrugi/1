        }

        html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video,
        audio {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        iframe {
            width: 102%;
            height: 102%;
            border: none;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #trigger-zone {
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 9999;
        }

        #sidebar {
            position: absolute;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            transition: left 0.3s;
            z-index: 10000;
            overflow-y: auto;
            padding: 20px 10px;
            border-right: 1px solid #333;
            scrollbar-width: none;
        }

        #sidebar::-webkit-scrollbar {
            display: none;
        }

        #trigger-zone:hover + #sidebar,
        #sidebar:hover {
            left: 0;
        }

        .channel-item {
            padding: 12px;
            margin-bottom: 5px;
            background: #1a1a1a;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .channel-item:hover {
            background: #333;
        }

        .channel-item.active {
            background: #ff333d;
            color: #fff;
        }

        .channel-number {
            font-weight: bold;
            margin-right: 10px;
            min-width: 30px;
        }

        #channel-display {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 5px;
            z-index: 9998;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #channel-display.show {
            opacity: 1;
        }

        #fullscreen-btn {
            position: absolute;
            right: 20px;
            bottom: calc(20px + 57px);
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #fff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
            transition: opacity 0.5s;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>

            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            console.warn("Web Audio API niedostępne.");
            return;
        }

        audioCtx = new AudioContext();


        /*
         * Kompresor zapobiegający clippingowi.
         */
        compressorNode =
            audioCtx.createDynamicsCompressor();

        compressorNode.threshold.setValueAtTime(
            -12,
            audioCtx.currentTime
        );

        compressorNode.knee.setValueAtTime(
            3,
            audioCtx.currentTime
        );

        compressorNode.ratio.setValueAtTime(
            12,
            audioCtx.currentTime
        );

        compressorNode.attack.setValueAtTime(
            0.003,
            audioCtx.currentTime
        );

        compressorNode.release.setValueAtTime(
            0.25,
            audioCtx.currentTime
        );


        /*
         * Głośność.
         */
        gainNode = audioCtx.createGain();

        gainNode.gain.setValueAtTime(
            0.2,
            audioCtx.currentTime
        );


        /*
         * Źródło -> kompresor -> gain -> głośniki.
         */
        compressorNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);
    }


    if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
    }
}


function connectMediaElement(element) {

    try {

        initAudioContext();

        if (!audioCtx) {
            return;
        }


        /*
         * Jednego elementu MediaElement nie można podłączyć
         * wielokrotnie przez createMediaElementSource().
         */
        if (audioSourceNode) {

            try {
                audioSourceNode.disconnect();
            } catch (e) {}

            audioSourceNode = null;
        }


        audioSourceNode =
            audioCtx.createMediaElementSource(element);

        audioSourceNode.connect(compressorNode);

    } catch (e) {

        /*
         * To nie powinno zatrzymywać odtwarzania.
         */
        console.warn(
            "Web Audio API error:",
            e
        );
    }
}

   LISTA KANAŁÓW

channels.forEach((ch, i) => {

    };

/* ============================================================
   HLS — GENEROWANIE LISTY ADRESÓW
   ============================================================ */

function getHlsCandidates(ch) {

    const candidates = [];


    /*
     * Jeśli kanał posiada urls[],
     * używamy wszystkich podanych adresów.
     */
    if (Array.isArray(ch.urls)) {

        for (const url of ch.urls) {

            if (typeof url === "string" && url.trim()) {
                candidates.push(url.trim());
            }
        }
    }


    /*
     * Standardowe url.
     */
    if (
        typeof ch.url === "string" &&
        ch.url.trim()
    ) {
        candidates.push(ch.url.trim());
    }


    /*
     * Automatyczny wariant playlist720p.m3u8.
     *
     * Przykład:
     *
     * playlist.m3u8
     *
     * ->
     *
     * playlist720p.m3u8
     */
    const currentCandidates = [...candidates];

    for (const url of currentCandidates) {

        try {

            const parsed = new URL(url);

            const pathname = parsed.pathname;


            if (
                pathname.endsWith("/playlist.m3u8") ||
                pathname.endsWith("playlist.m3u8")
            ) {

                parsed.pathname =
                    pathname.replace(
                        /playlist\.m3u8$/,
                        "playlist720p.m3u8"
                    );

                candidates.push(
                    parsed.toString()
                );
            }

        } catch (e) {

            /*
             * Niepoprawny URL — HLS.js później
             * zgłosi błąd.
             */
        }
    }


    /*
     * Usuwamy duplikaty.
     */
    return [
        ...new Set(
            candidates.filter(Boolean)
        )
    ];
}


/* ============================================================
   HLS — RESET
   ============================================================ */

function clearHlsTimers() {

    if (hlsRetryTimer) {

        clearTimeout(hlsRetryTimer);
        hlsRetryTimer = null;
    }


    if (hlsWatchdogTimer) {

        clearTimeout(hlsWatchdogTimer);
        hlsWatchdogTimer = null;
    }
}


function destroyHls() {

    clearHlsTimers();


    if (currentHls) {

        try {
            currentHls.destroy();
        } catch (e) {}

        currentHls = null;
    }


    hlsCandidates = [];
    hlsCandidateIndex = 0;

    hlsStarted = false;
    hlsSwitching = false;
}


/* ============================================================
   HLS — INFORMACJA DLA UŻYTKOWNIKA
   ============================================================ */

function showHlsStatus(ch, text) {

    channelDisplay.textContent =
        `${ch.name} — ${text}`;

    channelDisplay.classList.add("show");

    clearTimeout(displayTimeout);

    displayTimeout = setTimeout(() => {

        channelDisplay.classList.remove("show");

    }, 5000);
}


/* ============================================================
   HLS — NASTĘPNY STREAM
   ============================================================ */

function switchToNextHlsCandidate(
    ch,
    video,
    sessionId
) {

    /*
     * Jeżeli użytkownik już zmienił kanał,
     * niczego nie rób.
     */
    if (sessionId !== playerSessionId) {
        return;
    }


    const nextIndex =
        hlsCandidateIndex + 1;


    if (nextIndex >= hlsCandidates.length) {

        console.error(
            "[HLS] Brak kolejnych źródeł dla:",
            ch.name
        );

        hlsSwitching = false;

        showHlsStatus(
            ch,
            "brak działającego streamu"
        );

        return;
    }


    console.warn(
        `[HLS] Fallback ${nextIndex + 1}/${hlsCandidates.length}`
    );


    hlsSwitching = false;


    /*
     * Mała przerwa zapobiega wyścigom pomiędzy
     * starym i nowym HLS.
     */
    hlsRetryTimer = setTimeout(() => {

        if (sessionId !== playerSessionId) {
            return;
        }

        tryHlsCandidate(
            ch,
            video,
            nextIndex,
            sessionId
        );

    }, 400);
}


/* ============================================================
   HLS — PRÓBA KONKRETNEGO ŹRÓDŁA
   ============================================================ */

function tryHlsCandidate(
    ch,
    video,
    candidateIndex,
    sessionId
) {

    if (sessionId !== playerSessionId) {
        return;
    }


    if (
        candidateIndex < 0 ||
        candidateIndex >= hlsCandidates.length
    ) {

        showHlsStatus(
            ch,
            "brak działającego streamu"
        );

        return;
    }


    if (hlsSwitching) {
        return;
    }


    hlsSwitching = true;

    hlsCandidateIndex = candidateIndex;

    hlsStarted = false;


    const url =
        hlsCandidates[candidateIndex];


    console.log(
        `[HLS] Próba ${candidateIndex + 1}/${hlsCandidates.length}:`,
        url
    );


    showHlsStatus(
        ch,
        `sprawdzanie źródła ${candidateIndex + 1}/${hlsCandidates.length}`
    );


    /*
     * Usuń poprzedni HLS.
     */
    if (currentHls) {

        try {
            currentHls.destroy();
        } catch (e) {}

        currentHls = null;
    }


    clearHlsTimers();


    /* ========================================================
       HLS.JS
       ======================================================== */

    if (
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ) {

        const hls = new Hls({

            enableWorker: true,

            /*
             * Nie męcz jednego niedziałającego serwera
             * w nieskończoność.
             */
            manifestLoadingMaxRetry: 1,
            levelLoadingMaxRetry: 1,
            fragLoadingMaxRetry: 2,

            /*
             * Krótsze timeouty umożliwiają szybki fallback.
             */
            manifestLoadingTimeOut: 8000,
            levelLoadingTimeOut: 8000,
            fragLoadingTimeOut: 10000,

            /*
             * Stabilniejsze przełączanie.
             */
            lowLatencyMode: false
        });


        currentHls = hls;


        /*
         * Manifest poprawnie odczytany.
         */
        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                if (
                    sessionId !== playerSessionId ||
                    currentHls !== hls
                ) {
                    return;
                }


                console.log(
                    "[HLS] Manifest OK:",
                    url
                );


                hlsStarted = true;
                hlsSwitching = false;


                clearTimeout(hlsRetryTimer);
                hlsRetryTimer = null;


                showHlsStatus(
                    ch,
                    "OK"
                );


                /*
                 * Autoplay.
                 */
                video.play().catch(() => {});


                /*
                 * Watchdog.
                 *
                 * Jeżeli po znalezieniu manifestu video
                 * nadal nie zacznie odtwarzać danych,
                 * próbujemy kolejnego źródła.
                 */
                hlsWatchdogTimer = setTimeout(() => {

                    if (
                        sessionId !== playerSessionId ||
                        currentHls !== hls
                    ) {
                        return;
                    }


                    if (
                        video.readyState < 2 &&
                        video.paused
                    ) {

                        console.warn(
                            "[HLS] Watchdog: stream nie rozpoczął odtwarzania:",
                            url
                        );


                        try {
                            hls.destroy();
                        } catch (e) {}


                        if (currentHls === hls) {
                            currentHls = null;
                        }


                        hlsStarted = false;
                        hlsSwitching = false;


                        switchToNextHlsCandidate(
                            ch,
                            video,
                            sessionId
                        );
                    }

                }, 12000);
            }
        );


        /*
         * Dane zaczęły faktycznie płynąć.
         */
        hls.on(
            Hls.Events.FRAG_LOADED,
            () => {

                if (
                    sessionId !== playerSessionId ||
                    currentHls !== hls
                ) {
                    return;
                }


                if (!hlsStarted) {

                    hlsStarted = true;
                    hlsSwitching = false;

                    clearTimeout(hlsWatchdogTimer);
                    hlsWatchdogTimer = null;

                    showHlsStatus(
                        ch,
                        "odtwarzanie"
                    );
                }
            }
        );


        /*
         * Błędy HLS.
         */
        hls.on(
            Hls.Events.ERROR,
            (event, data) => {

                if (
                    sessionId !== playerSessionId ||
                    currentHls !== hls
                ) {
                    return;
                }


                console.warn(
                    "[HLS ERROR]",
                    {
                        url: url,
                        type: data.type,
                        details: data.details,
                        fatal: data.fatal
                    }
                );


                /*
                 * Błąd fatalny.
                 *
                 * Może oznaczać:
                 *
                 * - CORS
                 * - 403
                 * - 404
                 * - niedostępny manifest
                 * - błąd sieci
                 * - nieobsługiwany format
                 */
                if (data.fatal) {

                    console.warn(
                        "[HLS] Fatal error — przechodzę do następnego źródła."
                    );


                    clearHlsTimers();


                    try {
                        hls.destroy();
                    } catch (e) {}


                    if (currentHls === hls) {
                        currentHls = null;
                    }


                    hlsStarted = false;
                    hlsSwitching = false;


                    switchToNextHlsCandidate(
                        ch,
                        video,
                        sessionId
                    );
                }
            }
        );


        /*
         * Ładowanie źródła.
         */
        try {

            hls.loadSource(url);
            hls.attachMedia(video);

        } catch (error) {

            console.error(
                "[HLS] loadSource/attachMedia:",
                error
            );


            try {
                hls.destroy();
            } catch (e) {}


            if (currentHls === hls) {
                currentHls = null;
            }


            hlsStarted = false;
            hlsSwitching = false;


            switchToNextHlsCandidate(
                ch,
                video,
                sessionId
            );

            return;
        }


        /*
         * Timeout manifestu.
         */
        hlsRetryTimer = setTimeout(() => {

            if (
                sessionId !== playerSessionId ||
                currentHls !== hls
            ) {
                return;
            }


            if (!hlsStarted) {

                console.warn(
                    "[HLS] Timeout manifestu:",
                    url
                );


                try {
                    hls.destroy();
                } catch (e) {}


                if (currentHls === hls) {
                    currentHls = null;
                }


                hlsStarted = false;
                hlsSwitching = false;


                switchToNextHlsCandidate(
                    ch,
                    video,
                    sessionId
                );
            }

        }, 10000);


        return;
    }


    /* ========================================================
       NATYWNY HLS — SAFARI / iOS
       ======================================================== */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        console.log(
            "[Native HLS] Próba:",
            url
        );


        let finished = false;


        const cleanup = () => {

            video.removeEventListener(
                "loadedmetadata",
                onSuccess
            );

            video.removeEventListener(
                "canplay",
                onSuccess
            );

            video.removeEventListener(
                "error",
                onError
            );
        };


        const onSuccess = () => {

            if (finished) {
                return;
            }

            finished = true;

            cleanup();


            if (sessionId !== playerSessionId) {
                return;
            }


            console.log(
                "[Native HLS] OK:",
                url
            );


            hlsStarted = true;
            hlsSwitching = false;


            showHlsStatus(
                ch,
                "odtwarzanie"
            );


            video.play().catch(() => {});
        };


        const onError = () => {

            if (finished) {
                return;
            }

            finished = true;

            cleanup();


            if (sessionId !== playerSessionId) {
                return;
            }


            console.warn(
                "[Native HLS] Błąd:",
                url
            );


            hlsStarted = false;
            hlsSwitching = false;


            switchToNextHlsCandidate(
                ch,
                video,
                sessionId
            );
        };


        video.addEventListener(
            "loadedmetadata",
            onSuccess
        );

        video.addEventListener(
            "canplay",
            onSuccess
        );

        video.addEventListener(
            "error",
            onError
        );


        video.src = url;


        hlsRetryTimer = setTimeout(() => {

            if (finished) {
                return;
            }

            finished = true;

            cleanup();


            if (
                sessionId !== playerSessionId
            ) {
                return;
            }


            console.warn(
                "[Native HLS] Timeout:",
                url
            );


            hlsStarted = false;
            hlsSwitching = false;


            switchToNextHlsCandidate(
                ch,
                video,
                sessionId
            );

        }, 10000);


        return;
    }


    /*
     * Brak obsługi HLS.
     */
    console.error(
        "Przeglądarka nie obsługuje HLS."
    );

    hlsSwitching = false;

    showHlsStatus(
        ch,
        "HLS nieobsługiwany"
    );
}


/* ============================================================
   HLS — URUCHOMIENIE
   ============================================================ */

function startHls(
    ch,
    video,
    sessionId
) {

    hlsCandidates =
        getHlsCandidates(ch);


    hlsCandidateIndex = 0;

    hlsStarted = false;
    hlsSwitching = false;


    if (!hlsCandidates.length) {

        console.error(
            "[HLS] Brak adresów dla:",
            ch.name
        );

        showHlsStatus(
            ch,
            "brak adresu HLS"
        );

        return;
    }


    console.log(
        "[HLS] Lista kandydatów:",
        hlsCandidates
    );


    tryHlsCandidate(
        ch,
        video,
        0,
        sessionId
    );
}


/* ============================================================
   HLS — AUTOMATYCZNE PONOWNE POŁĄCZENIE
   ============================================================ */

function setupHlsRecovery(
    ch,
    video,
    sessionId
) {

    /*
     * Jeśli przeglądarka zgłosi błąd elementu video,
     * HLS.js może nie zawsze zgłosić wszystko jako fatal.
     */
    video.addEventListener(
        "error",
        () => {

            if (
                sessionId !== playerSessionId ||
                !hlsStarted
            ) {
                return;
            }


            console.warn(
                "[VIDEO] Błąd elementu video — restart HLS."
            );


            /*
             * Krótki timeout, aby uniknąć pętli.
             */
            clearTimeout(hlsRetryTimer);


            hlsRetryTimer = setTimeout(() => {

                if (
                    sessionId !== playerSessionId
                ) {
                    return;
                }


                /*
                 * Najpierw próbujemy ponownie ten sam URL.
                 */
                if (
                    hlsCandidateIndex <
                    hlsCandidates.length
                ) {

                    hlsStarted = false;
                    hlsSwitching = false;


                    tryHlsCandidate(
                        ch,
                        video,
                        hlsCandidateIndex,
                        sessionId
                    );
                }

            }, 1500);
        }
    );
}


/* ============================================================
   ŁADOWANIE KANAŁU
   ============================================================ */

function loadChannel(
    ch,
    index = currentChannelIndex
) {

    /*
     * Nowa sesja odtwarzacza.
     */
    playerSessionId++;

    const sessionId =
        playerSessionId;


    currentChannelIndex = index;


    /*
     * Zatrzymaj HLS.
     */
    destroyHls();


    /*
     * Usuń DASH.
     */
    if (currentDash) {

        try {
            currentDash.reset();
        } catch (e) {}

        currentDash = null;
    }


    /*
     * Usuń YouTube.
     */
    if (ytPlayer) {

        try {
            ytPlayer.destroy();
        } catch (e) {}

        ytPlayer = null;
    }


    /*
     * Wyczyść poprzedni element.
     */
    videoTarget.innerHTML = "";


    /*
     * Aktywny kanał.
     */
    document
        .querySelectorAll(".channel-item")
        .forEach(el => {
            el.classList.remove("active");
        });


    const activeItem =
        document.querySelector(
            `.channel-item[data-index="${index}"]`
        );


    if (activeItem) {
        activeItem.classList.add("active");
    }


    /*
     * Nazwa kanału.
     */
    channelDisplay.textContent =
        ch.name;

    channelDisplay.classList.add("show");


    clearTimeout(displayTimeout);


    displayTimeout = setTimeout(() => {

        channelDisplay.classList.remove("show");

    }, 7000);


    const isBackgroundAudio =
        ch.backgroundAudio === true;


    /* ========================================================
       HLS
       ======================================================== */

    if (ch.type === "hls") {

        videoTarget.innerHTML = `
            <video
                id="v"
                ${isBackgroundAudio ? "" : "controls"}
                autoplay
                playsinline
                crossorigin="anonymous">
            </video>
        `;


        const v =
            document.getElementById("v");


        if (isBackgroundAudio) {
            v.style.display = "none";
        }


        /*
         * Web Audio.
         */
        v.addEventListener(
            "play",
            () => {

                if (
                    sessionId !== playerSessionId
                ) {
                    return;
                }

                connectMediaElement(v);
            },
            {once: true}
        );


        /*
         * Recovery.
         */
        setupHlsRecovery(
            ch,
            v,
            sessionId
        );


        /*
         * Start HLS.
         */
        startHls(
            ch,
            v,
            sessionId
        );


        return;
    }


    /* ========================================================
       DASH
       ======================================================== */

    if (ch.type === "dash") {

        videoTarget.innerHTML = `
            <video
                id="v"
                ${isBackgroundAudio ? "" : "controls"}
                autoplay
                playsinline
                crossorigin="anonymous">
            </video>
        `;


        const v =
            document.getElementById("v");


        if (isBackgroundAudio) {
            v.style.display = "none";
        }


        currentDash =
            dashjs.MediaPlayer().create();


        currentDash.initialize(
            v,
            ch.url,
            true
        );


        v.onplay = () => {

            if (
                sessionId !== playerSessionId
            ) {
                return;
            }

            connectMediaElement(v);
        };


        return;
    }


    /* ========================================================
       YOUTUBE
       ======================================================== */

    if (ch.type === "youtube") {

        videoTarget.innerHTML =
            `<div id="yt-div"></div>`;


        /*
         * YouTube API może być jeszcze w trakcie
         * ładowania.
         */
        const createYoutube = () => {

            if (
                sessionId !== playerSessionId
            ) {
                return;
            }


            if (
                typeof YT === "undefined" ||
                !YT.Player
            ) {

                setTimeout(
                    createYoutube,
                    300
                );

                return;
            }


            ytPlayer =
                new YT.Player(
                    "yt-div",
                    {
                        videoId: ch.url,

                        playerVars: {
                            autoplay: 1,
                            playsinline: 1
                        }
                    }
                );
        };


        createYoutube();

        return;
    }


    /* ========================================================
       IFRAME
       ======================================================== */

    if (
        ch.type === "iframe" ||
        ch.type === "iframe-dlhd"
    ) {

        videoTarget.innerHTML = `
            <iframe
                src="${escapeHtmlAttribute(ch.url)}"
                allow="autoplay; fullscreen"
                allowfullscreen
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
            </iframe>
        `;

        return;
    }


    /* ========================================================
       AUDIO
       ======================================================== */

    if (ch.type === "audio") {

        videoTarget.innerHTML = `
            <audio
                ${isBackgroundAudio ? "" : "controls"}
                autoplay
                crossorigin="anonymous"
                src="${escapeHtmlAttribute(ch.url)}">
            </audio>
        `;


        const a =
            videoTarget.querySelector("audio");


        if (isBackgroundAudio) {
            a.style.display = "none";
        }


        a.onplay = () => {

            if (
                sessionId !== playerSessionId
            ) {
                return;
            }

            connectMediaElement(a);
        };


        return;
    }
}


/* ============================================================
   BEZPIECZNE WSTAWIANIE URL DO HTML
   ============================================================ */

function escapeHtmlAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}


/* ============================================================
   NEXT / PREVIOUS
   ============================================================ */

function nextChannel() {

    currentChannelIndex =
        (currentChannelIndex + 1) %
        channels.length;


    loadChannel(
        channels[currentChannelIndex],
        currentChannelIndex
    );
}


function previousChannel() {

    currentChannelIndex =
        (
            currentChannelIndex -
            1 +
            channels.length
        ) %
        channels.length;


    loadChannel(
        channels[currentChannelIndex],
        currentChannelIndex
    );
}


/* ============================================================
   FULLSCREEN
   ============================================================ */

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        document
            .getElementById("player-container")
            .requestFullscreen()
            .catch(err => {

                console.warn(
                    "Fullscreen error:",
                    err
                );
            });

    } else {

        document.exitFullscreen();
    }
}


/* ============================================================
   FADE BUTTON
   ============================================================ */

function resetFade() {

    const button =
        document.getElementById(
            "fullscreen-btn"
        );


    button.classList.remove(
        "fade-out"
    );


    clearTimeout(fadeTimeout);


    fadeTimeout =
        setTimeout(() => {

            button.classList.add(
                "fade-out"
            );

        }, 3000);
}


document.onmousemove =
    resetFade;

);
