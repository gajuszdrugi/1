<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odtwarzacz Strumieni</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        iframe, video, audio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain; /* Zachowanie proporcji (letterbox/pillarbox) */
            background-color: #000000;
        }
        #error-msg {
            color: #ff5555;
            font-family: monospace;
            padding: 20px;
            display: none;
            z-index: 999;
            position: relative;
        }

        /* Pasek sterowania (widoczny po najechaniu myszką) */
        .controls-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        body:hover .controls-overlay {
            opacity: 1;
        }
        .controls-overlay button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .controls-overlay button:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
    <!-- HLS.js dla .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Dash.js dla .mpd -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
</head>
<body>
    <div id="error-msg"></div>

    <!-- Pasek sterowania -->
    <div class="controls-overlay" id="controls">
        <button id="playPauseBtn" onclick="togglePlayPause()">Pauza</button>
        <button id="stopBtn" onclick="stopStream()">Stop</button>
        <button id="fullscreenBtn" onclick="toggleFullscreen()">Pełny ekran</button>
    </div>

    <script>
        function getTargetUrl() {
            if (window.location.hash) {
                let h = window.location.hash.substring(1);
                try { h = decodeURIComponent(h); } catch(e) {}
                return h;
            }

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('url')) {
                return urlParams.get('url');
            }

            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            if (pathSegments.length > 1) {
                pathSegments.shift();
                if (pathSegments.length > 0) {
                    let reconstructed = pathSegments.join('/');
                    if (window.location.search) {
                        reconstructed += window.location.search;
                    }
                    return reconstructed;
                }
            }
            return null;
        }

        let currentActiveElement = null;
        let currentHlsInstance = null;
        let dashPlayerInstance = null;

        function loadStream() {
            document.querySelectorAll('iframe, video, audio').forEach(el => el.remove());
            if (currentHlsInstance) {
                currentHlsInstance.destroy();
                currentHlsInstance = null;
            }
            if (dashPlayerInstance) {
                dashPlayerInstance.reset();
                dashPlayerInstance = null;
            }

            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';

            const rawTarget = getTargetUrl();

            if (!rawTarget) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Brak adresu strumienia w URL (użyj np. /#twoj-link)';
                document.getElementById('controls').style.display = 'none';
                return;
            }

            let targetUrl = rawTarget;
            if (targetUrl.startsWith('http://')) {
                targetUrl = targetUrl.replace('http://', 'https://');
            } else if (!targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }

            const lowerUrl = targetUrl.toLowerCase();

            // --- YOUTUBE ---
            if (lowerUrl.includes('youtube.com') || lowerUrl.includes('youtu.be')) {
                let ytEmbedUrl = targetUrl;
                if (targetUrl.includes('watch?v=')) {
                    const urlObj = new URL(targetUrl);
                    const v = urlObj.searchParams.get('v');
                    const list = urlObj.searchParams.get('list');
                    ytEmbedUrl = `https://www.youtube.com/embed/${v}?autoplay=1`;
                    if (list) ytEmbedUrl += `&list=${list}`;
                } else if (!targetUrl.includes('/embed/')) {
                    const match = targetUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                    if (match && match[1]) {
                        const urlObj = new URL(targetUrl);
                        const list = urlObj.searchParams.get('list');
                        ytEmbedUrl = `https://www.youtube.com/embed/${match[1]}?autoplay=1`;
                        if (list) ytEmbedUrl += `&list=${list}`;
                    }
                } else {
                    if (!ytEmbedUrl.includes('autoplay=1')) {
                        ytEmbedUrl += (ytEmbedUrl.includes('?') ? '&' : '?') + 'autoplay=1';
                    }
                }

                const iframe = document.createElement('iframe');
                iframe.src = ytEmbedUrl;
                iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                iframe.setAttribute('allowfullscreen', 'true');
                document.body.appendChild(iframe);
                currentActiveElement = iframe;
            } 
            // --- DASH (.mpd) ---
            else if (lowerUrl.includes('.mpd')) {
                const video = document.createElement('video');
                video.controls = false;
                video.autoplay = true;
                video.muted = false;
                document.body.appendChild(video);
                currentActiveElement = video;

                if (typeof dashjs !== 'undefined') {
                    dashPlayerInstance = dashjs.MediaPlayer().create();
                    dashPlayerInstance.initialize(video, targetUrl, true);
                } else {
                    video.src = targetUrl;
                }
            } 
            // --- HLS / RADIO (.m3u8, .sdp) ---
            else if (lowerUrl.includes('.m3u8') || lowerUrl.includes('.sdp') || lowerUrl.includes('playlist')) {
                const isAudioOnly = lowerUrl.includes('.sdp') || lowerUrl.includes('polskieradio.pl') || lowerUrl.includes('radio');

                if (isAudioOnly) {
                    const audio = document.createElement('audio');
                    audio.autoplay = true;
                    audio.controls = false;
                    document.body.appendChild(audio);
                    currentActiveElement = audio;

                    if (Hls.isSupported() && lowerUrl.includes('.m3u8')) {
                        const hls = new Hls();
                        currentHlsInstance = hls;
                        hls.loadSource(targetUrl);
                        hls.attachMedia(audio);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            audio.play().catch(e => console.log("Autoplay zablokowany."));
                        });
                    } else {
                        audio.src = targetUrl;
                        audio.play().catch(e => console.log("Autoplay zablokowany."));
                    }
                } else {
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.controls = false;
                    document.body.appendChild(video);
                    currentActiveElement = video;

                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        currentHlsInstance = hls;
                        hls.loadSource(targetUrl);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            video.play().catch(e => console.log("Autoplay zablokowany."));
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = targetUrl;
                        video.play().catch(e => console.log("Autoplay zablokowany."));
                    }
                }
            } 
            // --- INNE ---
            else {
                const video = document.createElement('video');
                video.src = targetUrl;
                video.autoplay = true;
                video.controls = false;
                document.body.appendChild(video);
                currentActiveElement = video;
                video.play().catch(e => console.log("Autoplay zablokowany."));
            }
        }

        // Funkcje sterujące
        function togglePlayPause() {
            if (!currentActiveElement) return;
            // Dla tagów video / audio HTML5
            if (typeof currentActiveElement.paused === 'boolean') {
                const btn = document.getElementById('playPauseBtn');
                if (currentActiveElement.paused) {
                    currentActiveElement.play();
                    btn.innerText = 'Pauza';
                } else {
                    currentActiveElement.pause();
                    btn.innerText = 'Start';
                }
            }
        }

        function stopStream() {
            document.querySelectorAll('iframe, video, audio').forEach(el => el.remove());
            if (currentHlsInstance) {
                currentHlsInstance.destroy();
                currentHlsInstance = null;
            }
            if (dashPlayerInstance) {
                dashPlayerInstance.reset();
                dashPlayerInstance = null;
            }
            currentActiveElement = null;
            document.getElementById('playPauseBtn').innerText = 'Start';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Błąd pełnego ekranu:", err);
                });
                document.getElementById('fullscreenBtn').innerText = 'Wyjdź z pełnego ekranu';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                document.getElementById('fullscreenBtn').innerText = 'Pełny ekran';
            }
        }

        // Aktualizacja etykiety przycisku fullscreen w przypadku wyjścia klawiszem ESC
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreenBtn');
            if (!document.fullscreenElement) {
                btn.innerText = 'Pełny ekran';
            } else {
                btn.innerText = 'Wyjdź z pełnego ekranu';
            }
        });

        // Uruchomienie przy pierwszym załadowaniu
        loadStream();

        window.addEventListener('hashchange', () => {
            loadStream();
        });

        // Kliknięcie w tło w celu wznowienia (jeśli zablokowany autoplay)
        window.addEventListener('click', (e) => {
            // Nie wyzwalaj kliknięcia, jeśli kliknięto w panel sterowania
            if (e.target.closest('#controls')) return;

            if (currentActiveElement && typeof currentActiveElement.play === 'function' && currentActiveElement.paused) {
                currentActiveElement.play().catch(err => console.log("Błąd odtwarzania:", err));
                document.getElementById('playPauseBtn').innerText = 'Pauza';
            }
        });
    </script>
</body>
</html>
