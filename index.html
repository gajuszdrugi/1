let pipWindow = null;

async function togglePictureInPicture() {
    const video = document.querySelector('#video-target video');
    const container = document.getElementById('video-target');

    // 1. Jeśli odtwarzany jest strumień wideo HLS / MP4 (znacznik <video>)
    if (video) {
        try {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else {
                await video.requestPictureInPicture();
            }
        } catch (err) {
            showStatus('Nie można uruchomić obrazu w obrazie dla tego wideo', 'error');
        }
        return;
    }

    // 2. Jeśli odtwarzany jest YouTube / Iframe (wykorzystanie Document Picture-in-Picture API)
    if ('documentPictureInPicture' in window) {
        try {
            if (pipWindow) {
                pipWindow.close();
                pipWindow = null;
                return;
            }

            // Otwórz pływające okno o wymiarach odtwarzacza
            pipWindow = await window.documentPictureInPicture.requestWindow({
                width: 640,
                height: 360
            });

            // Przenieś element wideo/iframe z kontenera do okna PiP
            pipWindow.document.body.style.margin = '0';
            pipWindow.document.body.style.backgroundColor = '#000';
            pipWindow.document.body.appendChild(container);

            // Po zamknięciu okienka PiP, przywróć odtwarzacz z powrotem na stronę
            pipWindow.addEventListener('pagehide', () => {
                const playerContainer = document.getElementById('player-container');
                playerContainer.appendChild(container);
                pipWindow = null;
            });
        } catch (err) {
            showStatus('Błąd otwierania okna PiP', 'error');
        }
    } else {
        // Zapasowa informacja dla przeglądarek bez obsługi Document PiP (np. Firefox)
        showStatus('Aby włączyć PiP na YouTube: kliknij 2 razy PRAWYM przyciskiem myszy na wideo i wybierz "Obraz w obrazie"', 'error');
    }
}
